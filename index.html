function ensureMaster() {
  if (music.master) return;
  music.limiter = new Tone.Limiter(-1).toDestination();
  music.comp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).connect(music.limiter);
  music.master = new Tone.Gain(0).connect(music.comp);      // music crossfades here
  music.sfxBus = new Tone.Gain(0.9).connect(music.limiter); // effects skip the compressor
  music.analyser = new Tone.Analyser('fft', 32);
  music.analyser.smoothing = 0.6;
  music.master.connect(music.analyser);
}

function cleanupMusic() {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.swing = 0;
  music.parts.forEach(p => { try { p.dispose(); } catch {} });
  music.nodes.forEach(n => { try { n.dispose(); } catch {} });
  music.parts = []; music.nodes = []; music.fx = null;
  music.playing = false;
}

// Level 1 -> base tempo, level 5 -> +15%. Grit on the lead line at 4-5.
function applyIntensity(level, ramp = 1) {
  if (!music.fx || !music.mood) return;
  const t = Math.max(ramp, 0.01);
  Tone.Transport.bpm.rampTo(MOODS[music.mood].bpm * (1 + 0.15 * (level - 1) / 4), t);
  music.fx.dist.wet.rampTo(level >= 5 ? 0.5 : level === 4 ? 0.25 : 0, t);
  music.fx.crunch.wet.rampTo(level >= 5 ? 0.3 : level === 4 ? 0.12 : 0, t);
}

const moodGain = mood => MOODS[mood]?.gain ?? 0.9;

async function playMood(mood) {
  if (!window.Tone || !MOODS[mood]) return;
  const token = ++music.token;
  ensureMaster();

  if (music.playing) {
    music.master.gain.rampTo(0, FADE_OUT);
    await wait(FADE_OUT * 1000);
    if (token !== music.token) return;
  }
  cleanupMusic();
  music.master.gain.cancelScheduledValues(Tone.now());
  music.master.gain.value = 0;

  const bus = track(new Tone.Gain(1).connect(music.master));
  const reverb = track(new Tone.Reverb({ decay: 3, wet: 0.3 }).connect(bus));
  await reverb.ready;
  if (token !== music.token) return;
  const delay = track(new Tone.FeedbackDelay('8n.', 0.25).connect(reverb));
  delay.wet.value = 0.35;
  const dist = track(new Tone.Distortion(0.6));
  const crunch = track(new Tone.Chebyshev(20));
  dist.wet.value = 0; crunch.wet.value = 0;
  const lead = track(new Tone.Gain(1));
  lead.chain(dist, crunch, reverb);

  music.mood = mood;
  music.fx = { dist, crunch };
  MOODS[mood].build({ bus, reverb, delay, lead });
  Tone.Transport.bpm.value = MOODS[mood].bpm;
  applyIntensity(state.level, 0);

  Tone.Transport.start('+0.05');
  music.playing = true;
  music.master.gain.rampTo(moodGain(mood), FADE_IN);
  updateMusicUI();
}

// ---------- sound effects ----------
const sfx = { ready: false };

function sfxInit() {
  if (sfx.ready) return;
  ensureMaster();
  const out = music.sfxBus;
  sfx.pop = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.12, sustain: 0, release: 0.05 }, volume: -10 }).connect(out);
  sfx.whooshF = new Tone.Filter({ type: 'bandpass', frequency: 400, Q: 1.4 }).connect(out);
  sfx.whoosh = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.06, decay: 0.26, sustain: 0 }, volume: 8 }).connect(sfx.whooshF);
  sfx.boing = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.45, sustain: 0, release: 0.05 }, volume: -8 }).connect(out);
  sfx.whistle = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.02, decay: 0, sustain: 1, release: 0.06 }, volume: -10 }).connect(out);
  sfx.clickF = new Tone.Filter(1800, 'highpass').connect(out);
  sfx.click = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.03, sustain: 0 }, volume: -10 }).connect(sfx.clickF);
  sfx.scratchF = new Tone.Filter({ type: 'bandpass', frequency: 2000, Q: 4 }).connect(out);
  sfx.scratch = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.005, decay: 0.24, sustain: 0 }, volume: 4 }).connect(sfx.scratchF);
  sfx.bone = new Tone.MonoSynth({ oscillator: { type: 'sawtooth' }, filter: { type: 'lowpass', Q: 1 }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 0.25 },
    filterEnvelope: { attack: 0.05, decay: 0.3, sustain: 0.6, baseFrequency: 300, octaves: 2 }, volume: -10 }).connect(out);
  // button sounds
  sfx.diceF = new Tone.Filter({ type: 'bandpass', frequency: 2500, Q: 3 }).connect(out);
  sfx.dice = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.02, sustain: 0 }, volume: 4 }).connect(sfx.diceF);
  sfx.thud = new Tone.MembraneSynth({ pitchDecay: 0.02, octaves: 2, envelope: { attack: 0.001, decay: 0.12, sustain: 0 }, volume: -6 }).connect(out);
  sfx.bell = new Tone.FMSynth({ harmonicity: 3.01, modulationIndex: 10, envelope: { attack: 0.001, decay: 1.1, sustain: 0, release: 0.4 },
    modulationEnvelope: { attack: 0.001, decay: 0.5, sustain: 0, release: 0.2 }, volume: -12 }).connect(out);
  sfx.kazooF = new Tone.Filter({ type: 'bandpass', frequency: 1100, Q: 2.5 }).connect(out);
  sfx.kazoo = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.02, decay: 0.05, sustain: 0.9, release: 0.06 }, volume: -2 }).connect(sfx.kazooF);
  sfx.theremin = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.08, decay: 0, sustain: 1, release: 0.25 }, volume: -10 }).connect(out);
  sfx.organ = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 20 }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.5, release: 0.6 }, volume: -20 })
    .connect(new Tone.Filter(1600, 'lowpass').connect(out));
  sfx.laughF = new Tone.Filter({ type: 'bandpass', frequency: 750, Q: 3 }).connect(out);
  sfx.laugh = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.01, decay: 0.08, sustain: 0, release: 0.03 }, volume: 2 }).connect(sfx.laughF);
  sfx.thunder = new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.05, decay: 1.2, sustain: 0 }, volume: -3 }).connect(new Tone.Filter(260, 'lowpass').connect(out));
  sfx.horn = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'sawtooth' }, envelope: { attack: 0.01, decay: 0.05, sustain: 0.9, release: 0.08 }, volume: -16 })
    .connect(new Tone.Filter(3200, 'lowpass').connect(out));
  sfx.sweep = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.005, decay: 0, sustain: 1, release: 0.05 }, volume: -12 })
    .connect(new Tone.Filter(2200, 'lowpass').connect(out));
  sfx.ready = true;
}

const SFX = {
  // message sent: whoosh up
  send(t) {
    sfx.whooshF.frequency.setValueAtTime(350, t);
    sfx.whooshF.frequency.exponentialRampToValueAtTime(3800, t + 0.3);
    sfx.whoosh.triggerAttackRelease(0.3, t);
  },
  // reply arrived: bloop, pitch per member slot
  pop(t, slot = 0) {
    const f = [523, 659, 784, 988][slot % 4];
    sfx.pop.triggerAttack(f, t);
    sfx.pop.frequency.exponentialRampToValueAtTime(f * 1.6, t + 0.07);
    sfx.pop.triggerRelease(t + 0.1);
  },
  // reaction sticker: boing
  boing(t) {
    sfx.boing.frequency.cancelScheduledValues(t);
    sfx.boing.triggerAttack(220, t);
    sfx.boing.frequency.setValueCurveAtTime([220, 560, 330, 480, 370, 440, 400], t + 0.005, 0.4);
    sfx.boing.triggerRelease(t + 0.42);
  },
  // level up / down: slide whistle
  slide(t, up = true) {
    const [a, b] = up ? [480, 1500] : [1500, 480];
    sfx.whistle.triggerAttack(a, t);
    sfx.whistle.frequency.exponentialRampToValueAtTime(b, t + 0.3);
    sfx.whistle.triggerRelease(t + 0.32);
  },
  // chaos machine: reel tick, end-stop thunk, lever ratchet, landing ding
  tick(t) { sfx.click.triggerAttackRelease(0.008, t, 0.35); },
  thunk(t) { sfx.boing.triggerAttack(110, t); sfx.boing.frequency.exponentialRampToValueAtTime(70, t + 0.08); sfx.boing.triggerRelease(t + 0.1); },
  lever(t) { for (let i = 0; i < 4; i++) sfx.click.triggerAttackRelease(0.01, t + i * 0.035, 0.6); },
  ding(t) {
    sfx.pop.triggerAttack(1319, t); sfx.pop.triggerRelease(t + 0.08);
    sfx.whistle.triggerAttack(1760, t + 0.09); sfx.whistle.triggerRelease(t + 0.35);
  },
  // Randomize: dice rattling in a cup, then two landing clunks
  dice(t) {
    let at = t;
    for (let i = 0; i < 9; i++) {
      sfx.diceF.frequency.setValueAtTime(1800 + Math.random() * 2600, at);
      sfx.dice.triggerAttackRelease(0.015, at, 0.5 + Math.random() * 0.5);
      at += 0.035 + i * 0.008 + Math.random() * 0.02;
    }
    sfx.thud.triggerAttackRelease('A3', 0.1, at + 0.03);
    sfx.thud.triggerAttackRelease('E3', 0.1, at + 0.13, 0.7);
  },
  // Chaos levels, one signature sound each
  lvl1(t) { sfx.bell.triggerAttackRelease('E6', 0.5, t); sfx.bell.triggerAttackRelease('C6', 0.8, t + 0.28); },          // polite ding-dong
  lvl2(t) {                                                                                                              // kazoo "doodle-oo"
    [['G4', 0.09], ['B4', 0.09], ['D5', 0.28]].reduce((at, [n, d]) => { sfx.kazoo.triggerAttackRelease(n, d, at); return at + d + 0.03; }, t);
  },
  lvl3(t) {                                                                                                              // wobbly theremin
    const d = 0.95, n = 40;
    sfx.theremin.frequency.cancelScheduledValues(t);
    sfx.theremin.triggerAttack(480, t);
    sfx.theremin.frequency.setValueCurveAtTime([...Array(n)].map((_, i) => (480 + 420 * i / n) * (1 + 0.07 * Math.sin(i * 1.7))), t + 0.01, d);
    sfx.theremin.triggerRelease(t + d);
  },
  lvl4(t) {                                                                                                              // evil organ + "mwa-ha-ha" + thunder
    sfx.organ.triggerAttackRelease(['D3', 'F3', 'G#3', 'B3'], 0.7, t);
    ['A3', 'F3', 'D3', 'A2'].forEach((n, i) => sfx.laugh.triggerAttackRelease(n, 0.09, t + 0.18 + i * 0.13));
    sfx.thunder.triggerAttackRelease(1, t + 0.1);
  },
  lvl5(t) {                                                                                                              // air horn: BWAP BWAP BWAAAAP
    const chord = ['A#4', 'C#5', 'E5', 'A#5'];
    sfx.horn.triggerAttackRelease(chord, 0.13, t);
    sfx.horn.triggerAttackRelease(chord, 0.13, t + 0.19);
    sfx.horn.triggerAttackRelease(chord, 0.55, t + 0.38);
  },
  // Sound switch: power up / CRT power down
  powerOn(t) {
    sfx.sweep.frequency.cancelScheduledValues(t);
    sfx.sweep.triggerAttack(110, t);
    sfx.sweep.frequency.exponentialRampToValueAtTime(880, t + 0.22);
    sfx.sweep.triggerRelease(t + 0.24);
    sfx.bell.triggerAttackRelease('A6', 0.3, t + 0.24);
  },
  powerOff(t) {
    sfx.click.triggerAttackRelease(0.02, t);
    sfx.sweep.frequency.cancelScheduledValues(t);
    sfx.sweep.triggerAttack(1400, t + 0.02);
    sfx.sweep.frequency.exponentialRampToValueAtTime(55, t + 0.34);
    sfx.sweep.triggerRelease(t + 0.36);
  },
  // Story buttons
  register(t) {                                                                                                          // ka-ching
    sfx.thud.triggerAttackRelease('G2', 0.08, t);
    for (let i = 0; i < 3; i++) sfx.click.triggerAttackRelease(0.012, t + 0.04 + i * 0.03, 0.6);
    sfx.bell.triggerAttackRelease('C7', 0.6, t + 0.15);
    sfx.bell.triggerAttackRelease('G7', 0.8, t + 0.22);
  },
  share(t) {                                                                                                             // whoop up
    sfx.pop.triggerAttack(380, t);
    sfx.pop.frequency.exponentialRampToValueAtTime(1500, t + 0.14);
    sfx.pop.triggerRelease(t + 0.16);
  },
  rewind(t) {                                                                                                            // tape rewind warble
    const d = 0.42, n = 24;
    sfx.sweep.frequency.cancelScheduledValues(t);
    sfx.sweep.triggerAttack(1300, t);
    sfx.sweep.frequency.setValueCurveAtTime([...Array(n)].map((_, i) => (1300 - 1000 * i / n) * (i % 2 ? 0.8 : 1.15)), t + 0.01, d);
    sfx.sweep.triggerRelease(t + d);
  },
  zip(t) {                                                                                                               // fast-forward
    sfx.whooshF.frequency.setValueAtTime(600, t);
    sfx.whooshF.frequency.exponentialRampToValueAtTime(7000, t + 0.16);
    sfx.whoosh.triggerAttackRelease(0.16, t);
  },
  // card flick (randomize), camera shutter (screenshot)
  flick(t) { sfx.click.triggerAttackRelease(0.02, t, 0.7); },
  shutter(t) { sfx.click.triggerAttackRelease(0.02, t); sfx.click.triggerAttackRelease(0.05, t + 0.09); },
  // replies unsent: record scratch
  scratch(t) {
    sfx.scratchF.frequency.setValueAtTime(2600, t);
    sfx.scratchF.frequency.exponentialRampToValueAtTime(450, t + 0.12);
    sfx.scratchF.frequency.exponentialRampToValueAtTime(1800, t + 0.22);
    sfx.scratch.triggerAttackRelease(0.24, t);
  },
  // error: sad trombone, wobbling on the last note
  sad(t) {
    ['G3', 'F#3', 'F3'].forEach((n, i) => sfx.bone.triggerAttackRelease(n, 0.28, t + i * 0.32));
    const last = t + 0.96;
    sfx.bone.triggerAttackRelease('E3', 0.95, last);
    const f = Tone.Frequency('E3').toFrequency();
    sfx.bone.frequency.setValueCurveAtTime([...Array(16)].map((_, i) => f * (1 + 0.035 * Math.sin(i * 1.3))), last + 0.05, 0.85);
  },
};

// From a click handler: unlock audio first, then play
function sound(name, ...args) { unlockAudio().then(() => playSfx(name, ...args)); }

function playSfx(name, ...args) {
  if (!window.Tone || !music.enabled || Tone.context.state !== 'running') return;
  try { sfxInit(); SFX[name](Tone.now() + 0.01, ...args); } catch (e) { /* never let a sound break the chat */ }
}

// Call inside a click/keypress: browsers only start audio from a user gesture
function unlockAudio() {
  if (!window.Tone || !music.enabled) return Promise.resolve();
  return Tone.context.state === 'running' ? Promise.resolve() : Tone.start();
}

async function toggleSound() {
  if (music.enabled) playSfx('powerOff');   // play it before the switch mutes effects
  music.enabled = !music.enabled;
  if (window.Tone) {
    if (music.enabled) {
      await Tone.start();
      ensureMaster();
      playSfx('powerOn');
      if (music.wanted && (music.wanted !== music.mood || !music.playing)) playMood(music.wanted);
      else if (music.mood) {
        Tone.Transport.start('+0.05');
        music.playing = true;
        music.master.gain.rampTo(moodGain(music.mood), FADE_IN);
      }
    } else if (music.playing) {
      const token = ++music.token;
      music.master.gain.rampTo(0, FADE_OUT);
      await wait(FADE_OUT * 1000);
      if (token === music.token && !music.enabled) { Tone.Transport.pause(); music.playing = false; }
    }
  }
  updateMusicUI();
}

// Called from send(): starts audio inside the user gesture, then routes mood.
// Returns the unlock promise so the send whoosh can play once audio is live.
function startMusicFor(question) {
  if (!window.Tone) return Promise.resolve();
  const ready = unlockAudio();
  classifyMood(question).then(async mood => {
    music.wanted = mood;
    await ready;
    if (music.enabled && (mood !== music.mood || !music.playing)) playMood(mood);
    else updateMusicUI();
  });
  return ready;
}

function updateMusicUI() {
  const btn = $('soundBtn');
  const np = $('nowPlaying');
  btn.setAttribute('aria-checked', String(music.enabled));
  $('soundTxt').textContent = music.enabled ? 'Sound on' : 'Sound off';
  const mood = music.enabled ? (music.mood || music.wanted) : null;
  let text;
  if (!window.Tone) text = 'Audio unavailable';
  else if (!music.enabled) text = 'Muted';
  else if (mood && music.playing) text = MOODS[mood].label;
  else text = 'Waiting for you';
  np.textContent = text;
  np.title = text;
  $('soundBox').classList.toggle('playing', !!(music.enabled && music.playing));
  viz.kick();
}

// ---------- visualiser: stepped LED bars driven by the real music ----------
const viz = {
  bars: 14, heights: [], raf: 0, last: 0,
  kick() { if (!this.raf) this.raf = requestAnimationFrame(t => this.frame(t)); },
  frame(t) {
    this.raf = 0;
    const live = music.enabled && music.playing && music.analyser && !document.hidden;
    if (live && t - this.last < (REDUCED ? 200 : 33)) { this.raf = requestAnimationFrame(x => this.frame(x)); return; }
    this.last = t;
    const c = $('viz');
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const fft = live ? music.analyser.getValue() : null;
    const n = this.bars, gap = 2, bw = (w - gap * (n - 1)) / n, cell = 4, step = cell + 1;
    const colors = ['#FF3B00', '#FFD600', '#00E05A', '#0038FF', '#FF4FD8'];
    for (let i = 0; i < n; i++) {
      let target = 0.06;
      if (fft) {
        const db = fft[Math.min(fft.length - 1, 1 + Math.floor(i * 1.6))];
        target = Math.max(0.06, Math.min(1, (db + 92) / 64));
      }
      const prev = this.heights[i] ?? 0.06;
      const v = target > prev ? target : Math.max(target, prev * 0.88);
      this.heights[i] = v;
      const blocks = Math.max(1, Math.round((v * h) / step));
      g.fillStyle = colors[i % colors.length];
      for (let b = 0; b < blocks; b++) g.fillRect(i * (bw + gap), h - (b + 1) * step + 1, bw, cell);
    }
    if (live) this.raf = requestAnimationFrame(x => this.frame(x));
  },
};
document.addEventListener('visibilitychange', () => viz.kick());

// Speech-bubble tail as a PNG data URL: fill + 6px black outline on the two outer edges
const tailCache = {};
function tailSrc(fill) {
  if (tailCache[fill]) return tailCache[fill];
  const c = document.createElement('canvas');
  c.width = 46; c.height = 52;
  const g = c.getContext('2d');
  g.beginPath(); g.moveTo(46, 3); g.lineTo(4, 22); g.lineTo(46, 49); g.closePath();
  g.fillStyle = fill; g.fill();
  g.beginPath(); g.moveTo(46, 3); g.lineTo(4, 22); g.lineTo(46, 49);
  g.lineWidth = 6; g.lineJoin = 'miter'; g.strokeStyle = '#000'; g.stroke();
  g.fillStyle = fill; g.fillRect(40, 6, 6, 40);   // erase the bubble border under the tail
  return (tailCache[fill] = c.toDataURL('image/png'));
}

  root.querySelector('.sx-me .sx-txt').textContent = round.question;
  root.querySelectorAll('.sx-txt[data-i]').forEach(t => {
    t.textContent = round.members[Number(t.dataset.i)].response;
  });
  return root;
}

// Shrink type until the chat fits; truncate the longest message only as a last resort
function fitStory(root) {
  const chat = root.querySelector('.sx-chat');
  const name = root.querySelector('.sx-name');
  for (let fs = 58; fs > 40 && name.scrollHeight > fs * 2.2; fs -= 4) name.style.fontSize = fs + 'px';
  const overflowing = () => chat.scrollHeight > chat.clientHeight + 1;
  for (let fs = 42; fs >= 26; fs -= 2) {
    chat.style.setProperty('--fs', fs + 'px');
    if (!overflowing()) return;
  }
  const texts = [...root.querySelectorAll('.sx-txt')];
  for (let guard = 0; guard < 80 && overflowing(); guard++) {
    const longest = texts.reduce((a, b) => (b.textContent.length > a.textContent.length ? b : a));
    const text = longest.textContent.replace(/\.\.\.$/, '');
    if (text.length < 40) break;
    longest.textContent = text.slice(0, Math.floor(text.length * 0.9)).replace(/[\s,.;:!?-]+$/, '') + '...';
  }
}

async function fontsReady() {
  if (!document.fonts) return;
  try {
    await Promise.all([
      document.fonts.load('800 60px "Bricolage Grotesque"'),
      document.fonts.load('500 40px "Bricolage Grotesque"'),
      document.fonts.load('400 30px "Space Mono"'),
      document.fonts.load('700 30px "Space Mono"'),
    ]);
    await document.fonts.ready;
  } catch { /* fall back to system fonts */ }
}

async function renderStory(round) {
  if (!window.html2canvas) throw new Error('Screenshot library failed to load. Check your connection and reload.');
  await fontsReady();
  const root = buildStoryDOM(round);
  document.body.appendChild(root);
  try {
    fitStory(root);
    const canvas = await html2canvas(root, {
      width: STORY_W, height: STORY_H, scale: 1, x: 0, y: 0,
      windowWidth: STORY_W, windowHeight: STORY_H, scrollX: 0, scrollY: 0,
      backgroundColor: '#F2F0E9', logging: false,
      // the live copy sits off-screen; move the clone into frame before painting
      onclone: doc => {
        const el = doc.getElementById('storyRender');
        el.style.left = '0px';
        el.style.top = '0px';
      },
    });
    const blob = await new Promise((res, rej) =>
      canvas.toBlob(b => (b ? res(b) : rej(new Error('Could not create the image.'))), 'image/png'));
    return blob;
  } finally {
    root.remove();
  }
}

// ---------- overlay + FLIP ----------
function storyFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `the-council-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
}

function sizeStoryCard() {
  const card = $('storyCard');
  const actions = $('storyActions').offsetHeight || 70;
  const maxH = window.innerHeight - actions - 72;
  const w = Math.min(window.innerWidth - 32, maxH * 9 / 16);
  card.style.width = `${Math.floor(w)}px`;
  card.style.height = `${Math.floor(w * 16 / 9)}px`;
}

function setStoryStatus(text) { $('storyStatus').textContent = text; }
function setStoryButtons(enabled) {
  $('storyDownload').disabled = !enabled;
  $('storyShare').disabled = !enabled;
}

// Where the card would sit if it were fitted inside the chat area, same proportions.
// Uniform scale only, so nothing ever looks squashed.
function fitInto(rect, card) {
  const to = card.getBoundingClientRect();
  const s = Math.min(rect.width / to.width, rect.height / to.height) * 0.9;
  const dx = rect.left + rect.width / 2 - (to.left + to.width / 2);
  const dy = rect.top + rect.height / 2 - (to.top + to.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${s})`;
}

async function openStory() {
  const round = state.round;
  if (story.open || state.busy || state.resummonTimer || !round?.members.length) return;
  story.open = true;
  story.lastFocus = document.activeElement;
  const token = ++story.token;

  // Start rendering right away; the animation runs while it works
  const cached = round.story;
  const render = cached ? Promise.resolve(cached) : renderStory(round).then(blob => (round.story = blob));

  const overlay = $('storyOverlay');
  const card = $('storyCard');
  const img = $('storyImg');
  img.hidden = true;
  img.removeAttribute('src');
  $('storyLoading').hidden = false;
  setStoryButtons(false);
  setStoryStatus('Developing');

  // 1. viewfinder flash over the chat
  const from = els.stream.getBoundingClientRect();
  playSfx('shutter');
  if (!REDUCED) {
    const vf = document.createElement('div');
    vf.className = 'viewfinder';
    Object.assign(vf.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(vf);
    await wait(260);
    vf.remove();
  }

  // 2. the card rises out of the chat area and settles in the centre
  overlay.hidden = false;
  sizeStoryCard();
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  if (REDUCED) {
    overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
  } else {
    $('storyBackdrop').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'both' });
    $('storyActions').animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }],
      { duration: 340, delay: 260, fill: 'both', easing: 'cubic-bezier(.2,.9,.25,1.15)' });
    await card.animate([
      { transform: fitInto(from, card), opacity: 0 },
      { opacity: 1, offset: 0.3 },
      { transform: 'none', opacity: 1 },
    ], { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1.08)' }).finished;
  }
  $('storyDownload').focus();

  // 3. swap the loading state for the rendered image
  try {
    const blob = await render;
    if (token !== story.token || !story.open) return;
    if (story.url) URL.revokeObjectURL(story.url);
    story.url = URL.createObjectURL(blob);
    story.file = new File([blob], storyFileName(), { type: 'image/png' });
    img.src = story.url;
    await img.decode().catch(() => {});
    if (token !== story.token || !story.open) return;
    $('storyLoading').hidden = true;
    img.hidden = false;
    img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
    setStoryButtons(true);
    setStoryStatus('1080 × 1920 // Ready for your story');
  } catch (err) {
    if (token !== story.token) return;
    round.story = null;
    $('storyLoading').textContent = '! Render failed';
    setStoryStatus(err.message || 'Render failed. Go back and try again.');
  }
}

async function closeStory() {
  if (!story.open) return;
  playSfx('rewind');
  story.open = false;
  story.token++;
  const overlay = $('storyOverlay');
  const card = $('storyCard');
  if (!REDUCED) {
    const to = els.stream.getBoundingClientRect();
    $('storyActions').animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(16px)' }],
      { duration: 160, easing: 'ease-in', fill: 'forwards' });
    $('storyBackdrop').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, delay: 60, easing: 'ease-in', fill: 'forwards' });
    await card.animate([{ transform: 'none', opacity: 1 }, { opacity: 1, offset: 0.6 }, { transform: fitInto(to, card), opacity: 0 }],
      { duration: 380, easing: 'cubic-bezier(.5,0,.4,1)', fill: 'forwards' }).finished;
  } else {
    await overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished;
  }
  overlay.hidden = true;
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  $('storyLoading').textContent = '▮▮▮ Developing';
  (story.lastFocus?.isConnected ? story.lastFocus : els.input).focus();
}

function downloadStory(e) {
  if (!story.url || !story.file) return;
  if (e) playSfx('register');
  const a = document.createElement('a');
  a.href = story.url;
  a.download = story.file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStoryStatus('Downloaded ' + story.file.name);
}

async function shareStory() {
  const file = story.file;
  if (!file) return;
  playSfx('share');
  // navigator.share must be the first await so the click still counts as a gesture
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'The Council', text: `Ask your own council: ${SHARE_URL}` });
      setStoryStatus('Shared');
      return;
    } catch (err) {
      if (err.name === 'AbortError') { setStoryStatus('Share cancelled'); return; }
    }
  }
  // Fallback: copy the link and download the image
  let copied = false;
  try { await navigator.clipboard.writeText(SHARE_URL); copied = true; } catch {}
  downloadStory();
  setStoryStatus(copied ? 'Link copied // Image downloaded' : 'Image downloaded // Share it from your photos');
}

function storyKeydown(e) {
  if (!story.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeStory(); return; }
  if (e.key === 'Tab') {
    const btns = [...$('storyActions').querySelectorAll('button:not(:disabled)')];
    if (!btns.length) return;
    const first = btns[0], last = btns[btns.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!btns.includes(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
}

// ================================================================
//  INIT
// ================================================================
(async function init() {
  if (window.matchMedia('(max-width: 720px)').matches) els.input.placeholder = 'Ask the council…';
  $('tickerTrack').textContent = TICKER_LINES.map(t => `✸ ${t}`).join('    ').repeat(2);

  renderLevels();
  $('app').classList.add('a-boot');
  randomize(false);

  els.send.addEventListener('click', send);
  els.stream.addEventListener('click', e => { if (state.busy && !e.target.closest('button')) state.skip = true; });
  els.rand.addEventListener('click', () => randomize(true));
  initChaosMachine();
  $('soundBtn').addEventListener('click', toggleSound);
  $('storyDownload').addEventListener('click', downloadStory);
  $('storyShare').addEventListener('click', shareStory);
  $('storyBack').addEventListener('click', closeStory);
  document.addEventListener('keydown', storyKeydown);
  window.addEventListener('resize', () => { if (story.open) sizeStoryCard(); });
  updateMusicUI();
  els.input.addEventListener('input', autosize);
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  await wait(T.boot + state.members.length * T.stampGap);
  postDay();
  postSystem(`${state.members.length} members joined the chat`, false, { typed: true });
  postWelcome();
})();
</script>
