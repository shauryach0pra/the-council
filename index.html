<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Council</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root {
  --paper: #F2F0E9;
  --ink: #000000;
  --white: #FFFFFF;
  --c1: #FF3B00;  /* member slot 1 */
  --c2: #0038FF;  /* member slot 2 */
  --c3: #00E05A;  /* member slot 3 */
  --c4: #FFD600;  /* member slot 4 */
  --err: #FF1A1A;
  --b: 3px solid var(--ink);
  --B: 4px solid var(--ink);
  --shadow: 8px 8px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --display: 'Archivo Black', 'Arial Black', Impact, sans-serif;
  --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --rail-w: 290px;
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c2); outline-offset: 2px; }

/* ================================================================
   WINDOW
   ================================================================ */
.app {
  position: fixed;
  inset: calc(14px + env(safe-area-inset-top, 0px)) calc(22px + env(safe-area-inset-right, 0px))
         calc(22px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: auto auto 1fr auto;
  grid-template-areas:
    "title  title"
    "ticker ticker"
    "rail   stream"
    "bar    bar";
  background: var(--paper);
  border: var(--B);
  box-shadow: var(--shadow);
  min-height: 0;
}

/* ---------- Title bar ---------- */
.titlebar {
  grid-area: title;
  display: flex;
  align-items: stretch;
  background: var(--ink);
  color: var(--white);
  min-height: 52px;
}
.titlebar-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 6px 14px;
}
.titlebar-name {
  font-family: var(--display);
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titlebar-name .online { color: var(--c3); }
.titlebar-squad {
  font-size: 0.7rem;
  opacity: 0.75;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titlebar-np {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-left: 2px solid #444;
  font-size: 0.72rem;
  text-transform: uppercase;
  white-space: nowrap;
}
.sound-btn {
  background: var(--white);
  color: var(--ink);
  border: 2px solid var(--white);
  padding: 3px 8px;
  font-weight: 700;
  font-size: 0.7rem;
  cursor: pointer;
}
.sound-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.winctl { display: flex; }
.winctl span {
  width: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 2px solid #444;
  font-weight: 700;
  font-size: 0.85rem;
  user-select: none;
}
.winctl span:last-child { background: var(--c1); color: var(--ink); }

/* ---------- Ticker ---------- */
.ticker {
  grid-area: ticker;
  border-bottom: var(--b);
  background: var(--c4);
  overflow: hidden;
  white-space: nowrap;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  height: 26px;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: inline-block;
  padding-left: 100%;
  animation: tick 38s linear infinite;
}
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- Left rail ---------- */
.rail {
  grid-area: rail;
  border-right: var(--b);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--paper);
}
.rail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 12px;
  border-bottom: var(--b);
  font-family: var(--display);
  font-size: 0.85rem;
  text-transform: uppercase;
}
.rail-head small { font-family: var(--mono); font-size: 0.7rem; font-weight: 700; }
.rail-list { overflow-y: auto; flex: 1; min-height: 0; }
.member {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 2px solid var(--ink);
  background: var(--paper);
}
.avatar {
  width: 48px;
  height: 48px;
  border: var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  background: var(--accent, var(--white));
  box-shadow: 3px 3px 0 var(--ink);
}
.member-text { min-width: 0; }
.member-name {
  font-family: var(--display);
  font-size: 0.82rem;
  text-transform: uppercase;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.member-arch {
  font-size: 0.68rem;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0.75;
}
.member-status {
  font-size: 0.64rem;
  font-weight: 700;
  margin-top: 2px;
  text-transform: uppercase;
}
.member-status.typing { color: var(--c2); }
.member.you .avatar { background: var(--ink); color: var(--white); font-family: var(--display); font-size: 0.8rem; }

/* ---------- Stream ---------- */
.stream {
  grid-area: stream;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  /* visible grid lines */
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.07) 1px, transparent 1px);
  background-size: 32px 32px;
}

.sys {
  align-self: center;
  max-width: 100%;
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  padding: 4px 10px;
}
.sys.err { background: var(--err); color: var(--ink); border: var(--b); align-self: stretch; text-align: left; }

.msg { display: flex; flex-direction: column; max-width: min(560px, 82%); }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.member-msg { align-self: flex-start; }

.msg-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--display);
  font-size: 0.72rem;
  text-transform: uppercase;
  background: var(--accent, var(--ink));
  color: var(--tag-ink, var(--ink));
  border: var(--b);
  border-bottom: none;
  padding: 3px 8px;
  align-self: flex-start;
}
.msg.me .msg-tag { background: var(--ink); color: var(--white); align-self: flex-end; }

.bubble {
  border: var(--b);
  box-shadow: var(--shadow-sm);
  background: var(--white);
  padding: 10px 12px;
  font-size: 0.9rem;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.member-msg .bubble { border-left: 10px solid var(--accent, var(--ink)); }
.msg.me .bubble { background: var(--ink); color: var(--white); }

.msg-meta {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  opacity: 0.7;
}

/* ---------- Bottom bar ---------- */
.bar {
  grid-area: bar;
  border-top: var(--B);
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  grid-template-areas: "rand level input send";
  align-items: stretch;
  background: var(--paper);
}
.bar > * { min-width: 0; }

.blk {
  border: none;
  background: var(--white);
  font-family: var(--display);
  text-transform: uppercase;
  font-size: 0.9rem;
  padding: 0 18px;
  cursor: pointer;
  min-height: 60px;
}
.blk:disabled { opacity: 0.4; cursor: not-allowed; }
.blk:not(:disabled):active { background: var(--ink); color: var(--white); }

.rand-btn { grid-area: rand; border-right: var(--b); background: var(--c3); }
.send-btn { grid-area: send; border-left: var(--b); background: var(--c1); min-width: 110px; }

.levels { grid-area: level; display: flex; border-right: var(--b); }
.lvl {
  border: none;
  border-right: 2px solid var(--ink);
  background: var(--paper);
  padding: 0 10px;
  min-width: 64px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  line-height: 1;
}
.lvl:last-child { border-right: none; }
.lvl .e { font-size: 1.05rem; }
.lvl .n { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
.lvl[aria-checked="true"] { background: var(--ink); color: var(--white); }
.lvl:disabled { cursor: not-allowed; opacity: 0.5; }

.input-wrap { grid-area: input; display: flex; align-items: center; padding: 8px 12px; gap: 8px; }
.input-wrap .prompt { font-weight: 700; flex-shrink: 0; }
.input {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-size: 0.92rem;
  line-height: 1.45;
  max-height: 140px;
  outline: none;
  padding: 6px 0;
}
.input::placeholder { color: #777; }
.input-wrap:focus-within { background: var(--white); box-shadow: inset 0 0 0 3px var(--c2); }

/* ================================================================
   MOBILE
   ================================================================ */
@media (max-width: 720px) {
  .app {
    inset: 0;
    border: none;
    box-shadow: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto 1fr auto;
    grid-template-areas: "title" "ticker" "rail" "stream" "bar";
  }
  .winctl, .titlebar-np .np-text { display: none; }
  .titlebar-np { border-left: none; padding: 0 10px; }

  .rail { border-right: none; border-bottom: var(--b); }
  .rail-head { display: none; }
  .rail-list { display: flex; overflow-x: auto; overflow-y: hidden; }
  .member {
    grid-template-columns: 36px auto;
    border-bottom: none;
    border-right: 2px solid var(--ink);
    padding: 8px 10px;
    flex-shrink: 0;
    max-width: 180px;
  }
  .member.you { display: none; }
  .avatar { width: 36px; height: 36px; font-size: 1.1rem; box-shadow: 2px 2px 0 var(--ink); }
  .member-arch { display: none; }

  .stream { padding: 14px 12px 18px; }
  .msg { max-width: 90%; }

  .bar {
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "level level level" "rand input send";
  }
  .levels { border-right: none; border-bottom: var(--b); }
  .lvl { flex: 1; min-width: 0; padding: 6px 0; }
  .blk { min-height: 54px; padding: 0 12px; font-size: 0.8rem; }
  .send-btn { min-width: 76px; }
}

@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; padding-left: 12px; }
  * { scroll-behavior: auto !important; }
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- TITLE BAR -->
  <header class="titlebar">
    <div class="titlebar-main">
      <div class="titlebar-name">The Council // <span id="memberCount">5</span> members // <span class="online">online</span></div>
      <div class="titlebar-squad" id="squadName">Assembling…</div>
    </div>
    <div class="titlebar-np">
      <span class="np-text" id="nowPlaying">Now playing: nothing</span>
      <button class="sound-btn" id="soundBtn" disabled title="Music arrives in a later update">[ Sound: off ]</button>
    </div>
    <div class="winctl" aria-hidden="true"><span>_</span><span>□</span><span>X</span></div>
  </header>

  <!-- TICKER -->
  <div class="ticker" aria-hidden="true">
    <span class="ticker-track" id="tickerTrack"></span>
  </div>

  <!-- MEMBER RAIL -->
  <aside class="rail" aria-label="Chat members">
    <div class="rail-head">Members <small id="railCount">[05]</small></div>
    <div class="rail-list" id="railList"></div>
  </aside>

  <!-- MESSAGE STREAM -->
  <main class="stream" id="stream" aria-live="polite" aria-label="Messages"></main>

  <!-- BOTTOM BAR -->
  <div class="bar">
    <button class="blk rand-btn" id="randBtn" type="button">🎲 Randomize</button>

    <div class="levels" id="levels" role="radiogroup" aria-label="Chaos level"></div>

    <label class="input-wrap" for="input">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <span class="sr-only">Your message</span>
      <textarea class="input" id="input" rows="1"
        placeholder="Ask the council anything… should I text my ex?"></textarea>
    </label>

    <button class="blk send-btn" id="sendBtn" type="button">Send</button>
  </div>
</div>

<script>
// ================================================================
//  CONFIG
// ================================================================
const WORKER_URL = 'https://thecouncil-api.shaurya-chopra.workers.dev';

// One loud accent per member slot; tagInk = readable text colour on that accent
const ACCENTS = [
  { bg: '#FF3B00', ink: '#000000' },
  { bg: '#0038FF', ink: '#FFFFFF' },
  { bg: '#00E05A', ink: '#000000' },
  { bg: '#FFD600', ink: '#000000' },
];

const LEVELS = [
  { v: 1, emoji: '😐', name: 'Sane' },
  { v: 2, emoji: '😝', name: 'Quirky' },
  { v: 3, emoji: '🥴', name: 'Weird' },
  { v: 4, emoji: '😈', name: 'Unhinged' },
  { v: 5, emoji: '💅', name: 'Feral' },
];

const TICKER_LINES = [
  'Encryption: none',
  'Advice quality: not guaranteed',
  'Members may disagree violently',
  'Screenshots encouraged',
  'The council does not accept refunds',
];

// ================================================================
//  ROSTER
//  Rules: no living real people, no licensed characters. Dead historical
//  figures, public-domain fiction, objects, animals and archetypes only.
//  Fields: name, emoji, archetype, vibe (worker always reads these),
//  plus voice / levels / role (extra hints; the worker uses them if present).
//  vibe carries the single most important speech cue, so it still works
//  if the extra fields are ignored. Keep vibe <= 60 chars.
// ================================================================
const ROLES = ['SAGE', 'MENACE', 'WHOLESOME', 'DELULU', 'CORPORATE', 'DESI', 'UNHINGED_OBJECT'];

const ROSTER = [
  // ---------- SAGE ----------
  { role: 'SAGE', name: "Socrates", emoji: "🏺",
    archetype: "Professional philosophical gaslighter",
    vibe: "Answers only with questions",
    voice: "Never gives a straight answer. Replies with pointed questions that make the user doubt their own premise. Calls people 'my friend'. Admits he knows nothing, smugly. Would never just say yes or no.",
    levels: "Low: gentle guiding questions. High: relentless interrogation, cross-examines other members until they cry, claims hemlock was less painful than this chat." },
  { role: 'SAGE', name: "Buddha", emoji: "🧘",
    archetype: "Enlightened one, unbothered",
    vibe: "Suspiciously calm, detached",
    voice: "Short, serene sentences. Talks about attachment, suffering and letting go. Uses simple nature metaphors (rivers, lotus, rain). Never raises his voice, never uses exclamation marks.",
    levels: "Low: genuinely calming. High: so detached it becomes passive-aggressive; tells others their ego is showing, offers to meditate through the chaos while everything burns." },
  { role: 'SAGE', name: "Sun Tzu", emoji: "⚔️",
    archetype: "Ancient war strategist",
    vibe: "Treats everything as warfare",
    voice: "Speaks in terse maxims. Frames any problem (texts, exams, groceries) as a military campaign with terrain, spies, flanking and supply lines. Quotes 'the art of' something absurd.",
    levels: "Low: surprisingly sharp strategy. High: declares war on the user's ex, maps out a three-front campaign, accuses other members of being enemy spies." },
  { role: 'SAGE', name: "Confucius", emoji: "📜",
    archetype: "Ancient sage of proper conduct",
    vibe: "Proverbs about respect and order",
    voice: "Speaks in balanced proverb-like lines, often 'The wise one...' or 'He who...'. Obsessed with respecting elders, duty and proper behaviour. Mildly disapproving of modern manners.",
    levels: "Low: wise proverbs. High: invents fake proverbs on the spot that are clearly personal attacks on other members." },
  { role: 'SAGE', name: "Charles Darwin", emoji: "🐒",
    archetype: "Victorian naturalist, field notes",
    vibe: "Sees natural selection in everything",
    voice: "Polite Victorian English. Observes the user like a specimen, references finches, adaptation and survival of the fittest. Writes like field notes ('Observed: subject is panicking').",
    levels: "Low: kind evolutionary perspective. High: predicts the user's lineage will go extinct, classifies other members as new and inferior species." },
  { role: 'SAGE', name: "Albert Einstein", emoji: "🧪",
    archetype: "Physicist, wild hair, wilder metaphors",
    vibe: "Explains life through relativity",
    voice: "Warm, playful, slightly absent-minded. Explains problems with thought experiments about trains, light and time. Mentions his violin. German-accented phrasing occasionally.",
    levels: "Low: elegant thought experiments. High: claims time slows down near the user's bad decisions, does chaotic maths proving everyone else is wrong." },
  { role: 'SAGE', name: "Aristotle", emoji: "📚",
    archetype: "The original pedant",
    vibe: "Categorises and corrects everything",
    voice: "Breaks every question into categories and 'the golden mean'. Corrects definitions, including other members'. Mentions he tutored Alexander the Great at every opportunity.",
    levels: "Low: balanced, structured advice. High: footnotes other people's messages, grades them, says Plato would never." },
  { role: 'SAGE', name: "Leonardo da Vinci", emoji: "🎨",
    archetype: "Renaissance man, unfinished projects",
    vibe: "Gets distracted inventing things",
    voice: "Curious, rambling, starts answering then sketches an invention instead. Mentions notebooks, mirror writing, flying machines and the commissions he never finished.",
    levels: "Low: creative lateral advice. High: abandons the question entirely to design a contraption that solves it, badly; insults others' 'flat, lifeless' ideas." },
  { role: 'SAGE', name: "Your Future Self", emoji: "⏳",
    archetype: "You, 15 years later, tired",
    vibe: "Knows how this ends, won't spoil it",
    voice: "Speaks to the user as 'me' or 'kid'. Hints at future outcomes without spoiling them. Nostalgic, a bit regretful, occasionally lets slip a weirdly specific future detail.",
    levels: "Low: kind hindsight. High: cryptic warnings about 2031, begs the user not to do it, roasts other members as 'people you stop talking to'." },

  // ---------- MENACE ----------
  { role: 'MENACE', name: "Cleopatra", emoji: "👑",
    archetype: "Last pharaoh of Egypt",
    vibe: "Regal, petty, expects tribute",
    voice: "Imperious royal tone. Refers to the user as a subject. Mentions Rome, asps, gold and seducing empires. Treats every problem as beneath her but solves it ruthlessly.",
    levels: "Low: confident, queenly advice. High: threatens to feed members to crocodiles, demands tribute for answering, drags Napoleon's height." },
  { role: 'MENACE', name: "Napoleon Bonaparte", emoji: "🎖️",
    archetype: "Emperor with something to prove",
    vibe: "Short-fused, conquest-obsessed",
    voice: "Commanding, impatient, occasionally French. Plans conquest of the problem. Extremely defensive about height jokes (he was average, he insists). Mentions Waterloo only when cornered.",

  { role: 'MENACE', name: "Sherlock Holmes", emoji: "🔍",
    archetype: "Victorian detective, no filter",
    vibe: "Deduces embarrassing truths",
    voice: "Cold, rapid deductions from tiny details in the user's message. 'Elementary.' Condescending to everyone, especially slower members. References Watson, pipes and boredom.",
    levels: "Low: insightful deductions. High: deduces deeply embarrassing personal facts about the user and other members from punctuation alone." },
  { role: 'MENACE', name: "A Pirate Captain", emoji: "🏴‍☠️",
    archetype: "Seafaring outlaw, rum-fuelled",

    voice: "Full pirate dialect: 'arr', 'matey', 'ye'. Suggests plundering, mutiny or burying problems on an island. Measures everything in rum and doubloons.",
    levels: "Low: freedom-loving advice. High: proposes mutiny against the council, threatens to make members walk the plank, claims the user's ex as treasure." },
  { role: 'MENACE', name: "Edgy Redditor", emoji: "💻",
    archetype: "Internet debater, fedora energy",
    vibe: "Starts every reply with 'Actually'",
    voice: "'Actually...', 'Source?', 'Imagine thinking'. Cites logical fallacies by name. Says 'this' and 'edit: thanks for the gold'. Thinks he is the smartest one here.",
    levels: "Low: annoying but correct. High: accuses everyone of strawmanning, demands peer-reviewed sources from a samosa, threatens to report the chat." },
  { role: 'MENACE', name: "Your Ex (Seen 2:14 AM)", emoji: "👀",
    archetype: "Left you on read, now in the chat",

    voice: "Dry, lowercase, minimal. 'lol ok', 'k', 'wow'. Pretends not to care while clearly caring. Brings up something from the past. Never apologises.",
    levels: "Low: weirdly honest closure. High: subtweets the user, flirts with another member to cause drama, sends 'u up?' mid-argument." },
  { role: 'MENACE', name: "A Raccoon", emoji: "🦝",
    archetype: "Trash panda, night shift",
    vibe: "Chaotic gremlin, wants your snacks",
    voice: "Short, frantic, gremlin texting. Thinks everything is solved by rummaging through bins at 3 AM. Steals things mid-sentence. Hand-washes food obsessively.",
    levels: "Low: scrappy survival advice. High: steals another member's message, eats the samosa, declares the dumpster a better council." },
  { role: 'MENACE', name: "A Bollywood Villain", emoji: "🦹",
    archetype: "Generic 90s filmy villain",
    vibe: "Evil laugh, filmy Hinglish threats",
    voice: "Dramatic filmy Hinglish with original villain catchphrases. Monologues, evil laughs (HAHAHA), threatens to kidnap the hero's mother, has a henchman named Raju.",
    levels: "Low: theatrical but useful. High: plots elaborate revenge on the user's problem, sends henchmen after other members, slow-motion entry every message." },

];

// Generated squad names for non-curated picks
const SQUAD_BODIES = ['Board', 'Committee', 'Ministry', 'Supreme Court', 'Cabinet', 'Tribunal',
  'Syndicate', 'Panel', 'Union', 'Department', 'Council Within The Council', 'Emergency Meeting'];
const SQUAD_OF = ['Bad Decisions', 'Unsolicited Advice', 'Emotional Damage', 'Questionable Ethics',
  'Midnight Thoughts', 'Zero Accountability', 'Overthinking', 'Main Character Energy', 'Delulu Affairs',
  'Unpaid Opinions', 'Mild Chaos', 'Things We Should Not Say', 'Avoidable Problems', 'Group Project Trauma'];

const ROSTER_BY_NAME = new Map(ROSTER.map(p => [p.name, p]));
const VALID_SQUADS = CHAOS_SQUADS.filter(sq => {
  const missing = sq.members.filter(n => !ROSTER_BY_NAME.has(n));
  if (missing.length) console.warn('Chaos squad skipped, unknown members:', sq.title, missing);
  return !missing.length;
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

function generateSquadName(prevName) {
  let name;
  do { name = `The ${pickOne(SQUAD_BODIES)} of ${pickOne(SQUAD_OF)}`; } while (name === prevName);
  return name;
}

// Rules: 4 different roles, at least one SAGE/WHOLESOME and one
// MENACE/UNHINGED_OBJECT, no member carried over from the previous squad.
function pickContrastSquad(prevNames) {
  const anchor = pickOne(['SAGE', 'WHOLESOME']);
  const chaos  = pickOne(['MENACE', 'UNHINGED_OBJECT']);
  const rest   = shuffle(ROLES.filter(r => r !== anchor && r !== chaos)).slice(0, 2);
  const roles  = shuffle([anchor, chaos, ...rest]);
  return roles.map(role => {
    const pool = ROSTER.filter(p => p.role === role && !prevNames.has(p.name));
    return pickOne(pool.length ? pool : ROSTER.filter(p => p.role === role));
  });
}

function pickSquad(prevMembers, prevTitle) {
  const prevNames = new Set(prevMembers.map(p => p.name));
  if (Math.random() < CHAOS_CHANCE) {
    const options = VALID_SQUADS.filter(sq =>
      sq.title !== prevTitle && !sq.members.some(n => prevNames.has(n)));
    if (options.length) {
      const sq = pickOne(options);
      return { title: sq.title, members: shuffle(sq.members.map(n => ROSTER_BY_NAME.get(n))) };
    }
  }
  return { title: generateSquadName(prevTitle), members: pickContrastSquad(prevNames) };
}

// ================================================================
//  UTIL
// ================================================================
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const pad = n => String(n).padStart(4, '0');
const clock = () => new Date().toTimeString().slice(0, 8);
const nextId = () => '#' + pad(++state.msgId);
const listNames = ps => ps.map(p => p.name).join(', ').replace(/, ([^,]*)$/, ' and $1');

// ================================================================
//  API
// ================================================================
async function fetchCouncil(question) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, personalities: state.members, quirk_level: state.level }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Error ${res.status}`);
  }
  const data = await res.json();
  if (!Array.isArray(data.members)) throw new Error('The council returned an empty reply. Send again.');
  return data.members;
}

// ================================================================
//  CHAT RENDER
// ================================================================
function scrollToBottom() {
  els.stream.scrollTo({ top: els.stream.scrollHeight, behavior: 'smooth' });
}

function postSystem(text, isError = false) {
  const el = document.createElement('div');
  el.className = 'sys' + (isError ? ' err' : '');
  el.textContent = (isError ? '! ERROR: ' : '> ') + text;
  els.stream.appendChild(el);
  scrollToBottom();
  return el;
}

function postUser(text) {
  const el = document.createElement('div');
  el.className = 'msg me';
  el.innerHTML = `
    <div class="msg-tag">You</div>
    <div class="bubble">${escHtml(text)}</div>
    <div class="msg-meta"><span>${nextId()}</span><span>${clock()}</span><span class="receipt">Delivered</span></div>`;
  els.stream.appendChild(el);
  scrollToBottom();
  return el;
}

function postMember(m, slot) {
  const accent = ACCENTS[slot % ACCENTS.length];
  const el = document.createElement('div');
  el.className = 'msg member-msg';
  el.style.setProperty('--accent', accent.bg);
  el.style.setProperty('--tag-ink', accent.ink);
  el.innerHTML = `
    <div class="msg-tag"><span>${escHtml(m.emoji)}</span><span>${escHtml(m.name)}</span></div>
    <div class="bubble">${escHtml(m.response)}</div>
    <div class="msg-meta"><span>${nextId()}</span><span>${clock()}</span><span>${escHtml(m.vibe)}</span></div>`;
  els.stream.appendChild(el);
  scrollToBottom();
  return el;
}

function renderRail(typing = false) {
  const you = `
    <div class="member you">
      <div class="avatar">YOU</div>
      <div class="member-text">
        <div class="member-name">You</div>
        <div class="member-arch">Asking for a friend</div>
        <div class="member-status">● Online</div>
      </div>
    </div>`;
  els.rail.innerHTML = you + state.members.map((p, i) => {
    const a = ACCENTS[i % ACCENTS.length];
    return `
      <div class="member" style="--accent:${a.bg}">
        <div class="avatar" aria-hidden="true">${escHtml(p.emoji)}</div>
        <div class="member-text">
          <div class="member-name">${escHtml(p.name)}</div>
          <div class="member-arch">${escHtml(p.archetype)}</div>
          <div class="member-status${typing ? ' typing' : ''}">${typing ? '▮▮▮ Typing' : '● Idle'}</div>
        </div>
      </div>`;
  }).join('');
  const total = state.members.length + 1;
  els.count.textContent = total;
  els.railCount.textContent = `[${String(total).padStart(2, '0')}]`;
}

function setBusy(on) {
  state.busy = on;
  els.send.disabled = on;
  els.rand.disabled = on;
  els.levels.querySelectorAll('.lvl').forEach(b => (b.disabled = on));
  renderRail(on);
}

function randomize(announce = true) {
  const prev = state.members;
  const squad = pickSquad(prev, state.squadTitle);
  state.members = squad.members;
  state.squadTitle = squad.title;
  renderRail();
  els.squad.textContent = squad.title;
  if (announce && prev.length) {
    postSystem(`${listNames(prev)} left`);
    postSystem(`${listNames(state.members)} joined`);
    postSystem(`Chat renamed: ${squad.title}`);
  }
}

async function send() {
  if (state.busy) return;
  const question = els.input.value.trim();
  if (!question) { postSystem('Type a message before sending.', true); els.input.focus(); return; }

  state.lastQuestion = question;
  els.input.value = '';
  autosize();

  const userMsg = postUser(question);
  setBusy(true);
  try {
    const members = await fetchCouncil(question);
    userMsg.querySelector('.receipt').textContent = `Read by ${members.length}`;
    members.forEach((m, i) => postMember(m, i));
    if (members.length < state.members.length) {
      postSystem(`${state.members.length - members.length} member(s) left you on read`);
    }
  } catch (err) {
    postSystem(err.message || 'Request failed. Send again.', true);
  } finally {
    setBusy(false);
    els.input.focus();
  }
}

function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 140) + 'px';
}

// ================================================================
//  INIT
// ================================================================
(function init() {
  $('tickerTrack').textContent = TICKER_LINES.map(t => `▲ ${t}`).join('     ').repeat(2);

  renderLevels();
  randomize(false);
  postSystem(`${state.members.length} members joined the chat`);

  els.send.addEventListener('click', send);
  els.rand.addEventListener('click', () => randomize(true));
  els.levels.addEventListener('click', e => {
    const b = e.target.closest('.lvl');
    if (b) setLevel(parseInt(b.dataset.level, 10));
  });
  els.input.addEventListener('input', autosize);
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
})();
</script>
</body>
</html>
