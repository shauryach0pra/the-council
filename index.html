<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Council</title>
<meta name="description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="The Council">
<meta property="og:description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root {
  --paper: #F2F0E9;
  --ink: #000000;
  --white: #FFFFFF;
  --c1: #FF3B00;  /* member slot 1 */
  --c2: #0038FF;  /* member slot 2 */
  --c3: #00E05A;  /* member slot 3 */
  --c4: #FFD600;  /* member slot 4 */
  --err: #FF1A1A;
  /* chaos heat, level 1 -> 5 */
  --l1: #00E05A; --l2: #FFD600; --l3: #FF8A00; --l4: #FF3B00; --l5: #FF4FD8;
  --b: 3px solid var(--ink);
  --B: 4px solid var(--ink);
  --shadow: 8px 8px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --display: 'Bricolage Grotesque', 'Arial Black', Impact, sans-serif;
  --text: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --rail-w: 300px;
  --halftone: radial-gradient(rgba(0,0,0,0.11) 1.1px, transparent 1.6px);
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: #E9E5D9;
  background-image: var(--halftone);
  background-size: 9px 9px;
  color: var(--ink);
  font-family: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }

/* Shared chunky button: raised on hover, pressed on click */
.kbtn {
  border: var(--b);
  box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.kbtn:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.kbtn:not(:disabled):active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.kbtn:disabled { cursor: not-allowed; opacity: 0.45; }

/* ================================================================
   WINDOW
   ================================================================ */
.app {
  position: fixed;
  inset: calc(16px + env(safe-area-inset-top, 0px)) calc(26px + env(safe-area-inset-right, 0px))
         calc(26px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas:
    "title  title"
    "ticker ticker"
    "rail   stream"
    "bar    bar";
  background: var(--paper);
  border: var(--B);
  box-shadow: 10px 10px 0 var(--ink);
  min-height: 0;
}

/* ---------- Header ---------- */
.titlebar {
  grid-area: title;
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--ink);
  color: var(--white);
  padding: 12px 16px 12px 14px;
  min-width: 0;
}
.logo {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--c4);
  color: var(--ink);
  border: var(--b);
  box-shadow: 3px 3px 0 var(--white);
  padding: 6px 10px 5px;
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 75%;
  font-size: 0.95rem;
  line-height: 0.9;
  text-transform: uppercase;
  transform: rotate(-3deg);
}
.logo .ico { font-size: 1.15rem; }
.head-avatars { display: flex; flex-shrink: 0; padding-left: 4px; }
.head-avatars span {
  width: 38px;
  height: 38px;
  margin-left: -9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  background: var(--accent, var(--white));
  border: 3px solid var(--ink);
  outline: 2px solid var(--white);
}
.head-avatars span:nth-child(odd)  { transform: rotate(-4deg); }
.head-avatars span:nth-child(even) { transform: rotate(3deg); }
.head-main { flex: 1; min-width: 0; }
.squad-name {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 80%;
  font-size: clamp(1.25rem, 2.1vw, 1.9rem);
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.head-sub {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #CFCFCF;
}
.head-sub .on { color: var(--c3); }
.head-sub .on::before { content: '● '; }
.head-sub .lvl-now { color: var(--lvl-color, var(--l1)); }

/* ---------- Sound widget ---------- */
.sound {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  background: var(--white);
  color: var(--ink);
  border: var(--b);
  box-shadow: 4px 4px 0 var(--c4);
}
.np {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px 6px 10px;
  min-width: 0;
  width: 236px;
}
.eq { display: flex; align-items: flex-end; gap: 3px; height: 24px; flex-shrink: 0; }
.eq i {
  width: 5px;
  height: 100%;
  background: var(--ink);
  transform-origin: bottom;
  transform: scaleY(0.18);
  transition: transform 0.3s;
}
.eq i:nth-child(1) { background: var(--c1); }
.eq i:nth-child(2) { background: var(--c2); }
.eq i:nth-child(3) { background: var(--c3); }
.eq i:nth-child(4) { background: var(--ink); }
.sound.playing .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
.sound.playing .eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
.sound.playing .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
.sound.playing .eq i:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.2s; }
@keyframes eq { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
.np-txt { min-width: 0; line-height: 1.1; }
.np-k { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; opacity: 0.6; }
.np-v {
  font-weight: 800;
  font-size: 0.92rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sound-btn {
  border: none;
  border-left: var(--b);
  background: var(--c3);
  padding: 0 12px;
  min-width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
}
.sound-btn .ico { font-size: 1.05rem; line-height: 1; }
.sound-btn[aria-pressed="false"] { background: var(--paper); }
.sound-btn:active { background: var(--ink); color: var(--white); }

/* ---------- Ticker ---------- */
.ticker {
  grid-area: ticker;
  border-top: var(--b);
  border-bottom: var(--b);
  background: var(--c4);
  overflow: hidden;
  white-space: nowrap;
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.8rem;
  text-transform: uppercase;
  height: 30px;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: inline-block;
  padding-left: 100%;
  animation: tick 48s linear infinite;
}
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- Member rail ---------- */
.rail {
  grid-area: rail;
  border-right: var(--B);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  background: var(--white);
}
.rail-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: var(--b);
  font-weight: 800;
  font-stretch: 80%;
  font-size: 1rem;
  text-transform: uppercase;
  background: var(--paper);
}
.rail-head small {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--ink);
  color: var(--white);
  padding: 2px 6px;
}
.rail-list { overflow-y: auto; flex: 1; min-height: 0; }
.member {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 14px 14px 13px;
  border-bottom: var(--b);
  background: var(--white);
}
.avatar {
  width: 56px;
  height: 56px;
  border: var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.75rem;
  background: var(--accent, var(--white));
  box-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-3deg);
}
.member:nth-child(odd) .avatar { transform: rotate(2.5deg); }
.member-text { min-width: 0; }
.member-name {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.02rem;
  line-height: 1.08;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.member-arch {
  margin-top: 3px;
  font-size: 0.8rem;
  line-height: 1.3;
  color: #3A3A3A;
}
.member-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 7px; }
.role {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  border: 2px solid var(--ink);
  padding: 1px 5px;
  background: var(--paper);
}
.member-status {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  text-transform: uppercase;
}
.member-status.typing { color: var(--c2); }
.member-status.left { color: #8A8A8A; }
.member.you { background: var(--paper); }
.member.you .avatar { background: var(--ink); color: var(--white); font-weight: 800; font-size: 0.9rem; transform: none; }

/* ---------- Stream ---------- */
.stream {
  grid-area: stream;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background-color: var(--paper);
  background-image: var(--halftone);
  background-size: 12px 12px;
}

/* Narration boxes (system messages) */
.sys {
  align-self: center;
  max-width: min(560px, 100%);
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1.4;
  text-transform: uppercase;
  text-align: center;
  background: var(--c4);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 10px;
}
.sys.err {
  align-self: stretch;
  max-width: none;
  text-align: left;
  background: var(--err);
  color: var(--white);
  display: flex;
  gap: 10px;
  align-items: center;
}
.sys.err::before {
  content: '!';
  flex-shrink: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--white);
  color: var(--err);
  border: 2px solid var(--ink);
  font-family: var(--display);
  font-weight: 800;
}
.day {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
}
.day::before, .day::after { content: ''; flex: 1; height: 3px; background: var(--ink); }
.day span { background: var(--ink); color: var(--white); padding: 2px 8px; }

/* Squad change card */
.squad-card {
  align-self: center;
  width: min(520px, 100%);
  background: var(--white);
  border: var(--b);
  box-shadow: 5px 5px 0 var(--ink);
}
.sc-title {
  background: var(--ink);
  color: var(--white);
  padding: 8px 12px;
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  line-height: 1.1;
}
.sc-title small { display: block; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; color: var(--c4); margin-bottom: 3px; }
.sc-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-top: 2px solid var(--ink); }
.sc-k { flex-shrink: 0; width: 52px; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }
.sc-names { display: flex; flex-wrap: wrap; gap: 6px; }
.sc-chip { font-size: 0.8rem; font-weight: 700; border: 2px solid var(--ink); padding: 1px 6px; background: var(--accent, var(--white)); color: var(--tag-ink, var(--ink)); }
.sc-row.out .sc-chip { background: var(--paper); color: #6A6A6A; text-decoration: line-through; border-style: dashed; }

/* Messages */
.msg { display: flex; align-items: flex-start; gap: 12px; max-width: min(640px, 86%); }
.msg.me { align-self: flex-end; margin-right: 14px; }
.msg.member-msg { align-self: flex-start; }
.msg-col { display: flex; flex-direction: column; min-width: 0; }
.msg.me .msg-col { align-items: flex-end; }

.msg-av {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  margin-top: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  background: var(--accent, var(--white));
  border: var(--b);
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-4deg);
}
.msg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.msg-tag {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.82rem;
  line-height: 1;
  text-transform: uppercase;
  background: var(--accent, var(--ink));
  color: var(--tag-ink, var(--white));
  border: 2.5px solid var(--ink);
  padding: 4px 8px 3px;
  transform: rotate(-1.5deg);
}
.msg-vibe { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: #5A5A5A; }

.bubble {
  position: relative;
  border: var(--b);
  background: var(--white);
  padding: 12px 16px;
  font-size: 1.02rem;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.me .bubble { background: var(--ink); color: var(--white); }

/* Comic speech-bubble tail */
.tail { position: absolute; top: 12px; left: -15px; width: 18px; height: 22px; overflow: visible; }
.tail path { fill: var(--white); stroke: var(--ink); stroke-width: 3; stroke-linejoin: miter; }
.msg.me .tail { left: auto; right: -15px; transform: scaleX(-1); }
.msg.me .tail path { fill: var(--ink); }

.msg-meta {
  display: flex;
  gap: 10px;
  margin-top: 9px;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #5A5A5A;
}
.msg-meta .receipt { color: var(--ink); }

/* ---------- Composer ---------- */
.bar {
  grid-area: bar;
  border-top: var(--B);
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "rand level input send";
  align-items: stretch;
  gap: 14px;
  padding: 12px 14px 14px;
  background: var(--white);
}
.bar > * { min-width: 0; }

.rand-btn, .send-btn {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.05rem;
  text-transform: uppercase;
  padding: 0 18px;
  min-height: 58px;
}
.rand-btn { grid-area: rand; background: var(--c3); }
.rand-btn .ico { display: inline-block; margin-right: 4px; }
.rand-btn:not(:disabled):hover .ico { animation: dice 0.5s ease-in-out; }
@keyframes dice { 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg); } }
.send-btn { grid-area: send; background: var(--c1); min-width: 112px; }

.levels { grid-area: level; display: flex; align-items: stretch; gap: 0; }
.levels-label {
  display: flex;
  align-items: center;
  justify-content: center;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--white);
  padding: 0 3px;
  border: var(--b);
}
.lvl-keys { display: flex; gap: 6px; padding-left: 8px; }
.lvl {
  background: var(--white);
  width: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  line-height: 1;
  padding: 4px 0;
  box-shadow: 3px 3px 0 var(--ink);
}
.lvl:not(:disabled):hover { box-shadow: 4px 4px 0 var(--ink); }
.lvl .e { font-size: 1.25rem; filter: grayscale(0.7); transition: filter 0.15s, transform 0.15s; }
.lvl .n { font-family: var(--mono); font-size: 0.58rem; font-weight: 700; text-transform: uppercase; }
.lvl[aria-checked="true"] {
  background: var(--lvl-color);
  transform: translate(3px, 3px);
  box-shadow: inset 0 0 0 2px var(--ink);
}
.lvl[aria-checked="true"] .e { filter: none; transform: scale(1.15); }
.lvl[aria-checked="true"] .n { font-weight: 700; }
.lvl[aria-checked="true"]:hover { transform: translate(3px, 3px); box-shadow: inset 0 0 0 2px var(--ink); }

.input-wrap {
  grid-area: input;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--white);
  border: var(--b);
  box-shadow: 4px 4px 0 var(--ink);
  cursor: text;
  transition: box-shadow 120ms;
}
.input-wrap:focus-within { box-shadow: 4px 4px 0 var(--c2); }
.input-wrap .prompt { font-size: 1.2rem; flex-shrink: 0; }
.input {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-size: 1rem;
  line-height: 1.4;
  max-height: 140px;
  outline: none;
  padding: 6px 0;
}
.input::placeholder { color: #8A8A8A; }

/* ================================================================
   ANIMATION  (transform / opacity / clip-path only)
   ================================================================ */
/* Hard shadow lives on a wrapper so it can "grow" with a transform */
.bwrap { position: relative; }
.bwrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent, var(--ink));
  outline: 2.5px solid var(--ink);
  outline-offset: -2.5px;
  transform: translate(7px, 7px);
}
.msg.me .bwrap::before { background: var(--l5); }

/* Typing indicators */
.dots i { font-style: normal; animation: blink 0.9s steps(1) infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.15; } }
.bounce { display: inline-flex; gap: 6px; padding: 5px 2px; }
.bounce i { width: 9px; height: 9px; background: var(--ink); animation: bounce 0.9s ease-in-out infinite; }
.bounce i:nth-child(2) { animation-delay: 0.15s; }
.bounce i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }
.ghost .bubble { background: var(--paper); }
.ghost .bwrap::before { opacity: 0.35; }
.ghost .tail path { fill: var(--paper); }
.ghost .msg-tag { transform: none; }
.ghost-stack { display: flex; margin-top: 26px; }
.ghost-stack span {
  width: 34px; height: 34px; margin-left: -8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  background: var(--accent); border: var(--b);
}
.ghost-stack span:first-child { margin-left: 0; }

/* Boot: window drops in and settles */
.a-boot { animation: drop 560ms cubic-bezier(.2,.85,.25,1.05) both; }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(18px) scale(0.985); }
  100% { opacity: 1; transform: none; }
}

/* User bubble launches up from the input */
.a-launch { animation: launch 440ms cubic-bezier(.2,.9,.25,1.12) both; transform-origin: bottom right; }
@keyframes launch { from { opacity: 0; transform: translateY(48px) scale(0.96); } to { opacity: 1; transform: none; } }

/* Member bubble stamps in, shadow grows after */
.a-stamp { animation: stamp 380ms cubic-bezier(.2,.9,.25,1.15) both; transform-origin: 20px 40px; }
.a-stamp .bwrap::before { animation: shadowGrow 260ms 160ms cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes stamp { from { opacity: 0; transform: translateY(10px) scale(0.94); } to { opacity: 1; transform: none; } }
@keyframes shadowGrow { from { transform: translate(0, 0); } to { transform: translate(7px, 7px); } }

.a-ghost, .a-sys { animation: fadeUp 220ms ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Rail cards on first load (randomize uses card flips in JS) */
.a-stamp-in { animation: railIn 420ms cubic-bezier(.2,.85,.25,1.1) both; }
@keyframes railIn {
  from { opacity: 0; transform: translateX(-16px) rotate(-1deg); }
  to   { opacity: 1; transform: none; }
}

/* Level change: dim, strike through, fold away, stub, collapse */
.msg.pending { opacity: 0.45; transition: opacity 0.2s; }
.a-unsend .bubble::after {
  content: '';
  position: absolute;
  left: 10px; right: 10px; top: 50%;
  height: 4px;
  background: var(--err);
  transform-origin: left;
  animation: strike 200ms cubic-bezier(.4,0,.2,1) both;
}
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.stub {
  margin-left: 56px;
  border: 3px dashed var(--ink);
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  font-style: italic;
  text-transform: uppercase;
  opacity: 0.65;
}

/* Reaction tags */
.react {
  position: absolute;
  bottom: -16px;
  right: 14px;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--white);
  border: 2.5px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 2px 7px;
  font-size: 0.95rem;
  line-height: 1.2;
  transform: rotate(-4deg);
}
.react small { font-size: 0.7rem; }
.a-pop { animation: pop 260ms cubic-bezier(.2,.9,.3,1.5) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4) rotate(-14deg); } to { opacity: 1; transform: rotate(-4deg); } }

@media (prefers-reduced-motion: reduce) {
  .a-boot, .a-launch, .a-stamp, .a-stamp-in, .a-ghost, .a-sys, .a-pop { animation: fadeIn 180ms both !important; }
  .a-stamp .bwrap::before, .a-unsend .bubble::after, .dots i, .bounce i { animation: none !important; }
}

// Generated squad names for non-curated picks
const SQUAD_BODIES = ['Board', 'Committee', 'Ministry', 'Supreme Court', 'Cabinet', 'Tribunal',
  'Syndicate', 'Panel', 'Union', 'Department', 'Council Within The Council', 'Emergency Meeting'];
const SQUAD_OF = ['Bad Decisions', 'Unsolicited Advice', 'Emotional Damage', 'Questionable Ethics',
  'Midnight Thoughts', 'Zero Accountability', 'Overthinking', 'Main Character Energy', 'Delulu Affairs',
  'Unpaid Opinions', 'Mild Chaos', 'Things We Should Not Say', 'Avoidable Problems', 'Group Project Trauma'];

const ROSTER_BY_NAME = new Map(ROSTER.map(p => [p.name, p]));
const VALID_SQUADS = CHAOS_SQUADS.filter(sq => {
  const missing = sq.members.filter(n => !ROSTER_BY_NAME.has(n));
  if (missing.length) console.warn('Chaos squad skipped, unknown members:', sq.title, missing);
  return !missing.length;
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

function generateSquadName(prevName) {
  let name;
  do { name = `The ${pickOne(SQUAD_BODIES)} of ${pickOne(SQUAD_OF)}`; } while (name === prevName);
  return name;
}

// Rules: 4 different roles, at least one SAGE/WHOLESOME and one
// MENACE/UNHINGED_OBJECT, no member carried over from the previous squad.
function pickContrastSquad(prevNames) {
  const anchor = pickOne(['SAGE', 'WHOLESOME']);
  const chaos  = pickOne(['MENACE', 'UNHINGED_OBJECT']);
  const rest   = shuffle(ROLES.filter(r => r !== anchor && r !== chaos)).slice(0, 2);
  const roles  = shuffle([anchor, chaos, ...rest]);
  return roles.map(role => {
    const pool = ROSTER.filter(p => p.role === role && !prevNames.has(p.name));
    return pickOne(pool.length ? pool : ROSTER.filter(p => p.role === role));
  });
}

function pickSquad(prevMembers, prevTitle) {
  const prevNames = new Set(prevMembers.map(p => p.name));
  if (Math.random() < CHAOS_CHANCE) {
    const options = VALID_SQUADS.filter(sq =>
      sq.title !== prevTitle && !sq.members.some(n => prevNames.has(n)));
    if (options.length) {
      const sq = pickOne(options);
      return { title: sq.title, members: shuffle(sq.members.map(n => ROSTER_BY_NAME.get(n))) };
    }
  }
  return { title: generateSquadName(prevTitle), members: pickContrastSquad(prevNames) };
}

}

async function fetchCouncil(question) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, personalities: state.members, quirk_level: state.level }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Error ${res.status}`);
  }
  const data = await res.json();
  if (!Array.isArray(data.members)) throw new Error('The council returned an empty reply. Send again.');
  return data.members;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

// Durations in ms; keep in sync with the CSS keyframes
const T = {
  boot: 560,       // window drop
  stampGap: 110,   // stagger between rail cards on first load
  flipOut: 190,    // randomize: card turns away
  flipIn: 420,     // randomize: new card turns in
  flipGap: 65,     // stagger between flipping cards
  unsendGap: 90,
  stubHold: 650,   // how long "deleted" stubs stay
  collapse: 280,
  debounce: 900,   // level change -> re-summon
};

// Each reply waits 700-1600ms, scaled by its length, slightly randomised
function typingTime(text) {
  const len = String(text || '').length;
  return Math.round(Math.min(1600, Math.max(700, 620 + len * 6 + rand(-120, 180))));
}

async function typeOut(el, text) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    await wait(ch === ' ' ? 10 : 24);
  }
}

function scrollToBottom() {
  requestAnimationFrame(() =>
    els.stream.scrollTo({ top: els.stream.scrollHeight, behavior: REDUCED ? 'auto' : 'smooth' }));
}

function appendToStream(el) {
  els.stream.appendChild(el);
  scrollToBottom();
  return el;
}

function postSystem(text, isError = false, { typed = false } = {}) {
  const el = document.createElement('div');
  el.className = 'sys a-sys' + (isError ? ' err' : '');
  el.setAttribute('role', isError ? 'alert' : 'status');
  appendToStream(el);
  if (typed && !REDUCED) typeOut(el, text);
  else el.textContent = text;
  return el;
}

// ---------- Reactions (client-side decoration only) ----------
const REACTIONS = ['💀', '😭', '🤡', '🔥', '😤', '🙏', '🫠', '👀'];

async function dropReactions(round) {
  const n = round.memberEls.length;
  if (n < 2) return;
  const count = Math.random() < 0.5 ? 1 : 2;
  const used = new Set();
  for (let k = 0; k < count; k++) {
    await wait(rand(350, 750));
    let from, to, tries = 0;
    do {
      from = Math.floor(Math.random() * n);
      to = Math.floor(Math.random() * n);
    } while ((from === to || used.has(to)) && ++tries < 30);
    if (from === to || used.has(to)) return;
    used.add(to);
    const reactor = round.members[from];
    const tag = document.createElement('span');
    tag.className = 'react a-pop';
    tag.title = `${reactor.name} reacted`;
    tag.innerHTML = `${pickOne(REACTIONS)}<small>${escHtml(reactor.emoji)}</small>`;
    round.memberEls[to].querySelector('.bwrap')?.appendChild(tag);
  }
}

// ---------- Unsend (level change) ----------
// Collapse an element's height smoothly so nothing below it jumps
async function collapseAway(el) {
  if (REDUCED) { el.remove(); return; }
  const h = el.offsetHeight;
  el.style.overflow = 'hidden';
  await el.animate(
    [{ height: `${h}px`, opacity: 1, marginBottom: '0px' }, { height: '0px', opacity: 0, marginBottom: '-16px' }],
    { duration: T.collapse, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished;
  el.remove();
}

async function unsendAll(msgEls) {
  await Promise.all(msgEls.map(async (el, i) => {
    await wait(i * T.unsendGap);
    el.classList.remove('pending', 'a-stamp');
    el.classList.add('a-unsend');                 // red strike draws across
    await wait(240);
    if (!REDUCED) {
      await el.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-10px) rotate(-1.5deg) scale(0.97)' }],
        { duration: 220, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished;
    }
    el.getAnimations().forEach(a => a.cancel());
    el.className = 'msg member-msg deleted';
    el.innerHTML = '<div class="stub">⌫ This message was deleted</div>';
    el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'ease-out' });
    await wait(T.stubHold);
    await collapseAway(el);
  }));
}

function syncLevels() {
  els.levels.querySelectorAll('.lvl').forEach(b =>
    b.setAttribute('aria-checked', String(Number(b.dataset.level) === state.level)));
  const now = $('levelNow');
  now.textContent = `Chaos: ${LEVELS[state.level - 1].name} ${LEVELS[state.level - 1].emoji}`;
  now.style.setProperty('--lvl-color', `var(--l${state.level})`);
}

function setLevel(v) {
  if (state.busy || v === state.level) return;
  state.level = v;
  syncLevels();
  applyIntensity(v);

  const round = state.round;
  if (!round || !round.memberEls.length || !round.userEl.isConnected) return;

  // Debounced re-summon: replies dim while the user is still picking
  clearTimeout(state.resummonTimer);
  round.memberEls.forEach(el => el.classList.add('pending'));
  state.resummonTimer = setTimeout(() => resummon(round), T.debounce);
}

function cancelResummon() {
  clearTimeout(state.resummonTimer);
  state.resummonTimer = null;
  state.round?.memberEls.forEach(el => el.classList.remove('pending'));
}

async function resummon(round) {
  state.resummonTimer = null;
  if (state.busy || state.round !== round) return;
  setBusy(true);
  removeShotButton();
  await unsendAll(round.memberEls);
  round.memberEls = [];
  await runCouncil(round.question, round.userEl);
}

function setBusy(on) {
  state.busy = on;
  els.send.disabled = on;
  els.rand.disabled = on;
  els.levels.querySelectorAll('.lvl').forEach(b => (b.disabled = on));
}

async function runCouncil(question, userEl) {
  setBusy(true);
  removeShotButton();
  setAllStatus('typing');
  const groupGhost = appendToStream(makeGhost(null));
  setReceipt(userEl, 'Delivered');

  let members;
  try {
    members = await fetchCouncil(question);
  } catch (err) {
    groupGhost.remove();
    setAllStatus('idle');
    setReceipt(userEl, 'Not delivered');
    postSystem(err.message || 'Request failed. Send again.', true);
    setBusy(false);
    return;
  }

  setReceipt(userEl, `Read by ${members.length}`);
  setAllStatus('idle');

  const round = {
    question, userEl, members, memberEls: [],
    level: state.level, squadTitle: state.squadTitle,
    slots: members.map((m, i) => slotFor(m, i)),
    story: null,               // cached PNG blob
  };
  state.round = round;

  // Sequential reveal: each member types, then their bubble stamps in
  for (let i = 0; i < members.length; i++) {
    const m = members[i];
    const slot = slotFor(m, i);
    setStatus(slot, 'typing');
    const ghost = makeGhost(slot, m);
    if (i === 0) groupGhost.replaceWith(ghost);
    else els.stream.appendChild(ghost);
    scrollToBottom();
    await wait(typingTime(m.response));
    const msgEl = makeMember(m, slot);
    ghost.replaceWith(msgEl);
    scrollToBottom();
    round.memberEls.push(msgEl);
    setStatus(slot, 'replied');
  }
  if (!members.length) groupGhost.remove();

  const missing = state.members.length - members.length;
  if (missing > 0) {
    state.members.forEach((p, i) => {
      if (!members.some(m => m.name === p.name)) setStatus(i, 'left');
    });
    postSystem(`${missing} member${missing > 1 ? 's' : ''} left you on read`);
  }

  await dropReactions(round);
  setBusy(false);
  if (members.length) showShotButton();
}

async function send() {
  if (state.busy) return;
  const question = els.input.value.trim();
  if (!question) { postSystem('Type a message before sending.', true); els.input.focus(); return; }

  cancelResummon();
  startMusicFor(question);   // must stay before any await: Tone.start() needs the user gesture

  els.input.value = '';
  autosize();

  const userEl = postUser(question);
  await runCouncil(question, userEl);
  els.input.focus();
}

// Swap the header title with a quick slide (old text up and out, new text up and in)
async function swapTitle(text) {
  if (REDUCED || !els.squad.textContent) { els.squad.textContent = text; return; }
  await els.squad.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-70%)', opacity: 0 }],
    { duration: 160, easing: 'ease-in', fill: 'forwards' }).finished;
  els.squad.getAnimations().forEach(a => a.cancel());
  els.squad.textContent = text;
  els.squad.animate([{ transform: 'translateY(70%)', opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 300, easing: 'cubic-bezier(.2,.9,.25,1.15)' });
}

const flipOut = el => el.animate(
  [{ transform: 'perspective(700px) rotateY(0deg)', opacity: 1 }, { transform: 'perspective(700px) rotateY(90deg)', opacity: 0.4 }],
  { duration: T.flipOut, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
const flipIn = (el, delay) => el.animate(
  [{ transform: 'perspective(700px) rotateY(-90deg)', opacity: 0.4 },
   { transform: 'perspective(700px) rotateY(10deg)', opacity: 1, offset: 0.7 },
   { transform: 'perspective(700px) rotateY(0deg)', opacity: 1 }],
  { duration: T.flipIn, delay, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });

async function randomize(announce = true) {
  if (state.busy) return;
  const prev = state.members;
  const squad = pickSquad(prev, state.squadTitle);
  cancelResummon();
  state.round = null;          // a new squad shouldn't rewrite the old squad's replies
  removeShotButton();
  state.members = squad.members;
  state.squadTitle = squad.title;

  if (!announce || !prev.length) {
    els.squad.textContent = squad.title;
    renderRail(true, announce ? 0 : T.boot - 150);
    return;
  }

  setBusy(true);
  const oldCards = [...els.rail.querySelectorAll('.member:not(.you)')];
  const oldAvatars = [...$('headAvatars').children];
  if (!REDUCED) {
    oldAvatars.forEach((el, i) => el.animate([{ transform: 'scale(1)' }, { transform: 'scale(0)' }],
      { duration: 160, delay: i * 40, easing: 'ease-in', fill: 'forwards' }));
    // each card turns away, staggered, like dealing a new hand
    await Promise.all(oldCards.map((el, i) =>
      wait(i * T.flipGap).then(() => flipOut(el).finished)));
  }
  swapTitle(squad.title);
  renderRail(false);
  if (!REDUCED) {
    els.rail.querySelectorAll('.member:not(.you)').forEach((el, i) => flipIn(el, i * T.flipGap));
    [...$('headAvatars').children].forEach((el, i) => el.animate(
      [{ transform: 'scale(0) rotate(-20deg)' }, { transform: 'scale(1.15)', offset: 0.7 }, { transform: 'none' }],
      { duration: 360, delay: 120 + i * 60, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' }));
  }
  postSquadChange(prev, state.members, squad.title);
  await wait(REDUCED ? 0 : state.members.length * T.flipGap + T.flipIn);
  setBusy(false);
}

function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 140) + 'px';

// Mood routing: keyword pre-checks first (the emotion model can't spot

const MOOD_KEYWORDS = {
  romantic: /\b(love|crush|ex|exes|relationship|dating|date|dates|marry|marriage|married|breakup|break up|broke up|girlfriend|boyfriend|gf|bf|bae|flirt|flirting|romance|romantic|heartbreak|situationship|propose|proposal|divorce|cheat|cheated|cheating|feelings for|likes me|like him|like her|text him|text her|ghosted|ghosting|tinder|hinge|bumble|rizz|wedding|shaadi|shadi|pyaar|pyar|ishq|mohabbat|rishta|jaanu|babu|dil)\b/,
  anxious:  /\b(exam|exams|padhai|padhna|study|studying|boards|board exam|jee|neet|upsc|gate|marks|result|results|grades|gpa|cgpa|assignment|deadline|viva|semester|backlog|kota|tuition|coaching|revision|syllabus|finals|midterms)\b/,
  career:   /\b(job|jobs|work|boss|salary|career|office|resign|resignation|quit|promotion|interview|fired|layoff|laid off|workplace|coworker|colleague|manager|hr|hire|hiring|startup|business|freelance|internship|intern|appraisal|increment|hustle|naukri|naukari|kaam|placement|placements|package|ctc|notice period|linkedin|corporate|wfh)\b/,
};

const HF_TO_MOOD = {
  joy: 'playful', sadness: 'sad', anger: 'anxious', fear: 'anxious',
  disgust: 'chaotic', surprise: 'philosophical', neutral: 'neutral',
};

async function classifyMood(text) {
  const t = text.toLowerCase();
  for (const mood of ['romantic', 'anxious', 'career']) {
    if (MOOD_KEYWORDS[mood].test(t)) return mood;
  }
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emotion_text: text }),
    });
    const data = await res.json();
    return HF_TO_MOOD[data.emotion] ?? 'neutral';
  } catch {
    return 'neutral';
  }
}

const FADE_OUT = 0.5;   // seconds; crossfade = fade out, swap, fade in
const FADE_IN = 0.8;

const music = {
  enabled: true,        // the [ SOUND ] toggle
  mood: null,           // mood currently built
  wanted: null,         // latest mood asked for (played when sound turns on)
  playing: false,
  token: 0,             // cancels stale crossfades
  master: null, limiter: null,
  parts: [], nodes: [], fx: null,
};

// ---------- small builders ----------
const track = node => { music.nodes.push(node); return node; };
const syn  = (opts, out) => track(new Tone.Synth(opts).connect(out));
const poly = (opts, out) => track(new Tone.PolySynth(Tone.Synth, opts).connect(out));

// events: [time, note(s), duration?]
function loopPart(synth, events, loopEnd, dur) {
  const p = new Tone.Part((t, e) => synth.triggerAttackRelease(e.n, e.d || dur, t),
    events.map(([time, n, d]) => ({ time, n, d })));
  p.loop = true; p.loopEnd = loopEnd; p.start(0);
  music.parts.push(p);
}
// notes: flat array, null = rest
function stepSeq(synth, notes, sub, dur) {
  const s = new Tone.Sequence((t, n) => { if (n) synth.triggerAttackRelease(n, dur, t); }, notes, sub);
  s.start(0);
  music.parts.push(s);
}

function drumKit(out, vol = {}) {
  const kick = track(new Tone.MembraneSynth({
    pitchDecay: 0.03, octaves: 5, envelope: { attack: 0.001, decay: 0.32, sustain: 0 }, volume: vol.kick ?? -12,
  }).connect(out));
  const snare = track(new Tone.NoiseSynth({
    noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.15, sustain: 0 }, volume: vol.snare ?? -24,
  }).connect(out));
  const hatFilter = track(new Tone.Filter(7500, 'highpass').connect(out));
  const hat = track(new Tone.NoiseSynth({
    noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.035, sustain: 0 }, volume: vol.hat ?? -30,
  }).connect(hatFilter));
  return { kick, snare, hat };
}
// 16-step patterns per bar: 'x' = hit
function drumPattern(kit, pat) {
  const s = new Tone.Sequence((t, i) => {
    if (pat.kick?.[i] === 'x')  kit.kick.triggerAttackRelease(pat.kickNote || 'C1', '8n', t);
    if (pat.snare?.[i] === 'x') kit.snare.triggerAttackRelease('16n', t);
    if (pat.hat?.[i] === 'x')   kit.hat.triggerAttackRelease('32n', t);
  }, [...Array(16).keys()], '16n');
  s.start(0);
  music.parts.push(s);
}

// ---------- engine ----------
function ensureMaster() {
  if (music.master) return;
  music.limiter = new Tone.Limiter(-1).toDestination();
  music.master = new Tone.Gain(0.8).connect(music.limiter);
}

function cleanupMusic() {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  music.parts.forEach(p => { try { p.dispose(); } catch {} });
  music.nodes.forEach(n => { try { n.dispose(); } catch {} });
  music.parts = []; music.nodes = []; music.fx = null;
  music.playing = false;
}

// Level 1 -> base bpm, level 5 -> +15%. Grit on the lead at 4-5.
function applyIntensity(level, ramp = 1) {
  if (!music.fx || !music.mood) return;
  const t = Math.max(ramp, 0.01);
  Tone.Transport.bpm.rampTo(MOODS[music.mood].bpm * (1 + 0.15 * (level - 1) / 4), t);
  music.fx.dist.wet.rampTo(level >= 5 ? 0.55 : level === 4 ? 0.3 : 0, t);
  music.fx.crunch.wet.rampTo(level >= 5 ? 0.35 : level === 4 ? 0.15 : 0, t);
}

async function playMood(mood) {
  if (!window.Tone || !MOODS[mood]) return;
  const token = ++music.token;

  if (music.playing) {
    Tone.Destination.volume.rampTo(-60, FADE_OUT);
    await wait(FADE_OUT * 1000);
    if (token !== music.token) return;
  }
  cleanupMusic();
  Tone.Destination.volume.value = -60;
  ensureMaster();

  const bus = track(new Tone.Gain(1).connect(music.master));
  const reverb = track(new Tone.Reverb({ decay: 3.5, wet: 0.35 }).connect(bus));
  await reverb.ready;
  if (token !== music.token) return;
  const delay = track(new Tone.FeedbackDelay('8n', 0.22).connect(reverb));
  delay.wet.value = 0.3;
  const dist = track(new Tone.Distortion(0.7));
  const crunch = track(new Tone.Chebyshev(24));
  dist.wet.value = 0; crunch.wet.value = 0;
  const lead = track(new Tone.Gain(1));
  lead.chain(dist, crunch, reverb);

  music.mood = mood;
  music.fx = { dist, crunch };
  MOODS[mood].build({ bus, reverb, delay, lead });
  Tone.Transport.bpm.value = MOODS[mood].bpm;
  applyIntensity(state.level, 0);

  Tone.Transport.start('+0.05');
  music.playing = true;
  Tone.Destination.volume.rampTo(0, FADE_IN);
  updateMusicUI();
}

async function toggleSound() {
  music.enabled = !music.enabled;
  if (window.Tone) {
    if (music.enabled) {
      await Tone.start();
      if (music.wanted && (music.wanted !== music.mood || !music.playing)) playMood(music.wanted);
      else if (music.mood) { Tone.Transport.start('+0.05'); music.playing = true; Tone.Destination.volume.rampTo(0, FADE_IN); }
    } else if (music.playing) {
      const token = ++music.token;
      Tone.Destination.volume.rampTo(-60, FADE_OUT);
      await wait(FADE_OUT * 1000);
      if (token === music.token && !music.enabled) { Tone.Transport.pause(); music.playing = false; }
    }
  }
  updateMusicUI();
}

// Called from send(): starts audio inside the user gesture, then routes mood
function startMusicFor(question) {
  if (!window.Tone) return;
  const ready = music.enabled ? Tone.start() : Promise.resolve();
  classifyMood(question).then(async mood => {
    music.wanted = mood;
    await ready;
    if (music.enabled && (mood !== music.mood || !music.playing)) playMood(mood);
    else updateMusicUI();
  });
}

function updateMusicUI() {
  const btn = $('soundBtn');
  const np = $('nowPlaying');
  $('soundIco').textContent = music.enabled ? '🔊' : '🔇';
  $('soundTxt').textContent = music.enabled ? 'On' : 'Off';
  btn.setAttribute('aria-pressed', String(music.enabled));
  btn.setAttribute('aria-label', music.enabled ? 'Sound on' : 'Sound off');
  const mood = music.enabled ? (music.mood || music.wanted) : null;
  let text;
  if (!window.Tone) text = 'Audio unavailable';
  else if (!music.enabled) text = 'Muted';
  else if (mood && music.playing) text = MOODS[mood].label;
  else text = 'Nothing yet';
  np.textContent = text;
  np.title = text;
  $('soundBox').classList.toggle('playing', !!(music.enabled && music.playing));
}

// ================================================================
//  STORY EXPORT  (screenshot -> 1080x1920 Instagram story)
// ================================================================
const STORY_W = 1080;
const STORY_H = 1920;
const story = { open: false, token: 0, file: null, url: null, lastFocus: null };

// ---------- screenshot button in the stream ----------
function removeShotButton() {
  els.stream.querySelectorAll('.shot-row').forEach(el => el.remove());
}

function showShotButton() {
  removeShotButton();
  const row = document.createElement('div');
  row.className = 'shot-row';
  row.innerHTML = '<button class="kbtn shot-btn a-slam" type="button"><span class="ico" aria-hidden="true">📸</span>Screenshot this chat</button>';
  row.querySelector('button').addEventListener('click', openStory);
  appendToStream(row);
}

// ---------- off-screen story layout ----------
function buildStoryDOM(round) {
  const lvl = LEVELS[round.level - 1];
  const root = document.createElement('div');
  root.id = 'storyRender';
  root.className = 'st';
  root.innerHTML = `
    <div class="st-top">
      <div class="st-title">The Council</div>
      <div class="st-sub"><span>${escHtml(round.squadTitle)}</span><span>Level ${lvl.v} // ${escHtml(lvl.name)} ${lvl.emoji}</span></div>
    </div>
    <div class="st-body">
      <div class="st-q">
        <div class="st-tag st-tag-you">You asked</div>
        <div class="st-bubble st-bubble-you"></div>
      </div>
      ${round.members.map((m, i) => {
        const a = ACCENTS[round.slots[i] % ACCENTS.length];
        return `
        <div class="st-r" style="--accent:${a.bg};--tag-ink:${a.ink}">
          <div class="st-tag">${escHtml(m.emoji)} ${escHtml(m.name)}</div>
          <div class="st-bubble" data-i="${i}"></div>
        </div>`;
      }).join('')}
    </div>
    <div class="st-foot">
      <div class="st-cta">Ask your own council</div>
      <div class="st-url">${escHtml(SITE_URL)}</div>
    </div>`;
  // text via textContent so nothing from the model is ever parsed as HTML
  root.querySelector('.st-bubble-you').textContent = round.question;
  root.querySelectorAll('.st-bubble[data-i]').forEach(b => {
    b.textContent = round.members[Number(b.dataset.i)].response;
  });
  return root;
}

// Shrink type until everything fits; truncate the longest text only as a last resort
function fitStory(root) {
  const body = root.querySelector('.st-body');
  const overflowing = () => body.scrollHeight > body.clientHeight + 1;
  for (let fs = 46; fs >= 24; fs -= 2) {
    body.style.setProperty('--fs', fs + 'px');
    if (!overflowing()) return;
  }
  const bubbles = [...root.querySelectorAll('.st-bubble')];
  for (let guard = 0; guard < 80 && overflowing(); guard++) {
    const longest = bubbles.reduce((a, b) => (b.textContent.length > a.textContent.length ? b : a));
    const text = longest.textContent.replace(/\.\.\.$/, '');
    if (text.length < 40) break;
    longest.textContent = text.slice(0, Math.floor(text.length * 0.88)).trimEnd() + '...';
  }
}

async function fontsReady() {
  if (!document.fonts) return;
  try {
    await Promise.all([
      document.fonts.load('80px "Archivo Black"'),
      document.fonts.load('400 30px "Space Mono"'),
      document.fonts.load('700 30px "Space Mono"'),
    ]);
    await document.fonts.ready;
  } catch { /* fall back to system fonts */ }
}

async function renderStory(round) {
  if (!window.html2canvas) throw new Error('Screenshot library failed to load. Check your connection and reload.');
  await fontsReady();
  const root = buildStoryDOM(round);
  document.body.appendChild(root);
  try {
    fitStory(root);
    const canvas = await html2canvas(root, {
      width: STORY_W, height: STORY_H, scale: 1, x: 0, y: 0,
      windowWidth: STORY_W, windowHeight: STORY_H, scrollX: 0, scrollY: 0,
      backgroundColor: '#F2F0E9', logging: false,
      // the live copy sits off-screen; move the clone into frame before painting
      onclone: doc => {
        const el = doc.getElementById('storyRender');
        el.style.left = '0px';
        el.style.top = '0px';
      },
    });
    const blob = await new Promise((res, rej) =>
      canvas.toBlob(b => (b ? res(b) : rej(new Error('Could not create the image.'))), 'image/png'));
    return blob;
  } finally {
    root.remove();
  }
}

// ---------- overlay + FLIP ----------
function storyFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `the-council-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
}

function sizeStoryCard() {
  const card = $('storyCard');
  const actions = $('storyActions').offsetHeight || 70;
  const maxH = window.innerHeight - actions - 72;
  const w = Math.min(window.innerWidth - 32, maxH * 9 / 16);
  card.style.width = `${Math.floor(w)}px`;
  card.style.height = `${Math.floor(w * 16 / 9)}px`;
}

function setStoryStatus(text) { $('storyStatus').textContent = text; }
function setStoryButtons(enabled) {
  $('storyDownload').disabled = !enabled;
  $('storyShare').disabled = !enabled;
}

// Where the card would sit if it were fitted inside the chat area, same proportions.
// Uniform scale only, so nothing ever looks squashed.
function fitInto(rect, card) {
  const to = card.getBoundingClientRect();
  const s = Math.min(rect.width / to.width, rect.height / to.height) * 0.9;
  const dx = rect.left + rect.width / 2 - (to.left + to.width / 2);
  const dy = rect.top + rect.height / 2 - (to.top + to.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${s})`;
}

async function openStory() {
  const round = state.round;
  if (story.open || state.busy || state.resummonTimer || !round?.members.length) return;
  story.open = true;
  story.lastFocus = document.activeElement;
  const token = ++story.token;

  // Start rendering right away; the animation runs while it works
  const cached = round.story;
  const render = cached ? Promise.resolve(cached) : renderStory(round).then(blob => (round.story = blob));

  const overlay = $('storyOverlay');
  const card = $('storyCard');
  const img = $('storyImg');
  img.hidden = true;
  img.removeAttribute('src');
  $('storyLoading').hidden = false;
  setStoryButtons(false);
  setStoryStatus('Developing');

  // 1. viewfinder flash over the chat
  const from = els.stream.getBoundingClientRect();
  if (!REDUCED) {
    const vf = document.createElement('div');
    vf.className = 'viewfinder';
    Object.assign(vf.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(vf);
    await wait(260);
    vf.remove();
  }

  // 2. the card rises out of the chat area and settles in the centre
  overlay.hidden = false;
  sizeStoryCard();
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  if (REDUCED) {
    overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
  } else {
    $('storyBackdrop').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'both' });
    $('storyActions').animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }],
      { duration: 340, delay: 260, fill: 'both', easing: 'cubic-bezier(.2,.9,.25,1.15)' });
    await card.animate([
      { transform: fitInto(from, card), opacity: 0 },
      { opacity: 1, offset: 0.3 },
      { transform: 'none', opacity: 1 },
    ], { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1.08)' }).finished;
  }
  $('storyDownload').focus();

  // 3. swap the loading state for the rendered image
  try {
    const blob = await render;
    if (token !== story.token || !story.open) return;
    if (story.url) URL.revokeObjectURL(story.url);
    story.url = URL.createObjectURL(blob);
    story.file = new File([blob], storyFileName(), { type: 'image/png' });
    img.src = story.url;
    await img.decode().catch(() => {});
    if (token !== story.token || !story.open) return;
    $('storyLoading').hidden = true;
    img.hidden = false;
    img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
    setStoryButtons(true);
    setStoryStatus('1080 × 1920 // Ready for your story');
  } catch (err) {
    if (token !== story.token) return;
    round.story = null;
    $('storyLoading').textContent = '! Render failed';
    setStoryStatus(err.message || 'Render failed. Go back and try again.');
  }
}

async function closeStory() {
  if (!story.open) return;
  story.open = false;
  story.token++;
  const overlay = $('storyOverlay');
  const card = $('storyCard');
  if (!REDUCED) {
    const to = els.stream.getBoundingClientRect();
    $('storyActions').animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(16px)' }],
      { duration: 160, easing: 'ease-in', fill: 'forwards' });
    $('storyBackdrop').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, delay: 60, easing: 'ease-in', fill: 'forwards' });
    await card.animate([{ transform: 'none', opacity: 1 }, { opacity: 1, offset: 0.6 }, { transform: fitInto(to, card), opacity: 0 }],
      { duration: 380, easing: 'cubic-bezier(.5,0,.4,1)', fill: 'forwards' }).finished;
  } else {
    await overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished;
  }
  overlay.hidden = true;
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  $('storyLoading').textContent = '▮▮▮ Developing';
  (story.lastFocus?.isConnected ? story.lastFocus : els.input).focus();
}

function downloadStory() {
  if (!story.url || !story.file) return;
  const a = document.createElement('a');
  a.href = story.url;
  a.download = story.file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStoryStatus('Downloaded ' + story.file.name);
}

async function shareStory() {
  const file = story.file;
  if (!file) return;
  // navigator.share must be the first await so the click still counts as a gesture
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'The Council', text: `Ask your own council: ${SHARE_URL}` });
      setStoryStatus('Shared');
      return;
    } catch (err) {
      if (err.name === 'AbortError') { setStoryStatus('Share cancelled'); return; }
    }
  }
  // Fallback: copy the link and download the image
  let copied = false;
  try { await navigator.clipboard.writeText(SHARE_URL); copied = true; } catch {}
  downloadStory();
  setStoryStatus(copied ? 'Link copied // Image downloaded' : 'Image downloaded // Share it from your photos');
}

function storyKeydown(e) {
  if (!story.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeStory(); return; }
  if (e.key === 'Tab') {
    const btns = [...$('storyActions').querySelectorAll('button:not(:disabled)')];
    if (!btns.length) return;
    const first = btns[0], last = btns[btns.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!btns.includes(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
}

// ================================================================
//  INIT
// ================================================================
(async function init() {
  if (window.matchMedia('(max-width: 720px)').matches) els.input.placeholder = 'Ask the council…';
  $('tickerTrack').textContent = TICKER_LINES.map(t => `✸ ${t}`).join('    ').repeat(2);

  renderLevels();
  $('app').classList.add('a-boot');
  randomize(false);

  els.send.addEventListener('click', send);
  els.rand.addEventListener('click', () => randomize(true));
  els.levels.addEventListener('click', e => {
    const b = e.target.closest('.lvl');
    if (b) setLevel(parseInt(b.dataset.level, 10));
  });
  $('soundBtn').addEventListener('click', toggleSound);
  $('storyDownload').addEventListener('click', downloadStory);
  $('storyShare').addEventListener('click', shareStory);
  $('storyBack').addEventListener('click', closeStory);
  document.addEventListener('keydown', storyKeydown);
  window.addEventListener('resize', () => { if (story.open) sizeStoryCard(); });
  updateMusicUI();
  els.input.addEventListener('input', autosize);
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  await wait(T.boot + state.members.length * T.stampGap);
  postDay();
  postSystem(`${state.members.length} members joined the chat`, false, { typed: true });
})();
</script>
