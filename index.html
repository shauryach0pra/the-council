<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Council</title>
<meta name="description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="The Council">
<meta property="og:description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root {
  --paper: #F2F0E9;
  --ink: #000000;
  --white: #FFFFFF;
  --c1: #FF3B00;  /* member slot 1 */
  --c2: #0038FF;  /* member slot 2 */
  --c3: #00E05A;  /* member slot 3 */
  --c4: #FFD600;  /* member slot 4 */
  --err: #FF1A1A;
  /* chaos heat, level 1 -> 5 */
  --l1: #00E05A; --l2: #FFD600; --l3: #FF8A00; --l4: #FF3B00; --l5: #FF4FD8;
  --b: 3px solid var(--ink);
  --B: 4px solid var(--ink);
  --shadow: 8px 8px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --display: 'Archivo', 'Arial Black', Impact, sans-serif;
  --text: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --pixel: var(--mono);
  --sh: var(--ink);   /* every hard shadow is black */
  --rail-w: 300px;
  --halftone: radial-gradient(rgba(0,0,0,0.11) 1.1px, transparent 1.6px);
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
/* condensed heavy caps need a little more air between words */
.brand, .squad-name, .msg-tag, .member-name, .chaos-head, .reel-item .n, .sc-title, .rand-btn, .send-btn, .spin-btn, .shot-btn, .play-btn, .t-title, .rail-head { word-spacing: 0.1em; }
html, body { height: 100%; }
body {
  background-color: var(--c2);
  background-image: radial-gradient(rgba(0,0,0,0.32) 1.4px, transparent 1.9px);
  background-size: 10px 10px;
  color: var(--ink);
  font-family: var(--text);
  word-spacing: 0.06em;   /* Archivo's space is narrow; open it up a touch everywhere */
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }
::selection { background: var(--c4); color: var(--ink); }

/* Brutalist scrollbars: a black slab on a paper track */
* { scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink); border: 3px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--c1); }


/* Shared chunky button: raised on hover, pressed on click */
.kbtn {
  border: var(--b);
  box-shadow: 4px 4px 0 var(--sh);
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.kbtn:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--sh); }
.kbtn:not(:disabled):active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--sh); }
.kbtn:disabled { cursor: not-allowed; opacity: 0.45; }

/* ================================================================
   WINDOW
   ================================================================ */
.app {
  position: fixed;
  inset: calc(16px + env(safe-area-inset-top, 0px)) calc(26px + env(safe-area-inset-right, 0px))
         calc(26px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "brand  head"
    "rail   stream"
    "rand   bar";
  background: var(--paper);
  border: var(--B);
  box-shadow: 10px 10px 0 var(--ink);
  min-height: 0;
}

/* ---------- Header ---------- */
/* Sidebar top: the app's name, stretched across the whole sidebar */
.brand {
  grid-area: brand;
  border-bottom: var(--B);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--c4);
  color: var(--ink);
  border-right: var(--B);
  padding: 0 18px;
  font-family: var(--display);
  font-weight: 900;
  font-stretch: 72%;
  font-size: 1.9rem;
  line-height: 0.9;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  min-height: 78px;
}
.brand .ico { font-size: 1.9rem; }
.brand small { display: block; font-family: var(--text); font-stretch: 100%; font-size: 0.7rem; font-weight: 700; letter-spacing: 0; text-transform: none; margin-top: 5px; }

/* Chat header: group name + members, sound unit on the right */
.titlebar {
  grid-area: head;
  display: flex;
  align-items: stretch;
  border-bottom: var(--B);
  background: var(--ink);
  color: var(--white);
  min-width: 0;
  min-height: 78px;
}
.head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 10px 20px; }
.squad-name {
  font-family: var(--display);
  font-weight: 900;
  font-stretch: 78%;
  font-size: clamp(1.25rem, 2vw, 1.85rem);
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.head-sub {
  display: flex;
  align-items: baseline;
  gap: 4px 14px;
  margin-top: 6px;
  min-width: 0;
  font-size: 0.8rem;
  color: #CFCFCF;
}
.head-members { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Sound: one block in the header. Bars move with the music; clicking sinks them and pops a mute icon. ---------- */
.sound { flex-shrink: 0; align-self: center; display: flex; margin-right: 16px; }
.sound-btn {
  position: relative;
  width: 66px; height: 50px;
  display: grid; place-items: center;
  padding: 0;
  background: var(--ink);
  color: var(--white);
  border: 3px solid var(--white);
  cursor: pointer;
  overflow: hidden;
  transition: background 0.15s, color 0.15s;
}
.sound-btn:hover { background: var(--white); color: var(--ink); }
.sound-btn:active { transform: translate(2px, 2px); }
.viz, .sound-off { grid-area: 1 / 1; }
.viz { display: block; width: 44px; height: 28px; transform-origin: bottom; transition: transform 0.28s cubic-bezier(.5,0,.75,0), opacity 0.2s; }
.sound-off { width: 28px; height: 28px; transform: scale(0) rotate(-30deg); opacity: 0; transition: transform 0.32s cubic-bezier(.2,.9,.3,1.5), opacity 0.15s; }
.sound-off path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: square; }
.sound-off path:first-child { fill: currentColor; stroke: none; }
.sound-btn[aria-checked="false"] .viz { transform: scaleY(0.05); opacity: 0; }
.sound-btn[aria-checked="false"] .sound-off { transform: none; opacity: 1; transition-delay: 0.18s; }
.sound-btn[aria-checked="true"] .viz { transition-delay: 0.12s; transition-timing-function: cubic-bezier(.2,.9,.3,1.3); }

/* Randomize: each card turns into a spinning reel */
.member.slotting { display: block; padding: 0; overflow: hidden; position: relative; }
.slot-strip { will-change: transform; }
.slot-face {
  height: var(--h);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--white);
  border-bottom: var(--b);
}
.slot-face .avatar { flex-shrink: 0; transform: none; }
/* flat 'glass' bands top and bottom so the faces look like they pass behind a window */
.slot-glass { position: absolute; inset: 0; pointer-events: none; border-top: 6px solid rgba(0,0,0,0.12); border-bottom: 6px solid rgba(0,0,0,0.12); }

/* NEW! sticker on members you've never met before */
.member.is-new .avatar { position: relative; }
.member.is-new .avatar::after {
  content: 'NEW';
  position: absolute;
  top: -9px; right: -12px;
  font-family: var(--pixel);
  font-size: 0.55rem;
  background: var(--c1);
  color: var(--white);
  border: 2px solid var(--ink);
  padding: 1px 4px;
  transform: rotate(8deg);
}

/* ---------- Arcade toasts, floating points, confetti ---------- */
.toasts { position: fixed; z-index: 70; top: calc(108px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  min-width: 240px;
  max-width: min(420px, 92vw);
  background: var(--ink);
  color: var(--white);
  border: 3px solid var(--c4);
  box-shadow: 5px 5px 0 var(--c1);
  padding: 8px 14px 9px;
  text-align: center;
  animation: toastIn 0.42s cubic-bezier(.2,.9,.25,1.3) both;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-24px) scale(0.9); } to { opacity: 1; transform: none; } }
.t-title { font-family: var(--display); font-weight: 900; font-stretch: 80%; font-size: 1.05rem; color: var(--c4); text-transform: uppercase; }
.t-sub { font-size: 0.8rem; margin-top: 2px; color: #DDD; }
.toast.ach { background: var(--c4); color: var(--ink); border-color: var(--ink); box-shadow: 6px 6px 0 var(--ink); }
.toast.ach .t-title { color: var(--ink); font-size: 1.05rem; }
.toast.ach .t-sub { color: var(--ink); }
.toast.combo { background: var(--c1); border-color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.toast.combo .t-title, .toast.combo .t-sub { color: var(--ink); }
.pts {
  position: absolute;
  right: 10px; top: -22px;
  z-index: 3;
  font-family: var(--pixel);
  font-weight: 700;
  font-size: 1rem;
  color: var(--c4);
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 3px 3px 0 var(--ink);
  pointer-events: none;
}
.confetti { position: fixed; top: 38%; z-index: 69; pointer-events: none; }

/* ---------- Member rail ---------- */
.rail {
  grid-area: rail;
  border-right: var(--B);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  background: var(--paper);
}
.rail-head[hidden] { display: none; }
.rail-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: var(--b);
  font-weight: 900;
  font-stretch: 78%;
  font-size: 1rem;
  text-transform: uppercase;
  background: var(--paper);
}
.rail-head small {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--ink);
  color: var(--white);
  padding: 2px 6px;
}
.rail-list { overflow-y: auto; flex: 1; min-height: 0; }
.member {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 9px 14px 9px;
  border-bottom: var(--b);
  background: var(--white);
}
.avatar {
  width: 48px;
  height: 48px;
  border: var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  background: var(--accent, var(--white));
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-3deg);
}
.member:nth-child(odd) .avatar { transform: rotate(2.5deg); }
.member-text { min-width: 0; }
.member-name {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.02rem;
  line-height: 1.08;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.member-arch {
  margin-top: 3px;
  font-size: 0.8rem;
  line-height: 1.3;
  color: #3A3A3A;
}
.member-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 7px; }
.role {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  border: 2px solid var(--ink);
  padding: 1px 5px;
  background: var(--paper);
}
.member-status {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  text-transform: uppercase;
}
.member-status { padding: 1px 5px; border: 2px solid transparent; }
.member-status.typing { background: var(--c2); color: var(--white); border-color: var(--ink); }
.member-status.replied { background: var(--c3); border-color: var(--ink); }
.member-status.left { color: #8A8A8A; border: 2px dashed #8A8A8A; }
.member.you { background: var(--paper); }
.member.you .avatar { background: var(--ink); color: var(--white); font-weight: 800; font-size: 0.9rem; transform: none; }

/* ---------- Stream ---------- */
.stream {
  grid-area: stream;
  min-height: 0;
  contain: size;   /* its content must never stretch the sidebar rows */
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background-color: var(--paper);
  background-image: var(--halftone);
  background-size: 12px 12px;
}

/* Narration boxes (system messages) */
.sys {
  align-self: center;
  max-width: min(560px, 100%);
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1.4;
  text-transform: uppercase;
  text-align: center;
  background: var(--c4);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 10px;
}
.sys.err {
  align-self: stretch;
  max-width: none;
  text-align: left;
  background: var(--err);
  color: var(--white);
  display: flex;
  gap: 10px;
  align-items: center;
}
.sys.err::before {
  content: '!';
  flex-shrink: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--white);
  color: var(--err);
  border: 2px solid var(--ink);
  font-family: var(--display);
  font-weight: 800;
}
.day {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
}
.day { justify-content: center; }
.day span { background: var(--ink); color: var(--white); padding: 3px 10px; }

/* Squad change card */
.squad-card {
  align-self: center;
  width: min(520px, 100%);
  background: var(--white);
  border: var(--b);
  box-shadow: 5px 5px 0 var(--ink);
}
.sc-title {
  background: var(--ink);
  color: var(--white);
  padding: 8px 12px;
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  line-height: 1.1;
}
.sc-title small { display: block; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; color: var(--c4); margin-bottom: 3px; }
.sc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr); }
.sc-h {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 12px;
  background: var(--ink);
  color: var(--white);
}
.sc-h.mid { padding: 0; }
.sc-cell { padding: 8px 12px; border-top: 2px solid var(--ink); display: flex; align-items: stretch; }
.sc-arrow {
  border-top: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  background: var(--white); color: var(--ink);
  font-family: var(--mono); font-weight: 700; font-size: 1rem; line-height: 1;
}
.sc-chip {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1.15;
  border: 2.5px solid var(--ink);
  padding: 3px 8px 3px 3px;
  background: var(--accent, var(--white));
  color: var(--tag-ink, var(--ink));
}
.sc-chip .e { flex-shrink: 0; width: 28px; height: 28px; display: grid; place-items: center; background: var(--white); border: 2px solid var(--ink); font-size: 1rem; line-height: 1; text-align: center; }
.sc-chip .n { min-width: 0; }
.sc-cell.out .sc-chip { background: var(--white); color: #777; border-color: #9A9A9A; }
.sc-cell.out .sc-chip .e { border-color: #9A9A9A; }
.sc-cell.out .sc-chip .n { text-decoration: line-through; text-decoration-thickness: 2px; }
.sc-cell.out .sc-chip .e { filter: grayscale(1); opacity: 0.6; }

/* A question and its replies */
.round { display: flex; flex-direction: column; gap: 12px; }

/* Skip chip while replies are arriving */
.skip-chip {
  position: sticky;
  bottom: 0;
  align-self: center;
  z-index: 3;
  margin-top: auto;
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  background: var(--white);
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
}
.skip-chip:hover { background: var(--c4); }

/* Voice button: a square key docked to the right of each reply bubble */
.brow { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brow .bwrap { min-width: 0; }
.say {
  flex-shrink: 0;
  position: relative;
  width: 36px; height: 36px;
  padding: 0;
  display: grid; place-items: center;
  background: var(--white);
  color: var(--ink);
  border: var(--b);
  box-shadow: 3px 3px 0 var(--ink);
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.say-ico { width: 20px; height: 20px; display: block; }
.say-ico path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: square; }
.say-ico path:first-child, .say-ico rect { fill: currentColor; stroke: none; }
.msg.speaking .say-ico .w1 { animation: wave 0.6s steps(2) infinite; }
.msg.speaking .say-ico .w2 { animation: wave 0.6s 0.3s steps(2) infinite; }
@keyframes wave { 50% { opacity: 0.15; } }
/* loading: the button turns into a little stepping progress bar */
.msg.voice-loading .say { cursor: progress; }
.msg.voice-loading .say .say-ico { opacity: 0; }
.msg.voice-loading .say::before, .msg.voice-loading .say::after, .say .ld {
  content: '';
  position: absolute;
  top: 50%;
  width: 6px; height: 6px;
  margin-top: -3px;
  background: currentColor;
}
.msg.voice-loading .say::before { left: 8px; animation: ldot 0.9s steps(1) infinite; }
.msg.voice-loading .say::after { right: 8px; animation: ldot 0.9s 0.6s steps(1) infinite; }
.say .ld { display: none; left: 50%; margin-left: -3px; }
.msg.voice-loading .say .ld { display: block; animation: ldot 0.9s 0.3s steps(1) infinite; }
@keyframes ldot { 0% { transform: translateY(0); } 33% { transform: translateY(-5px); } 66% { transform: translateY(0); } }@keyframes loadbar { from { background-position: 0 0; } to { background-position: 150% 0; } }
.say:hover { background: var(--paper); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.say:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.msg.speaking .say, .msg.speaking .say:hover { background: var(--ink); color: var(--white); }
.msg.speaking .bubble { animation: none; }
.msg.speaking .msg-av { animation: talk 0.28s ease-in-out infinite alternate; }
@keyframes talk { from { transform: rotate(-4deg) scale(1); } to { transform: rotate(-2deg) scale(1.08); } }
.shot-row { gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.play-btn {
  background: var(--white);
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  min-height: 44px;
  padding: 0 18px;
  display: inline-flex; align-items: center; gap: 8px;
}

/* Messages */
.msg { display: flex; align-items: flex-start; gap: 12px; max-width: min(760px, 88%); }
.msg.me { align-self: flex-end; margin-right: 14px; max-width: min(620px, 80%); }
.msg.member-msg { align-self: flex-start; }
.msg-col { display: flex; flex-direction: column; min-width: 0; }
.msg.me .msg-col { align-items: flex-end; }

.msg-av {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  margin-top: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  background: var(--accent, var(--white));
  border: var(--b);
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-4deg);
}
.msg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 6px; }
.msg-tag {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.74rem;
  line-height: 1;
  text-transform: uppercase;
  background: var(--accent, var(--ink));
  color: var(--tag-ink, var(--white));
  border: 2.5px solid var(--ink);
  padding: 3px 7px 2px;
  transform: rotate(-1.5deg);
}
.msg-vibe { font-family: var(--mono); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #5A5A5A; }

.bubble {
  position: relative;
  border: var(--b);
  background: var(--white);
  padding: 8px 12px 7px;
  font-size: 0.92rem;
  line-height: 1.42;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.me .bubble { background: var(--ink); color: var(--white); }
/* Time (and ticks) tucked into the bubble's bottom-right corner, like a messaging app */
.btime {
  float: right;
  margin: 7px -2px -3px 14px;
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  line-height: 1;
  color: #777;
  white-space: nowrap;
}
.msg.me .btime { color: #AAA; }
.ticks { margin-left: 3px; letter-spacing: -3px; color: #AAA; }
.ticks.read { color: #4FC3F7; }
.ticks.fail { color: var(--c1); letter-spacing: 0; }

/* Comic speech-bubble tail */
.tail { position: absolute; top: 9px; left: -15px; width: 18px; height: 22px; overflow: visible; }
.tail path { fill: var(--white); stroke: var(--ink); stroke-width: 3; stroke-linejoin: miter; }
.msg.me .tail { left: auto; right: -15px; transform: scaleX(-1); }
.msg.me .tail path { fill: var(--ink); }

/* ---------- Composer ---------- */
/* Composer: its own section under the chat, like a messaging app */
.bar {
  grid-area: bar;
  border-top: var(--B);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "input send";
  align-items: stretch;
  gap: 14px;
  padding: 12px 16px 14px;
  background: var(--paper);
}
/* Randomize lives at the bottom of the sidebar */
.randbox {
  grid-area: rand;
  display: flex;
  border-top: var(--B);
  border-right: var(--B);
  padding: 12px 14px 14px;
  background: var(--paper);
}
.randbox .rand-btn { flex: 1; }
.bar > * { min-width: 0; }

.rand-btn, .send-btn {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.05rem;
  text-transform: uppercase;
  padding: 0 18px;
  min-height: 58px;
}
.rand-btn { background: var(--c3); }
.rand-btn .ico { display: inline-block; margin-right: 4px; }
.rand-btn .ico { display: inline-block; }
.rand-btn:not(:disabled):hover .ico { animation: dice 0.6s steps(4) infinite; }
@keyframes dice { to { transform: rotate(360deg); } }
.send-btn { grid-area: send; background: var(--c1); min-width: 112px; }

.input-wrap {
  grid-area: input;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--white);
  border: var(--b);
  box-shadow: 4px 4px 0 var(--sh);
  cursor: text;
  transition: box-shadow 120ms;
}
.input-wrap:focus-within { box-shadow: 4px 4px 0 var(--ink); }
.input {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-size: 1rem;
  line-height: 1.4;
  max-height: 140px;
  outline: none;
  padding: 6px 0;
}
.input::placeholder { color: #8A8A8A; }

/* ================================================================
   ANIMATION  (transform / opacity / clip-path only)
   ================================================================ */
/* Hard shadow lives on a wrapper so it can "grow" with a transform */
.bwrap { position: relative; }
.bwrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent, var(--ink));
  outline: 2.5px solid var(--ink);
  outline-offset: -2.5px;
  transform: translate(7px, 7px);
}
.msg.me .bwrap::before { background: var(--c4); }

/* Typing indicators */
.dots i { font-style: normal; animation: blink 0.9s steps(1) infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.15; } }
.bounce { display: inline-flex; gap: 6px; padding: 5px 2px; }
.bounce i { width: 9px; height: 9px; background: var(--ink); animation: bounce 0.9s ease-in-out infinite; }
.bounce i:nth-child(2) { animation-delay: 0.15s; }
.bounce i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }
.ghost .bubble { background: var(--paper); }
.ghost .bwrap::before { opacity: 0.35; }
.ghost .tail path { fill: var(--paper); }
.ghost .msg-tag { transform: none; }
.ghost-stack { display: flex; margin-top: 26px; }
.ghost-stack span {
  width: 34px; height: 34px; margin-left: -8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  background: var(--accent); border: var(--b);
}
.ghost-stack span:first-child { margin-left: 0; }

/* Boot: window drops in and settles */
.a-boot { animation: drop 560ms cubic-bezier(.2,.85,.25,1.05) both; }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(18px) scale(0.985); }
  100% { opacity: 1; transform: none; }
}

/* User bubble launches up from the input */
.a-launch { animation: launch 600ms cubic-bezier(.2,.9,.25,1.12) both; transform-origin: bottom right; }
@keyframes launch { from { opacity: 0; transform: translateY(48px) scale(0.96); } to { opacity: 1; transform: none; } }

/* Member bubble stamps in, shadow grows after */
.a-stamp { animation: stamp 560ms cubic-bezier(.2,.9,.25,1.12) both; transform-origin: 20px 40px; }
.a-stamp .bwrap::before { animation: shadowGrow 320ms 260ms cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes stamp { from { opacity: 0; transform: translateY(22px) scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes shadowGrow { from { transform: translate(0, 0); } to { transform: translate(7px, 7px); } }

.a-ghost, .a-sys { animation: fadeUp 220ms ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Rail cards on first load (randomize uses card flips in JS) */
.a-stamp-in { animation: railIn 420ms cubic-bezier(.2,.85,.25,1.1) both; }
@keyframes railIn {
  from { opacity: 0; transform: translateX(-16px) rotate(-1deg); }
  to   { opacity: 1; transform: none; }
}

/* Level change: dim, strike through, fold away, stub, collapse */
.msg.pending { opacity: 0.45; transition: opacity 0.2s; }
.a-unsend .bubble::after {
  content: '';
  position: absolute;
  left: 10px; right: 10px; top: 50%;
  height: 4px;
  background: var(--err);
  transform-origin: left;
  animation: strike 200ms cubic-bezier(.4,0,.2,1) both;
}
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.stub {
  margin-left: 56px;
  border: 3px dashed var(--ink);
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  font-style: italic;
  text-transform: uppercase;
  opacity: 0.65;
}

/* Reaction tags */
.react {
  position: absolute;
  bottom: -16px;
  right: 14px;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--white);
  border: 2.5px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 2px 7px;
  font-size: 0.95rem;
  line-height: 1.2;
  transform: rotate(-4deg);
}
.react small { font-size: 0.7rem; }
.msg:has(.react) { margin-bottom: 10px; }
.a-pop { animation: pop 260ms cubic-bezier(.2,.9,.3,1.5) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4) rotate(-14deg); } to { opacity: 1; transform: rotate(-4deg); } }

@media (prefers-reduced-motion: reduce) {
  .a-boot, .a-launch, .a-stamp, .a-stamp-in, .a-ghost, .a-sys, .a-pop { animation: fadeIn 180ms both !important; }
  .a-stamp .bwrap::before, .a-unsend .bubble::after, .dots i, .bounce i { animation: none !important; }
  .msg.speaking .msg-av, .msg.speaking .say { animation: none; }
}

/* ================================================================
   STORY EXPORT
   ================================================================ */
.shot-row { display: flex; justify-content: center; padding: 6px 0 4px; }
.shot-row { padding-top: 6px; }
.shot-btn {
  background: var(--c4);
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  min-height: 44px;
  padding: 0 18px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.shot-btn .ico { font-size: 1.3rem; }
.a-slam { animation: slamBtn 380ms cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes slamBtn {
  0%   { opacity: 0; transform: scale(1.7) rotate(-5deg); }
  65%  { opacity: 1; transform: scale(0.95) rotate(1deg); }
  100% { opacity: 1; transform: none; }
}

.viewfinder {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  border: 4px solid var(--ink);
  outline: 3px solid var(--white);
  outline-offset: -10px;
  animation: viewfinder 240ms ease-out both;
}
@keyframes viewfinder {
  0%   { opacity: 0; transform: scale(1.05); background: rgba(255,255,255,0); }
  35%  { opacity: 1; transform: scale(1); background: rgba(255,255,255,0.85); }
  100% { opacity: 1; transform: scale(1); background: rgba(255,255,255,0); }
}

.story-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;   /* above toasts */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.story-overlay[hidden] { display: none; }
.story-backdrop { position: absolute; inset: 0; background-color: rgba(242, 240, 233, 0.94); background-image: var(--halftone); background-size: 12px 12px; }
.story-card {
  position: relative;
  background: var(--paper);
  border: var(--B);
  box-shadow: 10px 10px 0 var(--ink);
  transform-origin: center;
  overflow: hidden;
}
.story-img { display: block; width: 100%; height: 100%; }
.story-img[hidden], .story-loading[hidden] { display: none; }
.story-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.story-actions { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
/* 4. same chunky buttons as the rest of the site */
.story-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.story-btns .kbtn {
  min-height: 50px;
  padding: 0 20px;
  font-family: var(--display);
  font-weight: 900;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  word-spacing: 0.1em;
}
.story-dl { background: var(--c3); }
.story-share { background: var(--c4); }
.story-back { background: var(--white); }
.story-status { color: var(--ink); font-family: var(--mono); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; min-height: 1.2em; text-align: center; }

/* Off-screen 1080x1920 story: a phone screenshot of the chat in the current UI.
   Kept to CSS that html2canvas draws reliably: no font-stretch, outline, SVG,
   or box-shadow on rotated boxes. */
.sx {
  position: fixed;
  left: -100000px;
  top: 0;
  width: 1080px;
  height: 1920px;
  display: flex;
  flex-direction: column;
  background: #F2F0E9;
  color: #000;
  font-family: var(--text);
  overflow: hidden;
}
/* status bar: time on the left; signal + battery drawn as plain boxes on the right */
.sx-status {
  flex-shrink: 0;
  height: 100px;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 64px 0;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 36px;
}
.sx-sys { display: flex; align-items: center; gap: 26px; }
.sx-signal { display: flex; align-items: flex-end; gap: 6px; height: 30px; }
.sx-signal i { display: block; width: 9px; background: #fff; }
.sx-signal i:nth-child(1) { height: 9px; }
.sx-signal i:nth-child(2) { height: 16px; }
.sx-signal i:nth-child(3) { height: 23px; }
.sx-signal i:nth-child(4) { height: 30px; }
.sx-batt { display: flex; align-items: center; gap: 12px; color: #FF3B00; }
.sx-cell { position: relative; width: 62px; height: 30px; border: 4px solid #fff; }
.sx-cell::after { content: ''; position: absolute; right: -11px; top: 7px; width: 6px; height: 9px; background: #fff; }
.sx-cell b { position: absolute; left: 3px; top: 3px; bottom: 3px; width: 6px; background: #FF3B00; }

/* chat header: same as the site header, with the app name stamped on */
.sx-head {
  flex-shrink: 0;
  background: #000;
  color: #fff;
  padding: 26px 64px 34px;
  border-bottom: 8px solid #000;
}
.sx-brand {
  display: inline-block;
  background: #FFD600;
  color: #000;
  font-family: var(--display);
  font-weight: 900;
  font-size: 26px;
  text-transform: uppercase;
  padding: 6px 14px 5px;
  margin-bottom: 18px;
}
.sx-name { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; text-transform: uppercase; letter-spacing: -1px; word-spacing: 6px; }
.sx-sub { display: flex; gap: 26px; align-items: baseline; margin-top: 16px; font-size: 26px; color: #CFCFCF; }
.sx-members { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sx-lvl { flex-shrink: 0; font-family: var(--mono); font-weight: 700; font-size: 24px; text-transform: uppercase; color: var(--lvl); }

/* chat: paper with halftone dots, like the site */
.sx-chat {
  --fs: 40px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 34px;
  padding: 40px 64px 40px 52px;
  border-top: 8px solid #000;
  background-color: #F2F0E9;
}
.sx-day { align-self: center; background: #000; color: #fff; font-family: var(--mono); font-weight: 700; font-size: 24px; text-transform: uppercase; padding: 6px 18px; }

.sx-msg { display: flex; align-items: flex-start; gap: 34px; max-width: 94%; }
.sx-me { align-self: flex-end; max-width: 84%; margin-right: 26px; }
.sx-av {
  flex-shrink: 0;
  width: 80px; height: 80px;
  margin-top: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  background: var(--accent);
  border: 6px solid #000;
  transform: rotate(-4deg);
}
.sx-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.sx-tag {
  font-family: var(--display);
  font-weight: 900;
  font-size: calc(var(--fs) * 0.62);
  line-height: 1;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--tag-ink);
  border: 5px solid #000;
  padding: 9px 14px 7px;
  margin-bottom: 16px;
  transform: rotate(-1.5deg);
}
.sx-bub {
  position: relative;
  background: #fff;
  border: 6px solid #000;
  box-shadow: 14px 14px 0 var(--accent);
  padding: 22px 28px 18px;
  font-size: var(--fs);
  line-height: 1.34;
  font-weight: 500;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.sx-me .sx-bub { background: #000; color: #fff; box-shadow: 14px 14px 0 #FFD600; font-weight: 600; }
.sx-time { float: right; margin: 18px -4px -6px 22px; font-family: var(--mono); font-weight: 700; font-size: 22px; line-height: 1; color: #777; }
.sx-me .sx-time { color: #AAA; }
.sx-ticks { color: #4FC3F7; margin-left: 6px; letter-spacing: -6px; }
/* tail: a pre-drawn triangle image overlapping the bubble's border */
.sx-tail { position: absolute; left: -40px; top: 20px; width: 46px; height: 52px; }
.sx-me .sx-tail { left: auto; right: -40px; transform: scaleX(-1); }
.sx-react {
  position: absolute;
  left: 28px; bottom: -34px;
  background: #fff;
  border: 5px solid #000;
  padding: 4px 14px;
  font-size: 34px;
  line-height: 1.2;
  transform: rotate(-4deg);
}

/* composer: the black band from the site, carrying the call to action */
.sx-compose {
  flex-shrink: 0;
  position: relative;
  display: flex;
  gap: 24px;
  align-items: stretch;
  padding: 30px 56px 150px;   /* bottom stays clear of Instagram's reply bar */
  background: #fff;
  border-top: 8px solid #000;
}
.sx-input {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 20px;
  background: #fff;
  border: 6px solid #000;
  box-shadow: 10px 10px 0 #000;
  padding: 16px 26px;
}
.sx-prompt { flex-shrink: 0; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: #000; color: #FFD600; font-family: var(--mono); font-weight: 700; font-size: 30px; }
.sx-cta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sx-cta small { font-family: var(--mono); font-weight: 700; font-size: 22px; text-transform: uppercase; color: #777; }
.sx-cta b { font-family: var(--display); font-weight: 900; font-size: 34px; }
.sx-send {
  display: flex; align-items: center; justify-content: center;
  padding: 0 34px;
  background: #FF3B00;
  border: 6px solid #000;
  box-shadow: 10px 10px 0 #000;
  font-family: var(--display);
  font-weight: 900;
  font-size: 36px;
  text-transform: uppercase;
}
.sx-home { position: absolute; left: 50%; bottom: 46px; width: 300px; height: 10px; margin-left: -150px; background: #000; }


@media (prefers-reduced-motion: reduce) {
  .a-slam { animation: fadeIn 180ms both !important; }
}

/* ================================================================
   MOBILE
   ================================================================ */
@media (max-width: 1100px) {
  .head-avatars { display: none; }
}
@media (max-width: 720px) {
  body { background: var(--paper); }
  .app {
    inset: 0;

             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    grid-template-columns: auto minmax(0, 1fr);

  .randbox { border-right: none; border-top: var(--B); padding: 10px 0 12px 10px; background: var(--paper); }

  .head-sub { font-size: 0.68rem; margin-top: 4px; }

  .rail { border-right: none; border-bottom: var(--b); }

  .member {
    grid-template-columns: 38px minmax(0, 1fr);

  .avatar { width: 38px; height: 38px; font-size: 1.2rem; box-shadow: 2px 2px 0 var(--ink); }

  .member-foot { margin-top: 3px; }

  .stream { padding: 16px 12px 20px; }
  .msg { max-width: 94%; gap: 9px; }
  .msg-av { width: 30px; height: 30px; font-size: 0.95rem; margin-top: 20px; }
  .ghost-stack span { width: 28px; height: 28px; font-size: 0.85rem; }
  .stub { margin-left: 43px; }
  .bubble { font-size: 0.9rem; padding: 8px 11px 7px; }
  .say { width: 32px; height: 32px; }
  .say-ico { width: 17px; height: 17px; }
  .msg-vibe { display: none; }
  .play-btn, .shot-btn { font-size: 0.78rem; padding: 0 12px; min-height: 40px; gap: 6px; }
  .shot-btn .ico { font-size: 1rem; }

  .bar { gap: 10px; padding: 10px 10px 12px; border-top: var(--B); }

}

@media (prefers-reduced-motion: reduce) {
  .kbtn { transition: none; }
  * { scroll-behavior: auto !important; }
}

<body>

<div class="app" id="app">

  <!-- SIDEBAR TOP: APP NAME -->
  <div class="brand"><span class="ico" aria-hidden="true">🏛️</span><span>The Council<small>Group chats with legends</small></span></div>

  <!-- CHAT HEADER -->
  <header class="titlebar">

// Generated squad names for non-curated picks
const SQUAD_BODIES = ['Board', 'Committee', 'Ministry', 'Supreme Court', 'Cabinet', 'Tribunal',
  'Syndicate', 'Panel', 'Union', 'Department', 'Council Within The Council', 'Emergency Meeting'];
const SQUAD_OF = ['Bad Decisions', 'Unsolicited Advice', 'Emotional Damage', 'Questionable Ethics',
  'Midnight Thoughts', 'Zero Accountability', 'Overthinking', 'Main Character Energy', 'Delulu Affairs',
  'Unpaid Opinions', 'Mild Chaos', 'Things We Should Not Say', 'Avoidable Problems', 'Group Project Trauma'];

const ROSTER_BY_NAME = new Map(ROSTER.map(p => [p.name, p]));
const VALID_SQUADS = CHAOS_SQUADS.filter(sq => {
  const missing = sq.members.filter(n => !ROSTER_BY_NAME.has(n));
  if (missing.length) console.warn('Chaos squad skipped, unknown members:', sq.title, missing);
  return !missing.length;
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

function generateSquadName(prevName) {
  let name;
  do { name = `The ${pickOne(SQUAD_BODIES)} of ${pickOne(SQUAD_OF)}`; } while (name === prevName);
  return name;
}

// Rules: 4 different roles, at least one SAGE/WHOLESOME and one
// MENACE/UNHINGED_OBJECT, no member carried over from the previous squad.
function pickContrastSquad(prevNames) {
  const anchor = pickOne(['SAGE', 'WHOLESOME']);
  const chaos  = pickOne(['MENACE', 'UNHINGED_OBJECT']);
  const rest   = shuffle(ROLES.filter(r => r !== anchor && r !== chaos)).slice(0, 2);
  const roles  = shuffle([anchor, chaos, ...rest]);
  return roles.map(role => {
    const pool = ROSTER.filter(p => p.role === role && !prevNames.has(p.name));
    return pickOne(pool.length ? pool : ROSTER.filter(p => p.role === role));
  });
}

function pickSquad(prevMembers, prevTitle) {
  const prevNames = new Set(prevMembers.map(p => p.name));
  if (Math.random() < CHAOS_CHANCE) {
    const options = VALID_SQUADS.filter(sq =>
      sq.title !== prevTitle && !sq.members.some(n => prevNames.has(n)));
    if (options.length) {
      const sq = pickOne(options);
      return { title: sq.title, members: shuffle(sq.members.map(n => ROSTER_BY_NAME.get(n))) };
    }
  }
  return { title: generateSquadName(prevTitle), members: pickContrastSquad(prevNames) };
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function fetchCouncil(question) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, personalities: state.members, quirk_level: state.level }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Error ${res.status}`);
  }
  const data = await res.json();
  if (!Array.isArray(data.members)) throw new Error('The council returned an empty reply. Send again.');
  return data.members;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

// Durations in ms; keep in sync with the CSS keyframes
const T = {
  boot: 560,       // window drop
  stampGap: 110,   // stagger between rail cards on first load
  flipOut: 190,    // randomize: card turns away
  flipIn: 420,     // randomize: new card turns in
  flipGap: 65,     // stagger between flipping cards
  unsendGap: 90,
  stubHold: 650,   // how long "deleted" stubs stay
  collapse: 280,
  debounce: 900,   // level change -> re-summon
};

// Each reply waits 700-1600ms, scaled by its length, slightly randomised
function typingTime(text) {
  const len = String(text || '').length;
  return Math.round(Math.min(1500, Math.max(850, 700 + len * 4 + rand(-100, 160))));
}
// Time to read a reply before the next member starts typing (~27 ms per character)
function readTime(text) {
  const len = String(text || '').length;
  return Math.round(Math.min(3900, Math.max(1300, 500 + len * 27)));
}
// A wait that ends early (but not instantly) when the user taps "skip"
async function pace(ms) {
  const end = performance.now() + ms;
  while (performance.now() < end) {
    if (state.skip) { await wait(140); return; }
    await wait(50);
  }
}

async function typeOut(el, text) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    await wait(ch === ' ' ? 10 : 24);
  }
}

// ---------- Reactions (client-side decoration only) ----------
const REACTIONS = ['💀', '😭', '🤡', '🔥', '😤', '🙏', '🫠', '👀'];

async function dropReactions(round) {
  const n = round.memberEls.length;
  if (n < 2) return;
  const count = Math.random() < 0.5 ? 1 : 2;
  const used = new Set();
  for (let k = 0; k < count; k++) {
    await wait(rand(350, 750));
    let from, to, tries = 0;
    do {
      from = Math.floor(Math.random() * n);
      to = Math.floor(Math.random() * n);
    } while ((from === to || used.has(to)) && ++tries < 30);
    if (from === to || used.has(to)) return;
    used.add(to);
    const reactor = round.members[from];
    const emoji = pickOne(REACTIONS);
    (round.reactions ||= []).push({ to, emoji, by: reactor.emoji });
    const tag = document.createElement('span');
    tag.className = 'react a-pop';
    tag.title = `${reactor.name} reacted`;
    tag.innerHTML = `${emoji}<small>${escHtml(reactor.emoji)}</small>`;
    round.memberEls[to].querySelector('.bwrap')?.appendChild(tag);
    playSfx('boing');
  }
}

// ---------- Unsend (level change) ----------
// Collapse an element's height smoothly so nothing below it jumps
async function collapseAway(el) {
  if (REDUCED) { el.remove(); return; }
  const h = el.offsetHeight;
  el.style.overflow = 'hidden';
  await el.animate(
    [{ height: `${h}px`, opacity: 1, marginBottom: '0px' }, { height: '0px', opacity: 0, marginBottom: '-16px' }],
    { duration: T.collapse, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished;
  el.remove();
}

async function unsendAll(msgEls) {
  playSfx('scratch');
  await Promise.all(msgEls.map(async (el, i) => {
    await wait(i * T.unsendGap);
    el.classList.remove('pending', 'a-stamp');
    el.classList.add('a-unsend');                 // red strike draws across
    await wait(240);
    if (!REDUCED) {
      await el.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-10px) rotate(-1.5deg) scale(0.97)' }],
        { duration: 220, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished;
    }
    el.getAnimations().forEach(a => a.cancel());
    el.className = 'msg member-msg deleted';
    el.innerHTML = '<div class="stub">⌫ This message was deleted</div>';
    el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'ease-out' });
    await wait(T.stubHold);
    await collapseAway(el);
  }));
}

function renderLevels() {}
function syncLevels() {}

function setLevel(v) {
  if (state.busy || v === state.level) return;
  playSfx(`lvl${v}`);
  stopVoice();
  state.level = v;
  syncLevels();
  applyIntensity(v);

  const round = state.round;
  if (!round || !round.memberEls.length || !round.userEl.isConnected) return;

  // Debounced re-summon: replies dim while the user is still picking
  clearTimeout(state.resummonTimer);
  round.memberEls.forEach(el => el.classList.add('pending'));
  state.resummonTimer = setTimeout(() => resummon(round), T.debounce);
}

function cancelResummon() {
  clearTimeout(state.resummonTimer);
  state.resummonTimer = null;
  state.round?.memberEls.forEach(el => el.classList.remove('pending'));
}

async function resummon(round) {
  state.resummonTimer = null;
  if (state.busy || state.round !== round) return;
  setBusy(true);
  removeShotButton();
  await unsendAll(round.memberEls);
  round.memberEls = [];
  await runCouncil(round.question, round.userEl);
}

// ================================================================
//  ACTIONS
// ================================================================
function setBusy(on) {
  state.busy = on;
  els.send.disabled = on;
  els.rand.disabled = on;
}

async function runCouncil(question, userEl) {
  setBusy(true);
  removeShotButton();
  const roundEl = userEl.parentElement;
  unfitRound(roundEl);
  setAllStatus('typing');
  const groupGhost = appendToStream(makeGhost(null), roundEl);
  setReceipt(userEl, 'Delivered');

  let members;
  try {
    members = await fetchCouncil(question);
  } catch (err) {
    groupGhost.remove();
    setAllStatus('idle');
    setReceipt(userEl, 'Not delivered');
    postSystem(err.message || 'Request failed. Send again.', true, { into: roundEl });
    playSfx('sad');
    setBusy(false);
    return;
  }

  setReceipt(userEl, `Read by ${members.length}`);
  setAllStatus('idle');

  const round = {
    question, userEl, members, memberEls: [],
    level: state.level, squadTitle: state.squadTitle,
    slots: members.map((m, i) => slotFor(m, i)),
    story: null,               // cached PNG blob
  };
  state.round = round;

  // Sequential reveal: each member types, their bubble lands, then you get time to read it
  state.skip = false;
  const skipBtn = members.length > 1 ? showSkip() : null;
  for (let i = 0; i < members.length; i++) {
    const m = members[i];
    const slot = slotFor(m, i);
    setStatus(slot, 'typing');
    const ghost = makeGhost(slot, m);
    if (i === 0) groupGhost.replaceWith(ghost);
    else roundEl.appendChild(ghost);
    scrollToBottom();
    await pace(typingTime(m.response));
    const msgEl = makeMember(m, slot);
    ghost.replaceWith(msgEl);
    playSting(m.name);
    gameReply(msgEl, slot);
    scrollToBottom();
    round.memberEls.push(msgEl);
    setStatus(slot, 'replied');
    if (i < members.length - 1) await pace(readTime(m.response));
  }
  skipBtn?.remove();
  if (!members.length) groupGhost.remove();

  const missing = state.members.length - members.length;
  if (missing > 0) {
    state.members.forEach((p, i) => {
      if (!members.some(m => m.name === p.name)) setStatus(i, 'left');
    });
    postSystem(`${missing} member${missing > 1 ? 's' : ''} left you on read`, false, { into: roundEl });
  }

  await dropReactions(round);
  gameRound(round);
  setBusy(false);
  if (members.length) showShotButton(roundEl);
  await wait(REDUCED ? 0 : 500);
  fitRound(roundEl);
}

// "Skip" chip, pinned to the bottom of the chat while replies are coming in
function showSkip() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'skip-chip a-sys';
  b.textContent = 'Reading too slow? Skip ⏩';
  b.addEventListener('click', () => { state.skip = true; playSfx('zip'); b.remove(); });
  els.stream.appendChild(b);
  return b;
}

// ---------- finished round: scroll so your question sits at the top ----------
// No shrinking: messages are already compact, so a full round normally fits as-is.
function unfitRound() {}
async function fitRound(el) {
  if (!el?.isConnected) return;
  const top = el.getBoundingClientRect().top - els.stream.getBoundingClientRect().top + els.stream.scrollTop - 12;
  const bottomGap = els.stream.scrollHeight - (top + els.stream.clientHeight);
  // only scroll up to the question if that still leaves the newest reply in view
  if (el.getBoundingClientRect().height <= els.stream.clientHeight - 24 || bottomGap < 0) {
    els.stream.scrollTo({ top: Math.min(top, els.stream.scrollHeight), behavior: REDUCED ? 'auto' : 'smooth' });
  }
}

async function send() {
  if (state.busy) return;
  const question = els.input.value.trim();
  if (!question) { postSystem('Type a message before sending.', true); els.input.focus(); return; }

  cancelResummon();
  stopVoice();
  startMusicFor(question).then(() => playSfx('send'));   // must stay before any await: audio needs the user gesture

  els.input.value = '';
  autosize();

  const userEl = postUser(question, newRound());
  await runCouncil(question, userEl);
  els.input.focus();
}

// Swap the header title with a quick slide (old text up and out, new text up and in)
async function swapTitle(text) {
  if (REDUCED || !els.squad.textContent) { els.squad.textContent = text; return; }
  await els.squad.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-70%)', opacity: 0 }],
    { duration: 160, easing: 'ease-in', fill: 'forwards' }).finished;

async function randomize(announce = true) {
  if (state.busy) return;
  if (announce) sound('dice');
  stopVoice();
  const prev = state.members;
  const squad = pickSquad(prev, state.squadTitle);
  cancelResummon();
  state.round = null;          // a new squad shouldn't rewrite the old squad's replies
  removeShotButton();
  state.members = squad.members;
  state.squadTitle = squad.title;

  if (!announce || !prev.length) {
    els.squad.textContent = squad.title;
    renderRail(true, announce ? 0 : T.boot - 150);
    return;
  }

  setBusy(true);
  swapTitle(squad.title);
  await slotRail(prev, state.members);   // every member card spins like a slot reel, stopping one by one
  renderRail(false);
  playSfx('slide', true);
  postSquadChange(prev, state.members, squad.title);
  gameRandomized(state.members);
  setBusy(false);
}

// Slot machine: each card becomes a reel of random faces that drops downward with motion blur,
// kicks up first (anticipation), then stops with a bounce. Reels stop one after another.
async function slotRail(prev, next) {
  if (REDUCED) return;
  const cards = [...els.rail.querySelectorAll('.member')];
  const face = (p, i) => `<div class="slot-face" style="--accent:${ACCENTS[i % ACCENTS.length].bg}">
      <div class="avatar" aria-hidden="true">${escHtml(p.emoji)}</div><div class="member-name">${escHtml(p.name)}</div></div>`;
  playSfx('lever');
  await Promise.all(cards.map(async (card, i) => {
    if (!next[i]) return;
    const h = card.offsetHeight;
    const filler = shuffle(ROSTER.filter(p => p !== next[i] && p !== prev[i])).slice(0, 14);
    // final face on top, old face at the bottom: the strip slides DOWN like a real reel
    const faces = [next[i], ...filler, prev[i] || filler[0]];
    card.classList.add('slotting');
    card.style.height = `${h}px`;
    card.innerHTML = `<div class="slot-strip" style="--h:${h}px">${faces.map(p => face(p, i)).join('')}</div><i class="slot-glass" aria-hidden="true"></i>`;
    const strip = card.firstElementChild;
    const dist = (faces.length - 1) * h;
    const dur = 1150 + i * 330;
    const spin = strip.animate([
      { transform: `translateY(${-dist}px)` },
      { transform: `translateY(${-dist - 14}px)`, offset: 0.06 },      // kick up
      { transform: `translateY(${10}px)`, offset: 0.9 },               // overshoot past the face
      { transform: 'translateY(-4px)', offset: 0.96 },
      { transform: 'translateY(0)' },
    ], { duration: dur, easing: 'cubic-bezier(.3,.1,.2,1)', fill: 'forwards' });
    strip.animate([
      { filter: 'blur(0)' }, { filter: 'blur(0)', offset: 0.08 }, { filter: 'blur(2.5px)', offset: 0.2 },
      { filter: 'blur(2.5px)', offset: 0.62 }, { filter: 'blur(0)', offset: 0.85 }, { filter: 'blur(0)' },
    ], { duration: dur });
    let last = -1;
    const watch = () => {
      if (spin.playState !== 'running') return;
      const idx = Math.floor(-new DOMMatrix(getComputedStyle(strip).transform).m42 / h);
      if (idx !== last) { last = idx; if (i === 0 || idx % 2 === 0) playSfx('tick'); }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
    await spin.finished;
    playSfx('thunk');
    strip.firstElementChild.querySelector('.avatar').animate(
      [{ transform: 'scale(1.25) rotate(-6deg)' }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1.4)' });
  }));
  await wait(260);
}

  career:   /\b(job|jobs|work|boss|salary|career|office|resign|resignation|quit|promotion|interview|fired|layoff|laid off|workplace|coworker|colleague|manager|hr|hire|hiring|startup|business|freelance|internship|intern|appraisal|increment|hustle|naukri|naukari|kaam|placement|placements|package|ctc|notice period|linkedin|corporate|wfh)\b/,
};

const HF_TO_MOOD = {
  joy: 'playful', sadness: 'sad', anger: 'anxious', fear: 'anxious',
  disgust: 'chaotic', surprise: 'philosophical', neutral: 'neutral',
};

async function classifyMood(text) {
  const t = text.toLowerCase();
  for (const mood of MOOD_ORDER) {
    if (MOOD_KEYWORDS[mood].test(t)) return mood;
  }
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emotion_text: text }),
    });
    const data = await res.json();
    return HF_TO_MOOD[data.emotion] ?? 'neutral';
  } catch {
    return 'neutral';
  }
}

const FADE_OUT = 0.45;  // seconds; crossfade = fade music bus out, swap, fade in
const FADE_IN = 0.9;

const music = {
  enabled: true,        // the sound toggle (music + effects)
  mood: null,           // mood currently built
  wanted: null,         // latest mood asked for (played when sound turns on)
  playing: false,
  token: 0,             // cancels stale crossfades
  master: null, comp: null, limiter: null, sfxBus: null,
  parts: [], nodes: [], fx: null,
};

// ---------- instrument helpers ----------
const track = node => { music.nodes.push(node); return node; };
const syn   = (opts, out) => track(new Tone.Synth(opts).connect(out));
const mono  = (opts, out) => track(new Tone.MonoSynth(opts).connect(out));
const poly  = (opts, out) => track(new Tone.PolySynth(Tone.Synth, opts).connect(out));
const keys  = (vol, out) => track(new Tone.PolySynth(Tone.FMSynth, {
  harmonicity: 3, modulationIndex: 1.6,
  oscillator: { type: 'sine' }, modulation: { type: 'sine' },
  envelope: { attack: 0.005, decay: 1.4, sustain: 0.25, release: 1.2 },
  modulationEnvelope: { attack: 0.005, decay: 0.4, sustain: 0.1, release: 0.5 },
  volume: vol,
}).connect(out));
// Plucked strings (harp, sitar, pizzicato, upright bass) built from a filtered
// saw/triangle with a fast filter decay. Tone's PluckSynth needs an AudioWorklet,
// which some browsers refuse to load, so we avoid it.
const pluck = (vol, out, bright = 3800, wave = 'sawtooth') => mono({
  oscillator: { type: wave },
  filter: { type: 'lowpass', Q: 2, rolloff: -24 },
  envelope: { attack: 0.002, decay: 0.45, sustain: 0, release: 0.25 },
  filterEnvelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.2, baseFrequency: Math.max(120, bright / 8), octaves: 3 },
  volume: vol,
}, out);
const lowpass = (freq, out, q = 1) => track(new Tone.Filter({ frequency: freq, type: 'lowpass', Q: q }).connect(out));
const membrane = (opts, out) => track(new Tone.MembraneSynth(opts).connect(out));

// events: [time, note(s), duration?, velocity?]
function loopPart(synth, events, loopEnd, dur) {
  const p = new Tone.Part((t, e) => synth.triggerAttackRelease(e.n, e.d || dur, t, e.v ?? 1),
    events.map(([time, n, d, v]) => ({ time, n, d, v })));
  p.loop = true; p.loopEnd = loopEnd; p.start(0);
  music.parts.push(p);
}
// events: [time, anything] -> fn(t, value)
function loopFn(fn, events, loopEnd) {
  const p = new Tone.Part((t, e) => fn(t, e.v), events.map(([time, v]) => ({ time, v })));
  p.loop = true; p.loopEnd = loopEnd; p.start(0);
  music.parts.push(p);
}
// notes: flat array of single notes, null = rest
function stepSeq(synth, notes, sub, dur, vel = 1) {
  const s = new Tone.Sequence((t, n) => { if (n) synth.triggerAttackRelease(n, dur, t, vel); }, notes, sub);
  s.start(0);
  music.parts.push(s);
}

function drumKit(out, vol = {}) {
  const kick = membrane({ pitchDecay: 0.035, octaves: 5, envelope: { attack: 0.001, decay: 0.32, sustain: 0 }, volume: vol.kick ?? -10 }, out);
  const snareF = track(new Tone.Filter(1800, 'highpass').connect(out));
  const snare = track(new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: vol.snareDecay ?? 0.14, sustain: 0 }, volume: vol.snare ?? -20 }).connect(snareF));
  const hatF = track(new Tone.Filter(8000, 'highpass').connect(out));
  const hat = track(new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.03, sustain: 0 }, volume: vol.hat ?? -28 }).connect(hatF));
  return { kick, snare, hat };
}
// 16-step patterns per bar; 'x' = hit, 'o' = soft hit
function drumPattern(kit, pat) {
  const s = new Tone.Sequence((t, i) => {
    const v = c => (c === 'x' ? 1 : c === 'o' ? 0.45 : 0);
    if (v(pat.kick?.[i]))  kit.kick.triggerAttackRelease(pat.kickNote || 'C1', '8n', t, v(pat.kick[i]));
    if (v(pat.snare?.[i])) kit.snare.triggerAttackRelease('16n', t, v(pat.snare[i]));
    if (v(pat.hat?.[i]))   kit.hat.triggerAttackRelease('32n', t, v(pat.hat[i]));
  }, [...Array(16).keys()], '16n');
  s.start(0);
  music.parts.push(s);
}

// ---------- engine ----------
function ensureMaster() {
  if (music.master) return;
  music.limiter = new Tone.Limiter(-1).toDestination();
  music.comp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).connect(music.limiter);
  music.master = new Tone.Gain(0).connect(music.comp);      // music crossfades here
  music.sfxBus = new Tone.Gain(0.9).connect(music.limiter); // effects skip the compressor
  music.analyser = new Tone.Analyser('fft', 32);
  music.analyser.smoothing = 0.6;
  music.master.connect(music.analyser);
}

function cleanupMusic() {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  Tone.Transport.swing = 0;
  music.parts.forEach(p => { try { p.dispose(); } catch {} });
  music.nodes.forEach(n => { try { n.dispose(); } catch {} });
  music.parts = []; music.nodes = []; music.fx = null;
  music.playing = false;
}

// Level 1 -> base tempo, level 5 -> +15%. Grit on the lead line at 4-5.
function applyIntensity(level, ramp = 1) {
  if (!music.fx || !music.mood) return;
  const t = Math.max(ramp, 0.01);
  Tone.Transport.bpm.rampTo(MOODS[music.mood].bpm * (1 + 0.15 * (level - 1) / 4), t);
  music.fx.dist.wet.rampTo(level >= 5 ? 0.5 : level === 4 ? 0.25 : 0, t);
  music.fx.crunch.wet.rampTo(level >= 5 ? 0.3 : level === 4 ? 0.12 : 0, t);
}

const moodGain = mood => MOODS[mood]?.gain ?? 0.9;

async function playMood(mood) {
  if (!window.Tone || !MOODS[mood]) return;
  const token = ++music.token;
  ensureMaster();

  if (music.playing) {
    music.master.gain.rampTo(0, FADE_OUT);
    await wait(FADE_OUT * 1000);
    if (token !== music.token) return;
  }
  cleanupMusic();
  music.master.gain.cancelScheduledValues(Tone.now());
  music.master.gain.value = 0;

  const bus = track(new Tone.Gain(1).connect(music.master));
  const reverb = track(new Tone.Reverb({ decay: 3, wet: 0.3 }).connect(bus));
  await reverb.ready;
  if (token !== music.token) return;
  const delay = track(new Tone.FeedbackDelay('8n.', 0.25).connect(reverb));
  delay.wet.value = 0.35;
  const dist = track(new Tone.Distortion(0.6));
  const crunch = track(new Tone.Chebyshev(20));
  dist.wet.value = 0; crunch.wet.value = 0;
  const lead = track(new Tone.Gain(1));
  lead.chain(dist, crunch, reverb);

  music.mood = mood;
  if (mood === 'desi') unlock('desi');
  music.fx = { dist, crunch };
  MOODS[mood].build({ bus, reverb, delay, lead });
  Tone.Transport.bpm.value = MOODS[mood].bpm;
  applyIntensity(state.level, 0);

  Tone.Transport.start('+0.05');
  music.playing = true;
  music.master.gain.rampTo(moodGain(mood), FADE_IN);
  updateMusicUI();
}

const SFX = {
  // message sent: whoosh up
  send(t) {
    sfx.whooshF.frequency.setValueAtTime(350, t);
    sfx.whooshF.frequency.exponentialRampToValueAtTime(3800, t + 0.3);
    sfx.whoosh.triggerAttackRelease(0.3, t);
  },
  // reply arrived: bloop, pitch per member slot
  pop(t, slot = 0) {
    const f = [523, 659, 784, 988][slot % 4];
    sfx.pop.triggerAttack(f, t);
    sfx.pop.frequency.exponentialRampToValueAtTime(f * 1.6, t + 0.07);
    sfx.pop.triggerRelease(t + 0.1);
  },
  // reaction sticker: boing
  boing(t) {
    sfx.boing.frequency.cancelScheduledValues(t);
    sfx.boing.triggerAttack(220, t);
    sfx.boing.frequency.setValueCurveAtTime([220, 560, 330, 480, 370, 440, 400], t + 0.005, 0.4);
    sfx.boing.triggerRelease(t + 0.42);
  },
  // level up / down: slide whistle
  slide(t, up = true) {
    const [a, b] = up ? [480, 1500] : [1500, 480];
    sfx.whistle.triggerAttack(a, t);
    sfx.whistle.frequency.exponentialRampToValueAtTime(b, t + 0.3);
    sfx.whistle.triggerRelease(t + 0.32);
  },
  // chaos machine: reel tick, end-stop thunk, lever ratchet, landing ding
  tick(t) { sfx.click.triggerAttackRelease(0.008, t, 0.35); },
  thunk(t) { sfx.boing.triggerAttack(110, t); sfx.boing.frequency.exponentialRampToValueAtTime(70, t + 0.08); sfx.boing.triggerRelease(t + 0.1); },

  coin(t) { sfx.sweep.frequency.cancelScheduledValues(t); sfx.sweep.triggerAttackRelease(988, 0.06, t); sfx.sweep.triggerAttackRelease(1319, 0.18, t + 0.07); },

};

// From a click handler: unlock audio first, then play
function sound(name, ...args) { unlockAudio().then(() => playSfx(name, ...args)); }

function playSfx(name, ...args) {
  if (!window.Tone || !music.enabled || Tone.context.state !== 'running') return;
  try { sfxInit(); SFX[name](Tone.now() + 0.01, ...args); } catch (e) { /* never let a sound break the chat */ }
}

// Call inside a click/keypress: browsers only start audio from a user gesture
function unlockAudio() {
  if (!window.Tone || !music.enabled) return Promise.resolve();
  return Tone.context.state === 'running' ? Promise.resolve() : Tone.start();
}

// ---------- character stings: a signature sound under each member's reply ----------
// Short (1-2 s) synthesized sounds, mapped by persona; the music ducks while one plays.
const k = { ready: false };

function stingInit() {
  if (k.ready) return;

  k.hiss = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.15, decay: 0.3, sustain: 0.6, release: 0.5 }, volume: -10 }).connect(filt('highpass', 3500));

  k.saw = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.7, release: 0.08 }, volume: -16 }).connect(filt('lowpass', 1800));
  k.violin = new Tone.MonoSynth({ oscillator: { type: 'sawtooth' }, filter: { type: 'lowpass', Q: 1 }, envelope: { attack: 0.08, decay: 0.2, sustain: 0.8, release: 0.3 },
    filterEnvelope: { baseFrequency: 900, octaves: 1.5, attack: 0.1, decay: 0.3, sustain: 0.7 }, volume: -9 }).connect(new Tone.Vibrato(6, 0.15).connect(out));
  k.pluck = new Tone.PolySynth(Tone.MonoSynth, { oscillator: { type: 'sawtooth' }, filter: { type: 'lowpass', Q: 2 },

  k.drum = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, envelope: { attack: 0.001, decay: 0.5, sustain: 0 }, volume: -6 }).connect(out);
  k.boom = new Tone.MembraneSynth({ pitchDecay: 0.25, octaves: 6, envelope: { attack: 0.001, decay: 1.3, sustain: 0 }, volume: -5 }).connect(out);
  k.metal = new Tone.MetalSynth({ envelope: { attack: 0.001, decay: 0.3, release: 0.1 }, harmonicity: 5.1, modulationIndex: 20, resonance: 3500, octaves: 1.2, volume: -22 }).connect(out);
  k.gong = new Tone.FMSynth({ harmonicity: 1.41, modulationIndex: 7, envelope: { attack: 0.005, decay: 2.4, sustain: 0, release: 1 },
    modulationEnvelope: { attack: 0.005, decay: 1.5, sustain: 0, release: 0.5 }, volume: 0 }).connect(out);

    modulationEnvelope: { attack: 0.001, decay: 0.2, sustain: 0 }, volume: 2 }).connect(out);
  k.chord = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.4 }, volume: -16 }).connect(out);

  k.mosPan = new Tone.Panner(0).connect(out);

// glide helper on a mono synth: attack at f0, ramp to f1, release
function glide(s, t, f0, f1, d) {
  s.frequency.cancelScheduledValues(t);
  s.triggerAttack(f0, t);
  s.frequency.exponentialRampToValueAtTime(f1, t + d);
  s.triggerRelease(t + d);
}

    k.mosPan.pan.cancelScheduledValues(t);
    k.mosPan.pan.setValueCurveAtTime([-1, -0.4, 0.6, 1, 0.3, -0.6], t + 0.01, d);
    k.mos.triggerRelease(t + d);
  },
  // a cat: "mi-aow", nasal and unimpressed
  meow(t) {
    k.nasalF.frequency.cancelScheduledValues(t);
    k.nasalF.frequency.setValueAtTime(1600, t);
    k.nasalF.frequency.linearRampToValueAtTime(900, t + 0.55);
    k.nasal.frequency.cancelScheduledValues(t);
    k.nasal.triggerAttack(520, t);
    k.nasal.frequency.setValueCurveAtTime([520, 780, 900, 820, 600, 450], t + 0.01, 0.55);
    k.nasal.triggerRelease(t + 0.58);
  },
  // flying-saucer warble
  ufo(t) {
    const d = 1.2, n = 48;
    k.sine.frequency.cancelScheduledValues(t);
    k.sine.triggerAttack(900, t);
    k.sine.frequency.setValueCurveAtTime([...Array(n)].map((_, i) => 900 - 400 * (i / n) + 160 * Math.sin(i * 1.9)), t + 0.01, d);
    k.sine.triggerRelease(t + d);
  },
  // tinny call-centre hold music
  holdMusic(t) { seqNotes(k.box, t, ['C6', 'E6', 'G6', 'E6', 'F6', 'A6', 'G6', 'E6'], 0.22, 0.18); },
  // BREAKING NEWS: two big stabs and a whoosh
  breaking(t) {
    STINGS.timewarp(t);
    k.braam.triggerAttackRelease(['C2', 'G2', 'C3'], 0.35, t + 0.25);
    k.drum.triggerAttackRelease('C1', 0.4, t + 0.25);
    k.braam.triggerAttackRelease(['C#2', 'G#2', 'C#3'], 0.6, t + 0.65);
    k.drum.triggerAttackRelease('C1', 0.4, t + 0.65);
  },
  // stadium crowd swell with claps
  crowd(t) {
    k.crowdF.frequency.cancelScheduledValues(t);
    k.crowdF.frequency.setValueAtTime(700, t);
    k.crowdF.frequency.linearRampToValueAtTime(1300, t + 0.9);
    k.crowd.triggerAttackRelease(1.2, t);
    let at = t + 0.2;
    for (let i = 0; i < 18; i++) { at += 0.03 + Math.random() * 0.05; k.nf.frequency.setValueAtTime(1500 + Math.random() * 1500, at); k.noise.triggerAttackRelease(0.015, at, 0.2 + Math.random() * 0.4); }
  },
  // station announcement chime: ding-dong-ding-dong up the scale
  railChime(t) { seqNotes(k.box, t, ['E5', 'G#5', 'B5', 'E6'], 0.28, 0.6); },
  // eerie wind gust and a door creak
  wind(t) {
    k.bf.frequency.cancelScheduledValues(t);
    k.bf.frequency.setValueAtTime(250, t);
    k.bf.frequency.linearRampToValueAtTime(1100, t + 0.9);
    k.bf.frequency.linearRampToValueAtTime(300, t + 1.9);
    k.brown.triggerAttackRelease(1.4, t);
    k.nasalF.frequency.setValueAtTime(700, t + 0.6);
    glide(k.nasal, t + 0.6, 110, 70, 0.5);
  },
  // movie trailer: BRAAAM plus a sub boom
  trailer(t) { STINGS.braam(t); k.boom.triggerAttackRelease('C1', 1.2, t + 0.02); },
};

// Lower the music briefly so the sting (and later, voices) sit on top
function duckMusic(seconds, level = 0.4) {
  if (!music.master || !music.playing || !music.mood) return;
  const g = music.master.gain, full = moodGain(music.mood), now = Tone.now();
  g.cancelScheduledValues(now);
  g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(full * level, now + 0.08);
  g.setValueAtTime(full * level, now + seconds);
  g.linearRampToValueAtTime(full, now + seconds + 0.5);
}

function playSting(name) {
  if (!window.Tone || !music.enabled || Tone.context.state !== 'running') return;
  const persona = ROSTER_BY_NAME.get(name);
  const key = STING_FOR[name] || STING_BY_ROLE[persona?.role] || 'ping';
  try {
    stingInit();
    duckMusic(1.8);
    STINGS[key](Tone.now() + 0.15);
  } catch (e) { /* a sound must never break the chat */ }
}

async function toggleSound() {
  if (music.enabled) { playSfx('powerOff'); stopVoice(); }   // play it before the switch mutes effects
  music.enabled = !music.enabled;
  if (window.Tone) {
    if (music.enabled) {
      await Tone.start();
      ensureMaster();
      playSfx('powerOn');
      if (music.wanted && (music.wanted !== music.mood || !music.playing)) playMood(music.wanted);
      else if (music.mood) {
        Tone.Transport.start('+0.05');
        music.playing = true;
        music.master.gain.rampTo(moodGain(music.mood), FADE_IN);
      }
    } else if (music.playing) {
      const token = ++music.token;
      music.master.gain.rampTo(0, FADE_OUT);
      await wait(FADE_OUT * 1000);
      if (token === music.token && !music.enabled) { Tone.Transport.pause(); music.playing = false; }
    }
  }
  updateMusicUI();
}

// Called from send(): starts audio inside the user gesture, then routes mood.
// Returns the unlock promise so the send whoosh can play once audio is live.
function startMusicFor(question) {
  if (!window.Tone) return Promise.resolve();
  const ready = unlockAudio();
  classifyMood(question).then(async mood => {
    music.wanted = mood;
    await ready;
    if (music.enabled && (mood !== music.mood || !music.playing)) playMood(mood);
    else updateMusicUI();
  });
  return ready;
}

function updateMusicUI() {
  const btn = $('soundBtn');
  const np = $('nowPlaying');
  btn.setAttribute('aria-checked', String(music.enabled));
  const mood = music.enabled ? (music.mood || music.wanted) : null;
  let text;
  if (!window.Tone) text = 'Audio unavailable';
  else if (!music.enabled) text = 'Muted';
  else if (mood && music.playing) text = MOODS[mood].label;
  else text = 'Waiting for you';
  if (typeof voice !== 'undefined' && voice.cur) text = `🗣️ ${voice.cur.name}`;
  np.textContent = text;
  const label = music.enabled ? `Sound on: ${text}. Click to mute` : 'Sound off. Click to turn on';
  btn.title = label;
  btn.setAttribute('aria-label', label);
  $('soundBox').classList.toggle('playing', !!(music.enabled && music.playing));
  viz.kick();
}

// ---------- visualiser: stepped LED bars driven by the real music ----------
const viz = {
  bars: 14, heights: [], raf: 0, last: 0,
  kick() { if (!this.raf) this.raf = requestAnimationFrame(t => this.frame(t)); },
  frame(t) {
    this.raf = 0;
    const live = music.enabled && music.playing && music.analyser && !document.hidden;
    if (live && t - this.last < (REDUCED ? 200 : 33)) { this.raf = requestAnimationFrame(x => this.frame(x)); return; }
    this.last = t;
    const c = $('viz');
    const dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const fft = live ? music.analyser.getValue() : null;
    // seven solid slabs in the button's colour (white, or black on hover), square tops
    const n = 7, gap = 2, bw = (w - gap * (n - 1)) / n;
    g.fillStyle = getComputedStyle($('soundBtn')).color;
    for (let i = 0; i < n; i++) {
      let target = 0.12;
      if (fft) {
        const db = fft[Math.min(fft.length - 1, 1 + Math.floor(i * 2.4))];
        target = Math.max(0.12, Math.min(1, (db + 90) / 60));
      }
      const prev = this.heights[i] ?? 0.12;
      const v = target > prev ? prev + (target - prev) * 0.55 : Math.max(target, prev * 0.88);
      this.heights[i] = v;
      const bh = Math.max(3, Math.round(v * h));
      g.fillRect(Math.round(i * (bw + gap)), h - bh, Math.round(bw), bh);
    }
    if (live) this.raf = requestAnimationFrame(x => this.frame(x));

  },
};
document.addEventListener('visibilitychange', () => viz.kick());
