<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Council</title>
<meta name="description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="The Council">
<meta property="og:description" content="Ask anything. Four legendary minds reply in a group chat, bicker, and spectacularly disagree.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root {
  --paper: #F2F0E9;
  --ink: #000000;
  --white: #FFFFFF;
  --c1: #FF3B00;  /* member slot 1 */
  --c2: #0038FF;  /* member slot 2 */
  --c3: #00E05A;  /* member slot 3 */
  --c4: #FFD600;  /* member slot 4 */
  --err: #FF1A1A;
  /* chaos heat, level 1 -> 5 */
  --l1: #00E05A; --l2: #FFD600; --l3: #FF8A00; --l4: #FF3B00; --l5: #FF4FD8;
  --b: 3px solid var(--ink);
  --B: 4px solid var(--ink);
  --shadow: 8px 8px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --display: 'Bricolage Grotesque', 'Arial Black', Impact, sans-serif;
  --text: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --rail-w: 300px;
  --halftone: radial-gradient(rgba(0,0,0,0.11) 1.1px, transparent 1.6px);
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
html, body { height: 100%; }
body {
  background-color: var(--c2);
  background-image: radial-gradient(rgba(0,0,0,0.32) 1.4px, transparent 1.9px);
  background-size: 10px 10px;
  color: var(--ink);
  font-family: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }
::selection { background: var(--c4); color: var(--ink); }

/* Brutalist scrollbars: a black slab on a paper track */
* { scrollbar-width: thin; scrollbar-color: var(--ink) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--ink); border: 3px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--c1); }

/* Shared chunky button: raised on hover, pressed on click */
.kbtn {
  border: var(--b);
  box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer;
  transition: transform 90ms ease-out, box-shadow 90ms ease-out;
}
.kbtn:not(:disabled):hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.kbtn:not(:disabled):active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.kbtn:disabled { cursor: not-allowed; opacity: 0.45; }

/* ================================================================
   WINDOW
   ================================================================ */
.app {
  position: fixed;
  inset: calc(16px + env(safe-area-inset-top, 0px)) calc(26px + env(safe-area-inset-right, 0px))
         calc(26px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "title  title"
    "ticker ticker"
    "rail   stream"
    "chaos  stream"
    "bar    bar";
  background: var(--paper);
  border: var(--B);
  box-shadow: 10px 10px 0 var(--ink);
  min-height: 0;
}

/* ---------- Header ---------- */
.titlebar {
  grid-area: title;
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--ink);
  color: var(--white);
  min-width: 0;
  min-height: 74px;
}
/* Logo: a flat yellow slab flush with the window edge */
.logo {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--c4);
  color: var(--ink);
  padding: 0 16px 0 14px;
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 75%;
  font-size: 1.05rem;
  line-height: 0.88;
  text-transform: uppercase;
}
.logo .ico { font-size: 1.35rem; }
/* Member strip: four flat squares on a hard grid, black gaps between */
.head-avatars { display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 0 16px 0 16px; }
.head-avatars span {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  background: var(--accent, var(--white));
}
.head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 10px 16px 10px 0; }
.squad-name {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 80%;
  font-size: clamp(1.3rem, 2.2vw, 2rem);
  line-height: 1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.head-sub {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #BDBDBD;
}
.head-sub .on { color: var(--c3); }
.head-sub .on::before { content: '■ '; }
.head-sub .lvl-now { color: var(--lvl-color, var(--l1)); }

/* ---------- Sound panel: flat slab flush right ---------- */
.sound {
  flex-shrink: 0;
  display: flex;
  align-items: stretch;
  background: var(--paper);
  color: var(--ink);
}
.viz-wrap { display: flex; align-items: center; padding: 0 12px 0 14px; background: var(--ink); border-left: 4px solid var(--c4); }
.viz { display: block; width: 132px; height: 44px; }
.np-txt { display: flex; flex-direction: column; justify-content: center; min-width: 0; width: 176px; padding: 0 14px; line-height: 1.1; border-left: var(--b); }
.np-k { font-family: var(--mono); font-size: 0.6rem; font-weight: 700; text-transform: uppercase; color: #5A5A5A; }
.np-v { font-weight: 800; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

/* Power switch */
.switch {
  border: none;
  border-left: var(--b);
  background: var(--paper);
  padding: 0 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
}
.switch-track { position: relative; width: 48px; height: 24px; background: var(--white); border: var(--b); transition: background 0.15s; }
.switch-knob {
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  background: var(--ink);
  transition: transform 0.18s cubic-bezier(.3,1.4,.5,1);
}
.switch[aria-checked="true"] .switch-track { background: var(--c3); }
.switch[aria-checked="true"] .switch-knob { transform: translateX(24px); }
.switch:active .switch-knob { width: 18px; }

/* ---------- Ticker ---------- */
.ticker {
  grid-area: ticker;
  border-top: var(--b);
  border-bottom: var(--b);
  background: var(--c4);
  overflow: hidden;
  white-space: nowrap;
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.8rem;
  text-transform: uppercase;
  height: 30px;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: inline-block;
  padding-left: 100%;
  animation: tick 48s linear infinite;
}
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- Member rail ---------- */
.rail {
  grid-area: rail;
  border-right: var(--B);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  background: var(--white);
}
.rail-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: var(--b);
  font-weight: 800;
  font-stretch: 80%;
  font-size: 1rem;
  text-transform: uppercase;
  background: var(--paper);
}
.rail-head small {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--ink);
  color: var(--white);
  padding: 2px 6px;
}
.rail-list { overflow-y: auto; flex: 1; min-height: 0; }
.member {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 11px 14px 11px;
  border-bottom: var(--b);
  background: var(--white);
}
.avatar {
  width: 48px;
  height: 48px;
  border: var(--b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  background: var(--accent, var(--white));
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-3deg);
}
.member:nth-child(odd) .avatar { transform: rotate(2.5deg); }
.member-text { min-width: 0; }
.member-name {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.02rem;
  line-height: 1.08;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.member-arch {
  margin-top: 3px;
  font-size: 0.8rem;
  line-height: 1.3;
  color: #3A3A3A;
}
.member-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 7px; }
.role {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  border: 2px solid var(--ink);
  padding: 1px 5px;
  background: var(--paper);
}
.member-status {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  text-transform: uppercase;
}
.member-status { padding: 1px 5px; border: 2px solid transparent; }
.member-status.typing { background: var(--c2); color: var(--white); border-color: var(--ink); }
.member-status.replied { background: var(--c3); border-color: var(--ink); }
.member-status.left { color: #8A8A8A; border: 2px dashed #8A8A8A; }
.member.you { background: var(--paper); }
.member.you .avatar { background: var(--ink); color: var(--white); font-weight: 800; font-size: 0.9rem; transform: none; }

/* ---------- Stream ---------- */
.stream {
  grid-area: stream;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background-color: var(--paper);
  background-image: var(--halftone);
  background-size: 12px 12px;
}

/* Narration boxes (system messages) */
.sys {
  align-self: center;
  max-width: min(560px, 100%);
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 1.4;
  text-transform: uppercase;
  text-align: center;
  background: var(--c4);
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  padding: 4px 10px;
}
.sys.err {
  align-self: stretch;
  max-width: none;
  text-align: left;
  background: var(--err);
  color: var(--white);
  display: flex;
  gap: 10px;
  align-items: center;
}
.sys.err::before {
  content: '!';
  flex-shrink: 0;
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--white);
  color: var(--err);
  border: 2px solid var(--ink);
  font-family: var(--display);
  font-weight: 800;
}
.day {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
}
.day { justify-content: center; }
.day span { background: var(--ink); color: var(--white); padding: 3px 10px; }

/* Squad change card */
.squad-card {
  align-self: center;
  width: min(520px, 100%);
  background: var(--white);
  border: var(--b);
  box-shadow: 5px 5px 0 var(--ink);
}
.sc-title {
  background: var(--ink);
  color: var(--white);
  padding: 8px 12px;
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.95rem;
  text-transform: uppercase;
  line-height: 1.1;
}
.sc-title small { display: block; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; color: var(--c4); margin-bottom: 3px; }
.sc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr); }
.sc-h {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 12px;
  border-top: var(--b);
  background: var(--paper);
}
.sc-h.mid { padding: 0; }
.sc-cell { padding: 8px 10px; border-top: 2px solid var(--ink); display: flex; }
.sc-arrow {
  border-top: 2px solid var(--ink);
  display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--c4);
  font-weight: 800; font-size: 1rem;
}
.sc-chip {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1.15;
  border: 2.5px solid var(--ink);
  padding: 3px 8px 3px 3px;
  background: var(--accent, var(--white));
  color: var(--tag-ink, var(--ink));
}
.sc-chip .e { flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: var(--white); border: 2px solid var(--ink); font-size: 0.9rem; }
.sc-cell.out .sc-chip { background: var(--paper); color: #6A6A6A; border-style: dashed; }
.sc-cell.out .sc-chip .n { text-decoration: line-through; text-decoration-thickness: 2px; }
.sc-cell.out .sc-chip .e { filter: grayscale(1); opacity: 0.6; }

/* Welcome poster + example questions (shown until the first send) */
.welcome { align-self: stretch; display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 18px 4px 6px; }
.w-line {
  display: inline-block;
  background: var(--ink);
  color: var(--white);
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 78%;
  font-size: clamp(2rem, 4.6vw, 3.9rem);
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  padding: 6px 14px 4px;
}
.w-line:nth-child(2) { margin-left: clamp(18px, 4vw, 56px); background: var(--c1); color: var(--ink); }
.w-line:nth-child(3) { margin-left: clamp(36px, 8vw, 112px); background: var(--c4); color: var(--ink); }
.w-sub { margin: 18px 0 14px; max-width: 46ch; font-size: 1rem; line-height: 1.45; }
.w-chips { display: flex; flex-wrap: wrap; gap: 10px 12px; }
.w-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--white);
  font-size: 0.95rem;
  font-weight: 700;
  text-align: left;
  padding: 8px 12px 8px 8px;
}
.w-chip .e { width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--accent); border: 2px solid var(--ink); font-size: 1rem; }

/* A question and its replies */
.round { display: flex; flex-direction: column; gap: 16px; transition: zoom 0.45s cubic-bezier(.2,.8,.3,1); }

/* Skip chip while replies are arriving */
.skip-chip {
  position: sticky;
  bottom: 0;
  align-self: center;
  z-index: 3;
  margin-top: auto;
  border: 2.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
  background: var(--white);
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
}
.skip-chip:hover { background: var(--c4); }

/* Messages */
.msg { display: flex; align-items: flex-start; gap: 12px; max-width: min(640px, 86%); }
.msg.me { align-self: flex-end; margin-right: 14px; }
.msg.member-msg { align-self: flex-start; }
.msg-col { display: flex; flex-direction: column; min-width: 0; }
.msg.me .msg-col { align-items: flex-end; }

.msg-av {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  margin-top: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  background: var(--accent, var(--white));
  border: var(--b);
  box-shadow: 3px 3px 0 var(--ink);
  transform: rotate(-4deg);
}
.msg-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.msg-tag {
  font-weight: 800;
  font-stretch: 85%;
  font-size: 0.82rem;
  line-height: 1;
  text-transform: uppercase;
  background: var(--accent, var(--ink));
  color: var(--tag-ink, var(--white));
  border: 2.5px solid var(--ink);
  padding: 4px 8px 3px;
  transform: rotate(-1.5deg);
}
.msg-vibe { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: #5A5A5A; }

.bubble {
  position: relative;
  border: var(--b);
  background: var(--white);
  padding: 12px 16px;
  font-size: 1.02rem;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.me .bubble { background: var(--ink); color: var(--white); }

/* Comic speech-bubble tail */
.tail { position: absolute; top: 12px; left: -15px; width: 18px; height: 22px; overflow: visible; }
.tail path { fill: var(--white); stroke: var(--ink); stroke-width: 3; stroke-linejoin: miter; }
.msg.me .tail { left: auto; right: -15px; transform: scaleX(-1); }
.msg.me .tail path { fill: var(--ink); }

.msg-meta {
  display: flex;
  gap: 10px;
  margin-top: 9px;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #5A5A5A;
}
.msg-meta .receipt { color: var(--ink); }

/* ---------- Composer ---------- */
.bar {
  grid-area: bar;
  border-top: var(--B);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "rand input send";
  align-items: stretch;
  gap: 14px;
  padding: 12px 14px 14px;
  background: var(--white);
}
.bar > * { min-width: 0; }

.rand-btn, .send-btn {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.05rem;
  text-transform: uppercase;
  padding: 0 18px;
  min-height: 58px;
}
.rand-btn { grid-area: rand; background: var(--c3); }
.rand-btn .ico { display: inline-block; margin-right: 4px; }
.rand-btn:not(:disabled):hover .ico { animation: dice 0.5s ease-in-out; }
@keyframes dice { 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg); } }
.send-btn { grid-area: send; background: var(--c1); min-width: 112px; }

/* ---------- Chaos machine (slot reel + lever) ---------- */
.chaos {
  grid-area: chaos;
  background: var(--ink);
  color: var(--white);
  border-right: var(--B);
  border-top: var(--B);
  padding: 12px 14px 14px;
}
.chaos-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  font-weight: 800;
  font-stretch: 80%;
  font-size: 1rem;
  text-transform: uppercase;
  color: var(--c4);
}
.chaos-num { font-family: var(--mono); font-size: 0.7rem; font-weight: 700; color: var(--white); }
.chaos-body { display: flex; align-items: stretch; gap: 10px; }
.chaos-steps { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.step {
  width: 38px; height: 34px;
  background: var(--white);
  color: var(--ink);
  font-size: 0.8rem;
  box-shadow: 3px 3px 0 var(--c4);
}
.step:not(:disabled):hover { box-shadow: 4px 4px 0 var(--c4); }
.step:not(:disabled):active { box-shadow: 0 0 0 var(--c4); }

.reel-win {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 86px;
  overflow: hidden;
  background: var(--white);
  border: var(--b);
  outline: 3px solid var(--c4);
  cursor: ns-resize;
}
.reel-win:focus-visible { outline: 3px solid var(--c2); outline-offset: 0; }
/* curved-drum shading top and bottom */
.reel-win::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.55));
}
.reel-strip { will-change: transform; }
.reel-item {
  height: 58px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: var(--lvl-color);
  color: var(--ink);
  border-bottom: var(--b);
}
.reel-item .e { font-size: 1.6rem; line-height: 1; }
.reel-item .n { font-weight: 800; font-stretch: 80%; font-size: 1.35rem; text-transform: uppercase; line-height: 1; }
.payline {
  position: absolute;
  top: 50%;
  z-index: 1;
  width: 0; height: 0;
  margin-top: -8px;
  border-style: solid;
  pointer-events: none;
}
.payline.l { left: 0; border-width: 8px 0 8px 10px; border-color: transparent transparent transparent var(--ink); }
.payline.r { right: 0; border-width: 8px 10px 8px 0; border-color: transparent var(--ink) transparent transparent; }
.reel-win.jackpot { animation: jackpot 0.5s steps(2) 2; }
@keyframes jackpot { 50% { outline-color: var(--white); } }
.reel-win.bump .reel-strip { animation: bump 0.25s ease-out; }
@keyframes bump { 30% { translate: 0 -6px; } 60% { translate: 0 4px; } }

.lever {
  position: relative;
  width: 44px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
}
.lever-stick { position: relative; flex: 1; width: 6px; background: var(--white); margin-top: 14px; }
.lever-knob {
  position: absolute;
  left: 50%;
  top: -14px;
  width: 26px; height: 26px;
  margin-left: -13px;
  background: var(--c1);
  border: 3px solid var(--white);
  transition: transform 0.12s ease-in;
}
.lever-txt {
  margin-top: 4px;
  width: 100%;
  background: var(--c4);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  text-align: center;
  padding: 3px 0;
}
.lever.pulled .lever-knob { transform: translateY(34px); }
.lever:disabled, .step:disabled { opacity: 0.4; cursor: not-allowed; }
.chaos-desc { margin-top: 10px; font-family: var(--mono); font-size: 0.66rem; font-weight: 700; line-height: 1.4; color: #CFCFCF; text-transform: uppercase; }

.input-wrap {
  grid-area: input;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--white);
  border: var(--b);
  box-shadow: 4px 4px 0 var(--ink);
  cursor: text;
  transition: box-shadow 120ms;
}
.input-wrap:focus-within { box-shadow: 4px 4px 0 var(--c2); }
.input-wrap .prompt { font-size: 1.2rem; flex-shrink: 0; }
.input {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  font-size: 1rem;
  line-height: 1.4;
  max-height: 140px;
  outline: none;
  padding: 6px 0;
}
.input::placeholder { color: #8A8A8A; }

/* ================================================================
   ANIMATION  (transform / opacity / clip-path only)
   ================================================================ */
/* Hard shadow lives on a wrapper so it can "grow" with a transform */
.bwrap { position: relative; }
.bwrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent, var(--ink));
  outline: 2.5px solid var(--ink);
  outline-offset: -2.5px;
  transform: translate(7px, 7px);
}
.msg.me .bwrap::before { background: var(--l5); }

/* Typing indicators */
.dots i { font-style: normal; animation: blink 0.9s steps(1) infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.15; } }
.bounce { display: inline-flex; gap: 6px; padding: 5px 2px; }
.bounce i { width: 9px; height: 9px; background: var(--ink); animation: bounce 0.9s ease-in-out infinite; }
.bounce i:nth-child(2) { animation-delay: 0.15s; }
.bounce i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }
.ghost .bubble { background: var(--paper); }
.ghost .bwrap::before { opacity: 0.35; }
.ghost .tail path { fill: var(--paper); }
.ghost .msg-tag { transform: none; }
.ghost-stack { display: flex; margin-top: 26px; }
.ghost-stack span {
  width: 34px; height: 34px; margin-left: -8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
  background: var(--accent); border: var(--b);
}
.ghost-stack span:first-child { margin-left: 0; }

/* Boot: window drops in and settles */
.a-boot { animation: drop 560ms cubic-bezier(.2,.85,.25,1.05) both; }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(18px) scale(0.985); }
  100% { opacity: 1; transform: none; }
}

/* User bubble launches up from the input */
.a-launch { animation: launch 600ms cubic-bezier(.2,.9,.25,1.12) both; transform-origin: bottom right; }
@keyframes launch { from { opacity: 0; transform: translateY(48px) scale(0.96); } to { opacity: 1; transform: none; } }

/* Member bubble stamps in, shadow grows after */
.a-stamp { animation: stamp 560ms cubic-bezier(.2,.9,.25,1.12) both; transform-origin: 20px 40px; }
.a-stamp .bwrap::before { animation: shadowGrow 320ms 260ms cubic-bezier(.2,.9,.3,1.2) both; }
.msg.a-stamp .bubble { animation: newFlash 1.6s 200ms ease-out both; }
@keyframes stamp { from { opacity: 0; transform: translateY(22px) scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes newFlash { from { background: #FFF3A8; } to { background: var(--white); } }
@keyframes shadowGrow { from { transform: translate(0, 0); } to { transform: translate(7px, 7px); } }

.a-ghost, .a-sys { animation: fadeUp 220ms ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Rail cards on first load (randomize uses card flips in JS) */
.a-stamp-in { animation: railIn 420ms cubic-bezier(.2,.85,.25,1.1) both; }
@keyframes railIn {
  from { opacity: 0; transform: translateX(-16px) rotate(-1deg); }
  to   { opacity: 1; transform: none; }
}

/* Level change: dim, strike through, fold away, stub, collapse */
.msg.pending { opacity: 0.45; transition: opacity 0.2s; }
.a-unsend .bubble::after {
  content: '';
  position: absolute;
  left: 10px; right: 10px; top: 50%;
  height: 4px;
  background: var(--err);
  transform-origin: left;
  animation: strike 200ms cubic-bezier(.4,0,.2,1) both;
}
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.stub {
  margin-left: 56px;
  border: 3px dashed var(--ink);
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  font-style: italic;
  text-transform: uppercase;
  opacity: 0.65;
}

/* Reaction tags */
.react {
  position: absolute;
  bottom: -16px;
  right: 14px;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--white);
  border: 2.5px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 2px 7px;
  font-size: 0.95rem;
  line-height: 1.2;
  transform: rotate(-4deg);
}
.react small { font-size: 0.7rem; }
.a-pop { animation: pop 260ms cubic-bezier(.2,.9,.3,1.5) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.4) rotate(-14deg); } to { opacity: 1; transform: rotate(-4deg); } }

@media (prefers-reduced-motion: reduce) {
  .a-boot, .a-launch, .a-stamp, .a-stamp-in, .a-ghost, .a-sys, .a-pop { animation: fadeIn 180ms both !important; }
  .a-stamp .bwrap::before, .a-unsend .bubble::after, .dots i, .bounce i, .msg.a-stamp .bubble { animation: none !important; }
  .round { transition: none; }
}

/* ================================================================
   STORY EXPORT
   ================================================================ */
.shot-row { display: flex; justify-content: center; padding: 6px 0 4px; }
.shot-row { padding-top: 14px; }
.shot-btn {
  background: var(--c4);
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 1.05rem;
  text-transform: uppercase;
  min-height: 54px;
  padding: 0 24px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.shot-btn .ico { font-size: 1.3rem; }
.a-slam { animation: slamBtn 380ms cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes slamBtn {
  0%   { opacity: 0; transform: scale(1.7) rotate(-5deg); }
  65%  { opacity: 1; transform: scale(0.95) rotate(1deg); }
  100% { opacity: 1; transform: none; }
}

.viewfinder {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  border: 4px solid var(--ink);
  outline: 3px solid var(--white);
  outline-offset: -10px;
  animation: viewfinder 240ms ease-out both;
}
@keyframes viewfinder {
  0%   { opacity: 0; transform: scale(1.05); background: rgba(255,255,255,0); }
  35%  { opacity: 1; transform: scale(1); background: rgba(255,255,255,0.85); }
  100% { opacity: 1; transform: scale(1); background: rgba(255,255,255,0); }
}

.story-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.story-overlay[hidden] { display: none; }
.story-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88); }
.story-card {
  position: relative;
  background: var(--paper);
  border: var(--B);
  box-shadow: 10px 10px 0 var(--c4);
  transform-origin: center;
  overflow: hidden;
}
.story-img { display: block; width: 100%; height: 100%; }
.story-img[hidden], .story-loading[hidden] { display: none; }
.story-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.story-actions { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.story-btns { display: flex; border: var(--B); box-shadow: 6px 6px 0 var(--white); }
.story-btns .blk { min-height: 52px; font-size: 0.85rem; }
.story-dl { background: var(--c3); border-right: var(--b); }
.story-share { background: var(--c4); border-right: var(--b); }
.story-back { background: var(--white); }
.story-status { color: var(--white); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; min-height: 1.2em; text-align: center; }

/* Off-screen 1080x1920 story: a phone screenshot of the group chat.
   Kept to CSS that html2canvas draws reliably: no font-stretch, outline or SVG. */
.sx {
  position: fixed;
  left: -100000px;
  top: 0;
  width: 1080px;
  height: 1920px;
  display: flex;
  flex-direction: column;
  background: #F2F0E9;
  color: #000;
  font-family: var(--text);
  overflow: hidden;
}
.sx-status {
  height: 96px;
  flex-shrink: 0;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 64px 0;
  font-family: var(--mono);
  font-size: 34px;
  font-weight: 700;
}
.sx-island { width: 230px; height: 62px; background: #1A1A1A; border-radius: 40px; }
.sx-batt { display: flex; align-items: center; gap: 12px; }
.sx-batt b { color: #FF3B00; }
.sx-head {
  flex-shrink: 0;
  background: #000;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 22px 48px 30px;
}
.sx-back { font-size: 76px; line-height: 1; font-weight: 800; margin-top: -8px; }
.sx-avs { display: flex; flex-shrink: 0; }
.sx-avs > span { background: #fff; padding: 4px; margin-left: -18px; }
.sx-avs > span:first-child { margin-left: 0; }
.sx-avs > span:nth-child(odd) { transform: rotate(-5deg); }
.sx-avs > span:nth-child(even) { transform: rotate(4deg); }
/* no box-shadow on rotated boxes: html2canvas paints those in the wrong place */
.sx-avs b {
  width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; font-weight: 400;
  border: 6px solid #000;
}
.sx-title { flex: 1; min-width: 0; }
.sx-name { font-family: var(--display); font-weight: 800; font-size: 58px; line-height: 1; text-transform: uppercase; letter-spacing: -1px; }
.sx-sub { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-top: 14px; font-family: var(--mono); font-size: 25px; font-weight: 700; text-transform: uppercase; color: #CFCFCF; }
.sx-on { color: #00E05A; }
.sx-ticker {
  flex-shrink: 0;
  background: #FFD600;
  border-top: 6px solid #000;
  border-bottom: 6px solid #000;
  padding: 12px 0;
  white-space: nowrap;
  overflow: hidden;
  font-weight: 800;
  font-size: 26px;
  text-transform: uppercase;
}
.sx-chat {
  --fs: 40px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 30px;
  padding: 30px 56px 30px 48px;
  background-color: #F2F0E9;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.05) 2px, transparent 2px),
    linear-gradient(to bottom, rgba(0,0,0,0.05) 2px, transparent 2px);
  background-size: 48px 48px;
}
.sx-day { display: flex; align-items: center; gap: 20px; font-family: var(--mono); font-size: 24px; font-weight: 700; text-transform: uppercase; }
.sx-day i { flex: 1; height: 5px; background: #000; }
.sx-day span { background: #000; color: #fff; padding: 4px 14px; }

.sx-msg { display: flex; align-items: flex-start; gap: 34px; max-width: 94%; }
.sx-me { align-self: flex-end; flex-direction: column; align-items: flex-end; max-width: 86%; margin-right: 26px; }
.sx-av {
  flex-shrink: 0;
  width: 80px; height: 80px;
  margin-top: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  background: var(--accent);
  border: 6px solid #000;
  transform: rotate(-4deg);
}
.sx-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.sx-tag {
  font-weight: 800;
  font-size: calc(var(--fs) * 0.7);
  line-height: 1;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--tag-ink);
  border: 5px solid #000;
  padding: 9px 14px 7px;
  margin-bottom: 16px;
  transform: rotate(-1.5deg);
}
.sx-bub {
  position: relative;
  background: #fff;
  border: 6px solid #000;
  box-shadow: 14px 14px 0 var(--accent);
  padding: 24px 30px;
  font-size: var(--fs);
  line-height: 1.32;
  font-weight: 500;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
/* tail: a pre-drawn triangle image (html2canvas draws <img> more reliably than
   rotated boxes or border triangles) overlapping the bubble's left border */
.sx-tail { position: absolute; left: -40px; top: 20px; width: 46px; height: 52px; }
.sx-me .sx-bub { background: #000; color: #fff; box-shadow: 14px 14px 0 #FF4FD8; font-weight: 600; }
.sx-me .sx-tail { left: auto; right: -40px; transform: scaleX(-1); }
.sx-meta { margin-top: 24px; font-family: var(--mono); font-size: 22px; font-weight: 700; text-transform: uppercase; color: #555; }
.sx-react {
  position: absolute;
  right: 24px; bottom: -34px;
  background: #fff;
  border: 5px solid #000;
  padding: 4px 14px;
  font-size: 34px;
  line-height: 1.2;
  transform: rotate(-4deg);
}

.sx-compose {
  flex-shrink: 0;
  display: flex;
  gap: 22px;
  align-items: stretch;
  padding: 26px 48px 150px;   /* bottom stays clear of Instagram's reply bar */
  background: #fff;
  border-top: 7px solid #000;
  position: relative;
}
.sx-input {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  border: 6px solid #000;
  box-shadow: 8px 8px 0 #0038FF;
  padding: 16px 26px;
}
.sx-input small { font-family: var(--mono); font-size: 22px; font-weight: 700; text-transform: uppercase; color: #666; }
.sx-input b { font-weight: 800; font-size: 34px; }
.sx-send {
  display: flex; align-items: center; justify-content: center;
  padding: 0 34px;
  background: #FF3B00;
  border: 6px solid #000;
  box-shadow: 8px 8px 0 #000;
  font-weight: 800;
  font-size: 36px;
  text-transform: uppercase;
}
.sx-home { position: absolute; left: 50%; bottom: 44px; width: 300px; height: 12px; margin-left: -150px; background: #000; border-radius: 8px; }


@media (prefers-reduced-motion: reduce) {
  .a-slam { animation: fadeIn 180ms both !important; }
}

/* ================================================================
   MOBILE
   ================================================================ */
@media (max-width: 1100px) {
  .np-txt { width: 140px; }
  .head-avatars { display: none; }
}
@media (max-width: 720px) {
  body { background: var(--paper); }
  .app {
    inset: 0;
    border: none;
    box-shadow: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
    grid-template-areas: "title" "ticker" "rail" "stream" "chaos" "bar";
  }
  .titlebar { min-height: 0; }
  .logo { display: none; }
  .head-main { padding: 10px 10px 10px 12px; }
  .squad-name { font-size: 1.15rem; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .head-sub { font-size: 0.62rem; margin-top: 4px; }
  .head-sub .lvl-now { display: none; }
  .np-txt { display: none; }
  .viz-wrap { padding: 0 8px; }
  .viz { width: 56px; height: 34px; }
  .switch { padding: 0 10px; }
  .switch #soundTxt { display: none; }
  .ticker { height: 24px; font-size: 0.7rem; border-top-width: 2px; }

  .rail { border-right: none; border-bottom: var(--b); }

  .rail-list::-webkit-scrollbar { display: none; }
  .member {
    grid-template-columns: 38px minmax(0, 1fr);
    gap: 8px;
    align-items: center;
    border-bottom: none;

    flex: 0 0 158px;
  }
  .member.you { display: none; }
  .avatar { width: 38px; height: 38px; font-size: 1.2rem; box-shadow: 2px 2px 0 var(--ink); }
  .member-name { font-size: 0.78rem; }
  .member-arch, .role { display: none; }
  .member-foot { margin-top: 3px; }

  .stream { padding: 16px 12px 20px; }
  .w-line { font-size: 1.75rem; }
  .w-sub { font-size: 0.92rem; margin: 14px 0 12px; }
  .w-chip { font-size: 0.85rem; }
  .msg { max-width: 94%; gap: 9px; }
  .msg-av { width: 34px; height: 34px; font-size: 1.05rem; margin-top: 24px; }
  .ghost-stack span { width: 28px; height: 28px; font-size: 0.85rem; }
  .stub { margin-left: 43px; }
  .bubble { font-size: 0.97rem; padding: 10px 13px; }

  .bar {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "rand input send";
    gap: 10px;
    padding: 10px 10px 12px;
  }
  .chaos { border-right: none; border-top: var(--b); padding: 8px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; }
  .chaos-head { display: none; }
  .chaos-body { gap: 8px; }
  .reel-win { height: 58px; }
  .reel-item { height: 40px; padding: 0 10px; }
  .reel-item .e { font-size: 1.25rem; }
  .reel-item .n { font-size: 1.05rem; }
  .step { width: 34px; height: 25px; font-size: 0.7rem; }
  .lever { width: 40px; }
  .chaos-desc { display: none; }
  .rand-btn { padding: 0 12px; font-size: 0; min-height: 50px; }
  .rand-btn .ico { font-size: 1.4rem; margin: 0; }
  .send-btn { min-width: 74px; min-height: 50px; padding: 0 12px; font-size: 0.95rem; }
  .input-wrap { padding: 4px 10px; }
  .input-wrap .prompt { display: none; }
  .story-btns .blk { padding: 0 12px; font-size: 0.75rem; }
}

@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; padding-left: 12px; }
  .kbtn, .switch-knob { transition: none; }
  * { scroll-behavior: auto !important; }
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<body>

<div class="app" id="app">

  <!-- TITLE BAR -->
  <header class="titlebar">
    <div class="logo" aria-hidden="true"><span class="ico">🏛️</span><span>The<br>Council</span></div>
    <div class="head-avatars" id="headAvatars" aria-hidden="true"></div>
    <div class="head-main">
      <h1 class="squad-name" id="squadName">Assembling…</h1>
      <div class="head-sub">

const SQUAD_OF = ['Bad Decisions', 'Unsolicited Advice', 'Emotional Damage', 'Questionable Ethics',

const ROSTER_BY_NAME = new Map(ROSTER.map(p => [p.name, p]));
const VALID_SQUADS = CHAOS_SQUADS.filter(sq => {
  const missing = sq.members.filter(n => !ROSTER_BY_NAME.has(n));
  if (missing.length) console.warn('Chaos squad skipped, unknown members:', sq.title, missing);
  return !missing.length;
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];

function generateSquadName(prevName) {
  let name;
  do { name = `The ${pickOne(SQUAD_BODIES)} of ${pickOne(SQUAD_OF)}`; } while (name === prevName);
  return name;
}

// Rules: 4 different roles, at least one SAGE/WHOLESOME and one
// MENACE/UNHINGED_OBJECT, no member carried over from the previous squad.
function pickContrastSquad(prevNames) {
  const anchor = pickOne(['SAGE', 'WHOLESOME']);
  const chaos  = pickOne(['MENACE', 'UNHINGED_OBJECT']);
  const rest   = shuffle(ROLES.filter(r => r !== anchor && r !== chaos)).slice(0, 2);
  const roles  = shuffle([anchor, chaos, ...rest]);
  return roles.map(role => {
    const pool = ROSTER.filter(p => p.role === role && !prevNames.has(p.name));
    return pickOne(pool.length ? pool : ROSTER.filter(p => p.role === role));
  });
}

function pickSquad(prevMembers, prevTitle) {
  const prevNames = new Set(prevMembers.map(p => p.name));
  if (Math.random() < CHAOS_CHANCE) {
    const options = VALID_SQUADS.filter(sq =>
      sq.title !== prevTitle && !sq.members.some(n => prevNames.has(n)));
    if (options.length) {
      const sq = pickOne(options);
      return { title: sq.title, members: shuffle(sq.members.map(n => ROSTER_BY_NAME.get(n))) };
    }
  }
  return { title: generateSquadName(prevTitle), members: pickContrastSquad(prevNames) };
}

}

async function fetchCouncil(question) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, personalities: state.members, quirk_level: state.level }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Error ${res.status}`);
  }
  const data = await res.json();
  if (!Array.isArray(data.members)) throw new Error('The council returned an empty reply. Send again.');
  return data.members;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

// Durations in ms; keep in sync with the CSS keyframes
const T = {
  boot: 560,       // window drop
  stampGap: 110,   // stagger between rail cards on first load
  flipOut: 190,    // randomize: card turns away
  flipIn: 420,     // randomize: new card turns in
  flipGap: 65,     // stagger between flipping cards
  unsendGap: 90,
  stubHold: 650,   // how long "deleted" stubs stay
  collapse: 280,
  debounce: 900,   // level change -> re-summon
};

// Each reply waits 700-1600ms, scaled by its length, slightly randomised
function typingTime(text) {
  const len = String(text || '').length;
  return Math.round(Math.min(1500, Math.max(850, 700 + len * 4 + rand(-100, 160))));
}
// Time to read a reply before the next member starts typing (~27 ms per character)
function readTime(text) {
  const len = String(text || '').length;
  return Math.round(Math.min(3900, Math.max(1300, 500 + len * 27)));
}
// A wait that ends early (but not instantly) when the user taps "skip"
async function pace(ms) {
  const end = performance.now() + ms;
  while (performance.now() < end) {
    if (state.skip) { await wait(140); return; }
    await wait(50);
  }
}

async function typeOut(el, text) {
  el.textContent = '';
  for (const ch of text) {
    el.textContent += ch;
    await wait(ch === ' ' ? 10 : 24);
  }
}

// ---------- Reactions (client-side decoration only) ----------
const REACTIONS = ['💀', '😭', '🤡', '🔥', '😤', '🙏', '🫠', '👀'];

async function dropReactions(round) {
  const n = round.memberEls.length;
  if (n < 2) return;
  const count = Math.random() < 0.5 ? 1 : 2;
  const used = new Set();
  for (let k = 0; k < count; k++) {
    await wait(rand(350, 750));
    let from, to, tries = 0;
    do {
      from = Math.floor(Math.random() * n);
      to = Math.floor(Math.random() * n);
    } while ((from === to || used.has(to)) && ++tries < 30);
    if (from === to || used.has(to)) return;
    used.add(to);
    const reactor = round.members[from];
    const emoji = pickOne(REACTIONS);
    (round.reactions ||= []).push({ to, emoji, by: reactor.emoji });
    const tag = document.createElement('span');
    tag.className = 'react a-pop';
    tag.title = `${reactor.name} reacted`;
    tag.innerHTML = `${emoji}<small>${escHtml(reactor.emoji)}</small>`;
    round.memberEls[to].querySelector('.bwrap')?.appendChild(tag);
    playSfx('boing');
  }
}

// ---------- Unsend (level change) ----------
// Collapse an element's height smoothly so nothing below it jumps
async function collapseAway(el) {
  if (REDUCED) { el.remove(); return; }
  const h = el.offsetHeight;
  el.style.overflow = 'hidden';
  await el.animate(
    [{ height: `${h}px`, opacity: 1, marginBottom: '0px' }, { height: '0px', opacity: 0, marginBottom: '-16px' }],
    { duration: T.collapse, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).finished;
  el.remove();
}

async function unsendAll(msgEls) {
  playSfx('scratch');
  await Promise.all(msgEls.map(async (el, i) => {
    await wait(i * T.unsendGap);
    el.classList.remove('pending', 'a-stamp');
    el.classList.add('a-unsend');                 // red strike draws across
    await wait(240);
    if (!REDUCED) {
      await el.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-10px) rotate(-1.5deg) scale(0.97)' }],
        { duration: 220, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished;
    }
    el.getAnimations().forEach(a => a.cancel());
    el.className = 'msg member-msg deleted';
    el.innerHTML = '<div class="stub">⌫ This message was deleted</div>';
    el.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'ease-out' });
    await wait(T.stubHold);
    await collapseAway(el);
  }));
}

const reelItemH = () => reelStrip().firstElementChild?.offsetHeight || 58;
const reelY = pos => -(pos * reelItemH()) + ($('reelWin').clientHeight - reelItemH()) / 2 - 1.5;

function renderLevels() {
  reelStrip().innerHTML = Array.from({ length: reel.cycles }, () => LEVELS.map(l =>
    `<div class="reel-item" style="--lvl-color:var(--l${l.v})" aria-hidden="true"><span class="e">${l.emoji}</span><span class="n">${l.name}</span></div>`).join('')).join('');
  reel.pos = reel.mid * LEVELS.length + (state.level - 1);
  placeReel();
  syncLevels();
}

function placeReel() { reelStrip().style.transform = `translateY(${reelY(reel.pos)}px)`; }

function syncLevels() {
  const l = LEVELS[state.level - 1];
  const win = $('reelWin');
  win.setAttribute('aria-valuenow', String(l.v));
  win.setAttribute('aria-valuetext', l.name);
  $('chaosNum').textContent = `${l.v}/5`;
  $('chaosDesc').textContent = l.desc;
  const now = $('levelNow');
  now.textContent = `Chaos: ${l.name} ${l.emoji}`;
  now.style.setProperty('--lvl-color', `var(--l${l.v})`);
}

// Animate the strip to a position, ticking as each item passes the payline
async function animateReel(toPos, duration, easing) {
  const strip = reelStrip();
  const h = reelItemH();
  const offset = ($('reelWin').clientHeight - h) / 2 - 1.5;
  const anim = strip.animate([{ transform: `translateY(${reelY(reel.pos)}px)` }, { transform: `translateY(${reelY(toPos)}px)` }],
    { duration: REDUCED ? 1 : duration, easing, fill: 'forwards' });
  let last = reel.pos;
  const watch = () => {
    if (anim.playState !== 'running') return;
    const y = new DOMMatrix(getComputedStyle(strip).transform).m42;
    const idx = Math.round((offset - y) / h);
    if (idx !== last) { last = idx; playSfx('tick'); }
    requestAnimationFrame(watch);
  };
  requestAnimationFrame(watch);
  await anim.finished;
  reel.pos = toPos;
  placeReel();
  anim.cancel();
}

function machineLocked() { return state.busy || reel.spinning; }

async function stepLevel(delta) {
  if (machineLocked()) return;
  unlockAudio();
  const next = state.level + delta;
  if (next < 1 || next > LEVELS.length) {
    const win = $('reelWin');
    win.classList.remove('bump'); void win.offsetWidth; win.classList.add('bump');
    playSfx('thunk');
    return;
  }
  reel.spinning = true;
  await animateReel(reel.pos + delta, 260, 'cubic-bezier(.3,1.35,.5,1)');
  reel.spinning = false;
  setLevel(next);
}

async function pullLever() {
  if (machineLocked()) return;
  unlockAudio();
  const lever = $('lever');
  lever.classList.add('pulled');
  playSfx('lever');
  setTimeout(() => lever.classList.remove('pulled'), 220);
  const choices = LEVELS.map(l => l.v).filter(v => v !== state.level);
  const target = pickOne(choices);
  reel.spinning = true;
  // spin a few full cycles forward, then land on the target
  const base = (reel.mid + 3) * LEVELS.length;
  await animateReel(base + (target - 1), 1700, 'cubic-bezier(.12,.6,.12,1)');
  reel.pos = reel.mid * LEVELS.length + (target - 1);   // same face, recentred so we never run off the strip
  placeReel();
  const win = $('reelWin');
  win.classList.remove('jackpot'); void win.offsetWidth; win.classList.add('jackpot');
  reel.spinning = false;
  setLevel(target);
}

function initChaosMachine() {
  $('chaosUp').addEventListener('click', () => stepLevel(1));
  $('chaosDown').addEventListener('click', () => stepLevel(-1));
  $('lever').addEventListener('click', pullLever);
  const win = $('reelWin');
  win.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowRight'].includes(e.key)) { e.preventDefault(); stepLevel(1); }
    if (['ArrowDown', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); stepLevel(-1); }
  });
  let wheelLock = 0;
  win.addEventListener('wheel', e => {
    e.preventDefault();
    const t = performance.now();
    if (t - wheelLock < 280 || Math.abs(e.deltaY) < 4) return;
    wheelLock = t;
    stepLevel(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  // drag / swipe the reel
  let startY = null;
  win.addEventListener('pointerdown', e => { startY = e.clientY; win.setPointerCapture(e.pointerId); });
  win.addEventListener('pointerup', e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    startY = null;
    if (Math.abs(dy) > 14) stepLevel(dy < 0 ? 1 : -1);
  });
  win.addEventListener('pointercancel', () => { startY = null; });
  window.addEventListener('resize', () => { if (!reel.spinning) placeReel(); });
}

function setLevel(v) {
  if (state.busy || v === state.level) return;
  playSfx(`lvl${v}`);
  state.level = v;
  syncLevels();
  applyIntensity(v);

  const round = state.round;
  if (!round || !round.memberEls.length || !round.userEl.isConnected) return;

  // Debounced re-summon: replies dim while the user is still picking
  clearTimeout(state.resummonTimer);
  round.memberEls.forEach(el => el.classList.add('pending'));
  state.resummonTimer = setTimeout(() => resummon(round), T.debounce);
}

function cancelResummon() {
  clearTimeout(state.resummonTimer);
  state.resummonTimer = null;
  state.round?.memberEls.forEach(el => el.classList.remove('pending'));
}

async function resummon(round) {
  state.resummonTimer = null;
  if (state.busy || state.round !== round) return;
  setBusy(true);
  removeShotButton();
  await unsendAll(round.memberEls);
  round.memberEls = [];
  await runCouncil(round.question, round.userEl);
}

// ================================================================
//  ACTIONS
// ================================================================
function setBusy(on) {
  state.busy = on;
  els.send.disabled = on;
  els.rand.disabled = on;
  ['chaosUp', 'chaosDown', 'lever'].forEach(id => ($(id).disabled = on));
  $('reelWin').setAttribute('aria-disabled', String(on));
}

async function runCouncil(question, userEl) {
  setBusy(true);
  removeShotButton();
  const roundEl = userEl.parentElement;
  unfitRound(roundEl);
  setAllStatus('typing');
  const groupGhost = appendToStream(makeGhost(null), roundEl);
  setReceipt(userEl, 'Delivered');

  let members;
  try {
    members = await fetchCouncil(question);
  } catch (err) {
    groupGhost.remove();
    setAllStatus('idle');
    setReceipt(userEl, 'Not delivered');
    postSystem(err.message || 'Request failed. Send again.', true, { into: roundEl });
    playSfx('sad');
    setBusy(false);
    return;
  }

  setReceipt(userEl, `Read by ${members.length}`);
  setAllStatus('idle');

  const round = {
    question, userEl, members, memberEls: [],
    level: state.level, squadTitle: state.squadTitle,
    slots: members.map((m, i) => slotFor(m, i)),
    story: null,               // cached PNG blob
  };
  state.round = round;

  // Sequential reveal: each member types, their bubble lands, then you get time to read it
  state.skip = false;
  const skipBtn = members.length > 1 ? showSkip() : null;
  for (let i = 0; i < members.length; i++) {
    const m = members[i];
    const slot = slotFor(m, i);
    setStatus(slot, 'typing');
    const ghost = makeGhost(slot, m);
    if (i === 0) groupGhost.replaceWith(ghost);
    else roundEl.appendChild(ghost);
    scrollToBottom();
    await pace(typingTime(m.response));
    const msgEl = makeMember(m, slot);
    ghost.replaceWith(msgEl);
    playSfx('pop', slot);
    scrollToBottom();
    round.memberEls.push(msgEl);
    setStatus(slot, 'replied');
    if (i < members.length - 1) await pace(readTime(m.response));
  }
  skipBtn?.remove();
  if (!members.length) groupGhost.remove();

  const missing = state.members.length - members.length;
  if (missing > 0) {
    state.members.forEach((p, i) => {
      if (!members.some(m => m.name === p.name)) setStatus(i, 'left');
    });
    postSystem(`${missing} member${missing > 1 ? 's' : ''} left you on read`, false, { into: roundEl });
  }

  await dropReactions(round);
  setBusy(false);
  if (members.length) showShotButton(roundEl);
  await wait(REDUCED ? 0 : 500);
  fitRound(roundEl);
}

// "Skip" chip, pinned to the bottom of the chat while replies are coming in
function showSkip() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'skip-chip a-sys';
  b.textContent = 'Reading too slow? Skip ⏩';
  b.addEventListener('click', () => { state.skip = true; playSfx('zip'); b.remove(); });
  els.stream.appendChild(b);
  return b;
}

// ---------- fit the finished round on screen ----------
// Shrinks the whole round (question + replies) with CSS zoom until it fits the chat area,
// then scrolls so your question sits at the top. Older rounds keep whatever size they had.
const roundZoom = el => parseFloat(el.style.zoom || '1') || 1;
function unfitRound(el) { if (el) el.style.zoom = '1'; }

async function fitRound(el) {
  if (!el?.isConnected) return;
  const avail = els.stream.clientHeight - 36;
  const natural = el.getBoundingClientRect().height / roundZoom(el);
  const min = window.innerWidth <= 720 ? 0.68 : 0.62;
  const z = Math.max(min, Math.min(1, Math.floor((avail / natural) * 100) / 100));
  el.style.zoom = String(z);
  await wait(REDUCED ? 0 : 480);
  const top = el.getBoundingClientRect().top - els.stream.getBoundingClientRect().top + els.stream.scrollTop - 14;
  els.stream.scrollTo({ top, behavior: REDUCED ? 'auto' : 'smooth' });
}
let fitTimer;
window.addEventListener('resize', () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => { if (!state.busy && state.round) fitRound(state.round.userEl.parentElement); }, 250);
});

async function send() {
  if (state.busy) return;
  const question = els.input.value.trim();
  if (!question) { postSystem('Type a message before sending.', true); els.input.focus(); return; }

  cancelResummon();
  startMusicFor(question).then(() => playSfx('send'));   // must stay before any await: audio needs the user gesture

  els.input.value = '';
  autosize();

  removeWelcome();
  const userEl = postUser(question, newRound());
  await runCouncil(question, userEl);
  els.input.focus();
}

// Swap the header title with a quick slide (old text up and out, new text up and in)
async function swapTitle(text) {
  if (REDUCED || !els.squad.textContent) { els.squad.textContent = text; return; }
  await els.squad.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-70%)', opacity: 0 }],
    { duration: 160, easing: 'ease-in', fill: 'forwards' }).finished;
  els.squad.getAnimations().forEach(a => a.cancel());
  els.squad.textContent = text;
  els.squad.animate([{ transform: 'translateY(70%)', opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 300, easing: 'cubic-bezier(.2,.9,.25,1.15)' });
}

const flipOut = el => el.animate(
  [{ transform: 'perspective(700px) rotateY(0deg)', opacity: 1 }, { transform: 'perspective(700px) rotateY(90deg)', opacity: 0.4 }],
  { duration: T.flipOut, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
const flipIn = (el, delay) => el.animate(
  [{ transform: 'perspective(700px) rotateY(-90deg)', opacity: 0.4 },
   { transform: 'perspective(700px) rotateY(10deg)', opacity: 1, offset: 0.7 },
   { transform: 'perspective(700px) rotateY(0deg)', opacity: 1 }],
  { duration: T.flipIn, delay, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });

async function randomize(announce = true) {
  if (state.busy) return;
  if (announce) sound('dice');
  const prev = state.members;
  const squad = pickSquad(prev, state.squadTitle);
  cancelResummon();
  state.round = null;          // a new squad shouldn't rewrite the old squad's replies
  removeShotButton();
  state.members = squad.members;
  state.squadTitle = squad.title;

  if (!announce || !prev.length) {
    els.squad.textContent = squad.title;
    renderRail(true, announce ? 0 : T.boot - 150);
    return;
  }

  setBusy(true);
  const oldCards = [...els.rail.querySelectorAll('.member:not(.you)')];
  const oldAvatars = [...$('headAvatars').children];
  if (!REDUCED) {
    oldAvatars.forEach((el, i) => el.animate([{ transform: 'scale(1)' }, { transform: 'scale(0)' }],
      { duration: 160, delay: i * 40, easing: 'ease-in', fill: 'forwards' }));
    // each card turns away, staggered, like dealing a new hand
    await Promise.all(oldCards.map((el, i) =>
      wait(i * T.flipGap).then(() => { playSfx('flick'); return flipOut(el).finished; })));
  }
  swapTitle(squad.title);
  playSfx('slide', true);
  renderRail(false);
  if (!REDUCED) {
    els.rail.querySelectorAll('.member:not(.you)').forEach((el, i) => flipIn(el, i * T.flipGap));
    [...$('headAvatars').children].forEach((el, i) => el.animate(
      [{ transform: 'scale(0) rotate(-20deg)' }, { transform: 'scale(1.15)', offset: 0.7 }, { transform: 'none' }],
      { duration: 360, delay: 120 + i * 60, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' }));
  }
  postSquadChange(prev, state.members, squad.title);
  await wait(REDUCED ? 0 : state.members.length * T.flipGap + T.flipIn);
  setBusy(false);
}

function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 140) + 'px';
}

// Mood routing: keyword checks first (the emotion model can't tell an
// exam from a breakup), then the HuggingFace emotion label.
// Order matters: the first list that matches wins.
const MOOD_ORDER = ['desi', 'romantic', 'exam', 'money', 'gym', 'food', 'career'];
const MOOD_KEYWORDS = {
  desi:     /\b(mom|mummy|mumma|mummyji|papa|dad|daddy|parents|family|relatives|rishta|rishtey|shaadi|shadi|sharma|sharmaji|aunty|aunties|uncle|chacha|chachi|mausi|bua|beta|ghar|saas|bahu|in-laws|in laws|diwali|cousin|cousins|dadi|nani)\b/,
  romantic: /\b(love|crush|ex|exes|relationship|dating|date|dates|marry|marriage|married|breakup|break up|broke up|girlfriend|boyfriend|gf|bf|bae|flirt|flirting|romance|romantic|heartbreak|situationship|propose|proposal|divorce|cheat|cheated|cheating|feelings for|likes me|like him|like her|text him|text her|ghosted|ghosting|tinder|hinge|bumble|rizz|pyaar|pyar|ishq|mohabbat|jaanu|babu|dil)\b/,
  exam:     /\b(exam|exams|padhai|padhna|study|studying|boards|board exam|jee|neet|upsc|gate|marks|result|results|grades|gpa|cgpa|assignment|homework|deadline|viva|semester|backlog|kota|tuition|coaching|revision|syllabus|finals|midterms|college|class|classes|lecture|lectures|attendance|bunk|school|professor|teacher)\b/,
  money:    /\b(money|paisa|paise|crypto|bitcoin|btc|stock|stocks|invest|investing|investment|loan|emi|rich|broke|rent|bank|savings|sip|mutual fund|trading|trade|scam|bet|betting|lottery|budget|credit card|debt)\b/,
  gym:      /\b(gym|workout|diet|protein|fitness|weight|abs|run|running|marathon|cricket|football|sport|sports|exercise|bulk|bulking|cut|cutting|creatine|lift|lifting|yoga)\b/,
  food:     /\b(food|eat|eating|pizza|pineapple|biryani|samosa|maggi|chai|coffee|dinner|lunch|breakfast|cook|cooking|recipe|restaurant|swiggy|zomato|momos|burger|hungry|dessert|cake|paneer|dosa)\b/,
  career:   /\b(job|jobs|work|boss|salary|career|office|resign|resignation|quit|promotion|interview|fired|layoff|laid off|workplace|coworker|colleague|manager|hr|hire|hiring|startup|business|freelance|internship|intern|appraisal|increment|hustle|naukri|naukari|kaam|placement|placements|package|ctc|notice period|linkedin|corporate|wfh)\b/,
};

const HF_TO_MOOD = {
  joy: 'playful', sadness: 'sad', anger: 'anxious', fear: 'anxious',
  disgust: 'chaotic', surprise: 'philosophical', neutral: 'neutral',
};

async function classifyMood(text) {
  const t = text.toLowerCase();
  for (const mood of MOOD_ORDER) {
    if (MOOD_KEYWORDS[mood].test(t)) return mood;
  }
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emotion_text: text }),
    });
    const data = await res.json();
    return HF_TO_MOOD[data.emotion] ?? 'neutral';
  } catch {
    return 'neutral';
  }
}

const FADE_OUT = 0.45;  // seconds; crossfade = fade music bus out, swap, fade in
const FADE_IN = 0.9;

const music = {
  enabled: true,        // the sound toggle (music + effects)
  mood: null,           // mood currently built
  wanted: null,         // latest mood asked for (played when sound turns on)
  playing: false,
  token: 0,             // cancels stale crossfades
  master: null, comp: null, limiter: null, sfxBus: null,
  parts: [], nodes: [], fx: null,
};

// ---------- instrument helpers ----------
const track = node => { music.nodes.push(node); return node; };
const syn   = (opts, out) => track(new Tone.Synth(opts).connect(out));
const mono  = (opts, out) => track(new Tone.MonoSynth(opts).connect(out));
const poly  = (opts, out) => track(new Tone.PolySynth(Tone.Synth, opts).connect(out));
const keys  = (vol, out) => track(new Tone.PolySynth(Tone.FMSynth, {
  harmonicity: 3, modulationIndex: 1.6,
  oscillator: { type: 'sine' }, modulation: { type: 'sine' },
  envelope: { attack: 0.005, decay: 1.4, sustain: 0.25, release: 1.2 },
  modulationEnvelope: { attack: 0.005, decay: 0.4, sustain: 0.1, release: 0.5 },
  volume: vol,
}).connect(out));
// Plucked strings (harp, sitar, pizzicato, upright bass) built from a filtered
// saw/triangle with a fast filter decay. Tone's PluckSynth needs an AudioWorklet,
// which some browsers refuse to load, so we avoid it.
const pluck = (vol, out, bright = 3800, wave = 'sawtooth') => mono({
  oscillator: { type: wave },
  filter: { type: 'lowpass', Q: 2, rolloff: -24 },
  envelope: { attack: 0.002, decay: 0.45, sustain: 0, release: 0.25 },
  filterEnvelope: { attack: 0.001, decay: 0.18, sustain: 0, release: 0.2, baseFrequency: Math.max(120, bright / 8), octaves: 3 },
  volume: vol,
}, out);
const lowpass = (freq, out, q = 1) => track(new Tone.Filter({ frequency: freq, type: 'lowpass', Q: q }).connect(out));
const membrane = (opts, out) => track(new Tone.MembraneSynth(opts).connect(out));

// events: [time, note(s), duration?, velocity?]
function loopPart(synth, events, loopEnd, dur) {
  const p = new Tone.Part((t, e) => synth.triggerAttackRelease(e.n, e.d || dur, t, e.v ?? 1),
    events.map(([time, n, d, v]) => ({ time, n, d, v })));
  p.loop = true; p.loopEnd = loopEnd; p.start(0);
  music.parts.push(p);
}
// events: [time, anything] -> fn(t, value)
function loopFn(fn, events, loopEnd) {
  const p = new Tone.Part((t, e) => fn(t, e.v), events.map(([time, v]) => ({ time, v })));
  p.loop = true; p.loopEnd = loopEnd; p.start(0);
  music.parts.push(p);
}
// notes: flat array of single notes, null = rest
function stepSeq(synth, notes, sub, dur, vel = 1) {
  const s = new Tone.Sequence((t, n) => { if (n) synth.triggerAttackRelease(n, dur, t, vel); }, notes, sub);
  s.start(0);
  music.parts.push(s);
}

function drumKit(out, vol = {}) {
  const kick = membrane({ pitchDecay: 0.035, octaves: 5, envelope: { attack: 0.001, decay: 0.32, sustain: 0 }, volume: vol.kick ?? -10 }, out);
  const snareF = track(new Tone.Filter(1800, 'highpass').connect(out));
  const snare = track(new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: vol.snareDecay ?? 0.14, sustain: 0 }, volume: vol.snare ?? -20 }).connect(snareF));
  const hatF = track(new Tone.Filter(8000, 'highpass').connect(out));
  const hat = track(new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.03, sustain: 0 }, volume: vol.hat ?? -28 }).connect(hatF));
  return { kick, snare, hat };
}
// 16-step patterns per bar; 'x' = hit, 'o' = soft hit
function drumPattern(kit, pat) {
  const s = new Tone.Sequence((t, i) => {
    const v = c => (c === 'x' ? 1 : c === 'o' ? 0.45 : 0);
    if (v(pat.kick?.[i]))  kit.kick.triggerAttackRelease(pat.kickNote || 'C1', '8n', t, v(pat.kick[i]));
    if (v(pat.snare?.[i])) kit.snare.triggerAttackRelease('16n', t, v(pat.snare[i]));
    if (v(pat.hat?.[i]))   kit.hat.triggerAttackRelease('32n', t, v(pat.hat[i]));
  }, [...Array(16).keys()], '16n');
  s.start(0);
  music.parts.push(s);
}

// ---------- moods ----------
// build({ bus, reverb, delay, lead }): bus = dry, lead = lead line (gets grit at levels 4-5)
const MOODS = {
  // Lo-fi boom-bap: dusty electric piano, swung drums, vinyl crackle
  neutral: { label: '📻 Lo-fi lounge', bpm: 84, gain: 0.6, build({ bus, reverb, lead }) {
    Tone.Transport.swing = 0.28; Tone.Transport.swingSubdivision = '16n';
    const chorus = track(new Tone.Chorus(2.5, 3, 0.4).start().connect(reverb));
    const ep = keys(-15, lowpass(2600, chorus));
    const ch = [['D3','F3','A3','C4','E4'], ['G2','F3','B3','E4'], ['C3','E3','B3','D4'], ['A2','G3','C#4','F4']];
    loopPart(ep, ch.flatMap((c, b) => [[`${b}:0`, c, '2n', 0.8], [`${b}:2:2`, c, '4n', 0.55]]), '4m');
    const bass = mono({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.6, release: 0.3 }, filterEnvelope: { baseFrequency: 300, octaves: 1 }, volume: -8 }, bus);
    loopPart(bass, [['0:0','D2'],['0:2:2','A1'],['1:0','G1'],['1:2:2','D2'],['2:0','C2'],['2:2:2','G1'],['3:0','A1'],['3:2:2','E2']], '4m', '4n');
    const vib = syn({ oscillator: { type: 'sine' }, envelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.4 }, volume: -18 }, lead);
    stepSeq(vib, [null,null,'A4',null,'C5',null,null,'E5', null,null,'D5',null,null,'B4',null,null,
                  null,null,'G4',null,'B4',null,'D5',null, null,'C#5',null,null,'A4',null,null,null], '8n', '8n');
