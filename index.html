// Ask the worker once per visit whether it has the voice route
async function probeCloudVoice() {
  try {
    const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tts_probe: true }) });
    const data = await res.json().catch(() => ({}));
    voice.cloud = res.ok && data.tts === true;
    voice.hindi = res.ok && data.hindi === true;
  } catch { /* offline: decide on first use */ }
}

const hasDevanagari = t => /[\u0900-\u097F]/.test(t || '');
// Hindi voice when the character is desi (or a Hindi transcript came back) and the worker has Sarvam set up
function wantsHindi(m, prof) {
  return !!voice.hindi && (!!prof.hi || hasDevanagari(m.speak));
}

async function fetchCloudVoice(text, prof, hindi) {
  const req = hindi
    ? { tts_text: text, engine: 'hindi', speaker: prof.hsp || 'shubh', pace: prof.pace || 1, lang: prof.hlang || 'hi' }
    : { tts_text: text, engine: 'aura2', speaker: prof.sp || 'luna' };
  const key = JSON.stringify(req);
  if (voice.cache.has(key)) return voice.cache.get(key);
  const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(req) });
  if (!res.ok || !(res.headers.get('Content-Type') || '').startsWith('audio/')) throw new Error('No voice');
  const buf = await Tone.context.decodeAudioData(await res.arrayBuffer());
  voice.cache.set(key, buf);
  return buf;
}

function voiceOut() {
  ensureMaster();
  if (!music.voiceBus) {
    // gentle compression keeps voices present over the music without sounding processed
    const comp = new Tone.Compressor({ threshold: -22, ratio: 3, attack: 0.005, release: 0.15 }).connect(music.limiter);
    music.voiceBus = new Tone.Gain(1.15).connect(comp);
  }
  return music.voiceBus;
}

// Natural-sounding effects only: a room, a ghostly hall, or a phone/radio EQ
function buildVoiceFx(fx, nodes) {
  const keep = n => (nodes.push(n), n);
  const out = voiceOut();
  if (fx === 'hall')  return keep(new Tone.Reverb({ decay: 2.2, wet: 0.2 })).connect(out);
  if (fx === 'ghost') {
    const rev = keep(new Tone.Reverb({ decay: 4.5, wet: 0.42 })).connect(out);
    return keep(new Tone.Chorus({ frequency: 0.8, delayTime: 4, depth: 0.35, wet: 0.3 }).start()).connect(rev);
  }
  if (fx === 'radio') {
    const lp = keep(new Tone.Filter(3400, 'lowpass')).connect(out);
    return keep(new Tone.Filter(320, 'highpass')).connect(lp);
  }
  if (fx === 'speaker') {   // little smart-speaker: thin, bright, slightly boxy
    const lp = keep(new Tone.Filter(5000, 'lowpass')).connect(out);
    const peak = keep(new Tone.Filter({ type: 'peaking', frequency: 2200, gain: 5, Q: 1 })).connect(lp);
    return keep(new Tone.Filter(260, 'highpass')).connect(peak);
  }
  if (fx === 'megaphone') {   // stadium mic / TV studio shouting
    const lp = keep(new Tone.Filter(3200, 'lowpass')).connect(out);
    const dist = keep(new Tone.Distortion({ distortion: 0.3, wet: 0.5 })).connect(lp);
    return keep(new Tone.Filter(550, 'highpass')).connect(dist);
  }
  if (fx === 'pa') {   // railway platform tannoy: band-limited with a long echo
    const rev = keep(new Tone.Reverb({ decay: 3.2, wet: 0.35 })).connect(out);
    const echo = keep(new Tone.FeedbackDelay({ delayTime: 0.27, feedback: 0.32, wet: 0.35 })).connect(rev);
    const lp = keep(new Tone.Filter(3000, 'lowpass')).connect(echo);
    return keep(new Tone.Filter(400, 'highpass')).connect(lp);
  }
  if (fx === 'robot') {   // ring modulator (a 55 Hz wobble) mixed with a metallic comb, plus some dry voice
    const input = keep(new Tone.Gain(1));
    const dry = keep(new Tone.Gain(0.45)).connect(out);
    const comb = keep(new Tone.FeedbackDelay({ delayTime: 0.007, feedback: 0.55, wet: 0.5 })).connect(out);
    const ring = keep(new Tone.Gain(0)).connect(comb);
    const lfo = keep(new Tone.LFO({ frequency: 55, min: -1, max: 1 }).start());
    lfo.connect(ring.gain);
    input.connect(dry);
    input.connect(ring);
    return input;
  }
  return out;
}

function pickBrowserVoice(prof, hindiText = false) {
  const voices = window.speechSynthesis?.getVoices() || [];
  if (hindiText) {
    const hi = voices.find(v => /^hi/i.test(v.lang));
    if (hi) return hi;
  }
  const en = voices.filter(v => /^en/i.test(v.lang));
  const want = prof.lang || 'en-US';
  return en.find(v => v.lang.replace('_', '-') === want) || en.find(v => v.lang.replace('_', '-') === 'en-US') || en[0] || null;
}

// Ambience bed + music dip while a voice is speaking
function startVoiceBed(name, seconds) {
  duckStart(seconds);
  const key = BED_FOR[name];
  if (!key || !music.enabled || !window.Tone) return;
  try {
    stingInit();
    const now = Tone.now(), g = k.bus.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0.3, now + 0.1);
    const period = BED_PERIOD[key] || 1.7;
    for (let at = now + 0.05; at < now + seconds; at += period) { try { STINGS[key](at); } catch {} }
    k.bedEnd = now + seconds + 1.6;
  } catch {}
}
function endVoiceBed() {
  duckEnd();
  if (!k.ready) return;
  const now = Tone.now(), g = k.bus.gain;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 0.3);
  const back = Math.max(now + 0.35, k.bedEnd || 0);   // leftover bed events play silently, then stings return
  g.setValueAtTime(0, back); g.linearRampToValueAtTime(0.85, back + 0.05);
}
// The dip always schedules its own recovery, so music can never get stuck quiet
// (even if a voice fails silently and no "ended" event ever arrives).
function duckStart(seconds = 8) {
  if (!music.master || !music.playing || !music.mood) return;
  const g = music.master.gain, now = Tone.now(), full = moodGain(music.mood);
  const back = now + Math.min(30, Math.max(1, seconds)) + 0.4;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
  g.linearRampToValueAtTime(full * 0.3, now + 0.15);
  g.setValueAtTime(full * 0.3, back);
  g.linearRampToValueAtTime(full, back + 0.6);
}
function duckEnd() {
  if (!music.master || !music.playing || !music.mood) return;
  const g = music.master.gain, now = Tone.now();
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(moodGain(music.mood), now + 0.6);
}

function setSpeakingUI(el, on) {
  if (!el) return;
  el.classList.toggle('speaking', on);
  const b = el.querySelector('.say');
  if (b) { b.innerHTML = (on ? STOP_ICON : SPEAKER_ICON) + '<i class="ld" aria-hidden="true"></i>'; b.setAttribute('aria-label', `${on ? 'Stop' : 'Play'} voice`); }
  if (!on) el.classList.remove('voice-loading');
}

function finishVoice(cur, cancelSpeech = false) {
  if (voice.cur !== cur) return;
  voice.cur = null;
  clearTimeout(cur.safety);
  try { cur.player?.stop(); } catch {}
  setTimeout(() => cur.nodes.forEach(n => { try { n.dispose(); } catch {} }), 600);
  if (cancelSpeech && cur.utter) window.speechSynthesis?.cancel();
  endVoiceBed();
  setSpeakingUI(cur.el, false);
  updateMusicUI();
  cur.resolve();
}
function stopVoice() { voice.allToken++; voice.playingAll = false; if (voice.cur) finishVoice(voice.cur, true); updatePlayAll(); }

// Speak one member's reply. Resolves when it finishes or is stopped.
async function playVoice(m, el) {
  unlock('voice');
  if (voice.cur) finishVoice(voice.cur, true);
  const prof = voiceProfile(m.name);
  const text = speakable(m.response);
  if (!text) return;
  const hindiText = speakable(m.speak || '');   // Devanagari transcript from the worker, if any
  const token = ++voice.token;
  const cur = { el, name: m.name, nodes: [] };
  const done = new Promise(r => (cur.resolve = r));
  voice.cur = cur;
  setSpeakingUI(el, true);
  updateMusicUI();
  const ready = window.Tone ? Tone.start() : Promise.resolve();   // inside the click: unlock audio now

  // Browser voice: decide synchronously when we already know there's no cloud route (iOS needs the gesture)
  const speakBrowser = () => {
    if (!('speechSynthesis' in window)) { finishVoice(cur); return; }
    const useHi = hasDevanagari(hindiText) && (window.speechSynthesis.getVoices() || []).some(v => /^hi/i.test(v.lang));
    const u = new SpeechSynthesisUtterance(useHi ? hindiText : text);
    u.pitch = Math.min(2, Math.max(0, prof.pitch ?? 1));
    u.rate = Math.min(2, Math.max(0.5, prof.brate ?? 1));
    const v = pickBrowserVoice(prof, useHi);
    if (v) { u.voice = v; u.lang = v.lang; }
    cur.utter = u;
    const est = text.length / (14 * u.rate);
    u.onend = u.onerror = () => finishVoice(cur);
    cur.safety = setTimeout(() => finishVoice(cur), (est * 1.8 + 3) * 1000);  // some browsers never fire onend
    let started = false;
    u.onstart = () => { started = true; };
    // Safari can silently refuse speech that wasn't started by a tap: give up after 2.5 s instead of hanging
    setTimeout(() => { if (!started && voice.cur === cur) finishVoice(cur, true); }, 2500);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    ready.then(() => startVoiceBed(m.name, est));
  };

  if (voice.cloud === false || !window.Tone) { speakBrowser(); return done; }

  el?.classList.add('voice-loading');
  try {
    await ready;
    let buf;
    if (wantsHindi(m, prof)) {
      // Hindi voice reads the Devanagari transcript when we have one (much better than romanised Hinglish)
      try { buf = await fetchCloudVoice(hasDevanagari(hindiText) ? hindiText : text, prof, true); }
      catch { buf = null; }
    }
    if (!buf) buf = await fetchCloudVoice(text, prof, false);
    if (token !== voice.token || voice.cur !== cur) return done;
    voice.cloud = true;
    const input = buildVoiceFx(prof.fx, cur.nodes);
    const player = new Tone.Player(buf).connect(input);
    player.playbackRate = prof.rate || 1;
    cur.nodes.push(player);
    cur.player = player;
    player.onstop = () => finishVoice(cur);
    el?.classList.remove('voice-loading');
    startVoiceBed(m.name, buf.duration / (prof.rate || 1));
    player.start();
  } catch (e) {
    el?.classList.remove('voice-loading');
    if (token !== voice.token || voice.cur !== cur) return done;
    voice.cloud = false;   // no route on the worker: use browser voices from now on
    speakBrowser();
  }
  return done;
}

// "Play the chat": every reply of the latest round, one after another
async function playAll() {
  const round = state.round;
  if (!round?.memberEls.length) return;
  if (voice.playingAll) { stopVoice(); return; }
  const token = ++voice.allToken;
  voice.playingAll = true;
  updatePlayAll();
  for (let i = 0; i < round.memberEls.length; i++) {
    if (token !== voice.allToken || !round.memberEls[i].isConnected) break;
    round.memberEls[i].scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
    await playVoice(round.members[i], round.memberEls[i]);
    if (token !== voice.allToken) break;
    await wait(350);
  }
  if (token === voice.allToken) voice.playingAll = false;
  updatePlayAll();
}
function updatePlayAll() {
  document.querySelectorAll('.play-btn').forEach(b => {
    const on = !!voice.playingAll;
    b.innerHTML = on ? '<span class="ico" aria-hidden="true">■</span>Stop' : '<span class="ico" aria-hidden="true">▶</span>Play the chat';
  });
}

// Clicks on any 🔊 button in the stream
function onSayClick(e) {
  const b = e.target.closest('.say');
  if (!b) return;
  const el = b.closest('.msg');
  const round = state.round;
  const idx = round ? round.memberEls.indexOf(el) : -1;
  if (idx < 0) return;
  if (voice.cur?.el === el) { stopVoice(); return; }
  voice.allToken++; voice.playingAll = false; updatePlayAll();
  playVoice(round.members[idx], el);
}

const LEVEL_HEX = { 1: '#00E05A', 2: '#FFD600', 3: '#FF8A00', 4: '#FF3B00', 5: '#FF4FD8' };

// Speech-bubble tail as a PNG data URL: fill + 6px black outline on the two outer edges
const tailCache = {};
function tailSrc(fill) {
  if (tailCache[fill]) return tailCache[fill];
  const c = document.createElement('canvas');
  c.width = 46; c.height = 52;
  const g = c.getContext('2d');
  g.beginPath(); g.moveTo(46, 3); g.lineTo(4, 22); g.lineTo(46, 49); g.closePath();
  g.fillStyle = fill; g.fill();
  g.beginPath(); g.moveTo(46, 3); g.lineTo(4, 22); g.lineTo(46, 49);
  g.lineWidth = 6; g.lineJoin = 'miter'; g.strokeStyle = '#000'; g.stroke();
  g.fillStyle = fill; g.fillRect(40, 6, 6, 40);   // erase the bubble border under the tail
  return (tailCache[fill] = c.toDataURL('image/png'));
}

function buildStoryDOM(round) {

  const now = clock().slice(0, 5);
  const names = round.members.map(m => m.name).join(', ') + ', You';
  const root = document.createElement('div');
  root.id = 'storyRender';
  root.className = 'sx';
  root.innerHTML = `
    <div class="sx-status">
      <span>${now}</span>
      <span class="sx-sys">
        <span class="sx-signal"><i></i><i></i><i></i><i></i></span>

      </span>
    </div>
    <div class="sx-head">

      <div class="sx-sub"><span class="sx-members">${escHtml(names)}</span></div>
    </div>
    <div class="sx-chat">
      <div class="sx-day">Today ${now}</div>
      <div class="sx-msg sx-me">
        <div class="sx-col" style="align-items:flex-end">
          <div class="sx-bub"><img class="sx-tail" alt="" src="${tailSrc('#000')}"><span class="sx-txt"></span><span class="sx-time">${now}<span class="sx-ticks">✓✓</span></span></div>
        </div>
      </div>
      ${round.members.map((m, i) => {

        return `
        <div class="sx-msg" style="--accent:${a.bg};--tag-ink:${a.ink}">
          <div class="sx-av">${escHtml(m.emoji)}</div>
          <div class="sx-col">
            <div class="sx-tag">${escHtml(m.name)}</div>
            <div class="sx-bub"><img class="sx-tail" alt="" src="${tailSrc('#fff')}"><span class="sx-txt" data-i="${i}"></span><span class="sx-time">${now}</span>${reactFor(i)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>

    </div>`;
  // text via textContent so nothing from the model is ever parsed as HTML
  root.querySelector('.sx-me .sx-txt').textContent = round.question;
  root.querySelectorAll('.sx-txt[data-i]').forEach(t => {
    t.textContent = round.members[Number(t.dataset.i)].response;
  });
  return root;
}

// Shrink type until the chat fits; truncate the longest message only as a last resort
function fitStory(root) {
  const chat = root.querySelector('.sx-chat');
  const name = root.querySelector('.sx-name');
  for (let fs = 64; fs > 42 && name.scrollHeight > fs * 2.2; fs -= 4) name.style.fontSize = fs + 'px';
  const overflowing = () => chat.scrollHeight > chat.clientHeight + 1;
  for (let fs = 42; fs >= 22; fs -= 2) {
    chat.style.setProperty('--fs', fs + 'px');
    if (!overflowing()) return;
  }
  const texts = [...root.querySelectorAll('.sx-txt')];
  for (let guard = 0; guard < 80 && overflowing(); guard++) {
    const longest = texts.reduce((a, b) => (b.textContent.length > a.textContent.length ? b : a));
    const text = longest.textContent.replace(/\.\.\.$/, '');
    if (text.length < 40) break;
    longest.textContent = text.slice(0, Math.floor(text.length * 0.9)).replace(/[\s,.;:!?-]+$/, '') + '...';
  }
}

async function fontsReady() {
  if (!document.fonts) return;
  try {
    await Promise.all([
      document.fonts.load('800 60px "Archivo"'),
      document.fonts.load('500 40px "Archivo"'),
      document.fonts.load('400 30px "Space Mono"'),
      document.fonts.load('700 30px "Space Mono"'),
    ]);
    await document.fonts.ready;
  } catch { /* fall back to system fonts */ }
}

async function renderStory(round) {
  if (!window.html2canvas) throw new Error('Screenshot library failed to load. Check your connection and reload.');
  await fontsReady();
  const root = buildStoryDOM(round);
  document.body.appendChild(root);
  try {
    fitStory(root);
    const canvas = await html2canvas(root, {
      width: STORY_W, height: STORY_H, scale: 1, x: 0, y: 0,
      windowWidth: STORY_W, windowHeight: STORY_H, scrollX: 0, scrollY: 0,
      backgroundColor: '#F2F0E9', logging: false,
      // the live copy sits off-screen; move the clone into frame before painting
      onclone: doc => {
        const el = doc.getElementById('storyRender');
        el.style.left = '0px';
        el.style.top = '0px';
      },
    });
    const blob = await new Promise((res, rej) =>
      canvas.toBlob(b => (b ? res(b) : rej(new Error('Could not create the image.'))), 'image/png'));
    return blob;
  } finally {
    root.remove();
  }
}

// ---------- overlay + FLIP ----------
function storyFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `the-council-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
}

function sizeStoryCard() {
  const card = $('storyCard');
  const actions = $('storyActions').offsetHeight || 70;
  const maxH = window.innerHeight - actions - 72;
  const w = Math.min(window.innerWidth - 32, maxH * 9 / 16);
  card.style.width = `${Math.floor(w)}px`;
  card.style.height = `${Math.floor(w * 16 / 9)}px`;
}

function setStoryStatus(text) { $('storyStatus').textContent = text; }
function setStoryButtons(enabled) {
  $('storyDownload').disabled = !enabled;
  $('storyShare').disabled = !enabled;
}

// Where the card would sit if it were fitted inside the chat area, same proportions.
// Uniform scale only, so nothing ever looks squashed.
function fitInto(rect, card) {
  const to = card.getBoundingClientRect();
  const s = Math.min(rect.width / to.width, rect.height / to.height) * 0.9;
  const dx = rect.left + rect.width / 2 - (to.left + to.width / 2);
  const dy = rect.top + rect.height / 2 - (to.top + to.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${s})`;
}

async function openStory() {
  const round = state.round;
  if (story.open || state.busy || state.resummonTimer || !round?.members.length) return;
  story.open = true;
  unlock('story');
  stopVoice();
  story.lastFocus = document.activeElement;
  const token = ++story.token;

  // Start rendering right away; the animation runs while it works
  const cached = round.story;
  const render = cached ? Promise.resolve(cached) : renderStory(round).then(blob => (round.story = blob));

  const overlay = $('storyOverlay');
  const card = $('storyCard');
  const img = $('storyImg');
  img.hidden = true;
  img.removeAttribute('src');
  $('storyLoading').hidden = false;
  setStoryButtons(false);
  setStoryStatus('');

  // 1. viewfinder flash over the chat
  const from = els.stream.getBoundingClientRect();
  playSfx('shutter');
  if (!REDUCED) {
    const vf = document.createElement('div');
    vf.className = 'viewfinder';
    Object.assign(vf.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
    document.body.appendChild(vf);
    await wait(260);
    vf.remove();
  }

  // 2. the card rises out of the chat area and settles in the centre
  overlay.hidden = false;
  sizeStoryCard();
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  if (REDUCED) {
    overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
  } else {
    $('storyBackdrop').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'both' });
    $('storyActions').animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }],
      { duration: 340, delay: 260, fill: 'both', easing: 'cubic-bezier(.2,.9,.25,1.15)' });
    await card.animate([
      { transform: fitInto(from, card), opacity: 0 },
      { opacity: 1, offset: 0.3 },
      { transform: 'none', opacity: 1 },
    ], { duration: 520, easing: 'cubic-bezier(.2,.9,.25,1.08)' }).finished;
  }
  $('storyDownload').focus();

  // 3. swap the loading state for the rendered image
  try {
    const blob = await render;
    if (token !== story.token || !story.open) return;
    if (story.url) URL.revokeObjectURL(story.url);
    story.url = URL.createObjectURL(blob);
    story.file = new File([blob], storyFileName(), { type: 'image/png' });
    img.src = story.url;
    await img.decode().catch(() => {});
    if (token !== story.token || !story.open) return;
    $('storyLoading').hidden = true;
    img.hidden = false;
    img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
    setStoryButtons(true);
    setStoryStatus('');
  } catch (err) {
    if (token !== story.token) return;
    round.story = null;
    $('storyLoading').textContent = '! Render failed';
    setStoryStatus(err.message || 'Render failed. Go back and try again.');
  }
}

async function closeStory() {
  if (!story.open) return;
  playSfx('rewind');
  story.open = false;
  story.token++;
  const overlay = $('storyOverlay');
  const card = $('storyCard');
  if (!REDUCED) {
    const to = els.stream.getBoundingClientRect();
    $('storyActions').animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(16px)' }],
      { duration: 160, easing: 'ease-in', fill: 'forwards' });
    $('storyBackdrop').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, delay: 60, easing: 'ease-in', fill: 'forwards' });
    await card.animate([{ transform: 'none', opacity: 1 }, { opacity: 1, offset: 0.6 }, { transform: fitInto(to, card), opacity: 0 }],
      { duration: 380, easing: 'cubic-bezier(.5,0,.4,1)', fill: 'forwards' }).finished;
  } else {
    await overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished;
  }
  overlay.hidden = true;
  [overlay, card, $('storyBackdrop'), $('storyActions')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  $('storyLoading').textContent = '▮▮▮ Developing';
  (story.lastFocus?.isConnected ? story.lastFocus : els.input).focus();
}

function downloadStory(e) {
  if (!story.url || !story.file) return;
  if (e) playSfx('register');
  const a = document.createElement('a');
  a.href = story.url;
  a.download = story.file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setStoryStatus('Downloaded ' + story.file.name);
}

async function shareStory() {
  const file = story.file;
  if (!file) return;
  playSfx('share');
  // navigator.share must be the first await so the click still counts as a gesture
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'The Council', text: `Ask your own council: ${SHARE_URL}` });
      setStoryStatus('Shared');
      return;
    } catch (err) {
      if (err.name === 'AbortError') { setStoryStatus('Share cancelled'); return; }
    }
  }
  // Fallback: copy the link and download the image
  let copied = false;
  try { await navigator.clipboard.writeText(SHARE_URL); copied = true; } catch {}
  downloadStory();
  setStoryStatus(copied ? 'Link copied // Image downloaded' : 'Image downloaded // Share it from your photos');
}

function storyKeydown(e) {
  if (!story.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closeStory(); return; }
  if (e.key === 'Tab') {
    const btns = [...$('storyActions').querySelectorAll('button:not(:disabled)')];
    if (!btns.length) return;
    const first = btns[0], last = btns[btns.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!btns.includes(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
}

function gameLoad() {
  try { Object.assign(game.data, JSON.parse(localStorage.getItem('council-game') || '{}')); } catch {}
  game.shown = game.data.score;
}
function gameSave() { try { localStorage.setItem('council-game', JSON.stringify(game.data)); } catch {} }

// ---------- HUD ----------
function renderHud() {}

// ---------- toasts ----------
function toast(title, sub = '', kind = 'info') {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<div class="t-title"></div><div class="t-sub"></div>`;
  el.querySelector('.t-title').textContent = title;
  el.querySelector('.t-sub').textContent = sub;
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => {
    if (REDUCED) { el.remove(); return; }
    el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-14px)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' })
      .finished.then(() => el.remove());
  }, kind === 'ach' ? 3200 : 2200);
}

function unlock(id) {
  if (!ACHIEVEMENTS[id] || game.data.ach.includes(id)) return;
  game.data.ach.push(id);
  gameSave();
  const [name, desc] = ACHIEVEMENTS[id];
  toast(`🏆 ${name}`, desc, 'ach');
  playSfx('fanfare');
  confetti(40);
}

// ---------- juice ----------
function shake(power = 1) {
  if (REDUCED) return;
  const a = 3 * power;
  $('app').animate([{ transform: 'none' }, { transform: `translate(${a}px, ${-a}px)` }, { transform: `translate(${-a}px, ${a * 0.6}px)` },
    { transform: `translate(${a * 0.6}px, ${a}px)` }, { transform: 'none' }], { duration: 260, easing: 'steps(4)' });
}

function confetti(n = 30) {
  if (REDUCED) return;
  const colors = ['#FF3B00', '#0038FF', '#00E05A', '#FFD600', '#FF4FD8', '#000000'];
  const W = window.innerWidth;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = `${W / 2 + (Math.random() - 0.5) * 240}px`;
    const size = 6 + Math.random() * 8;
    c.style.width = `${size}px`; c.style.height = `${size * (Math.random() < 0.5 ? 1 : 0.5)}px`;
    document.body.appendChild(c);
    const dx = (Math.random() - 0.5) * W * 0.9, up = 140 + Math.random() * 220, rot = (Math.random() - 0.5) * 1080;
    c.animate([
      { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px, ${-up}px) rotate(${rot * 0.4}deg)`, opacity: 1, offset: 0.35 },
      { transform: `translate(${dx}px, ${window.innerHeight * 0.75}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 1500 + Math.random() * 700, easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' }).finished.then(() => c.remove());
  }
}

// ---------- events from the chat ----------
// New members met (randomize / first load): NEW! badges and a small bonus
function gameMeet(members, quiet = false) {
  const fresh = members.filter(p => !game.data.met.includes(p.name));
  fresh.forEach(p => game.data.met.push(p.name));
  els.rail.querySelectorAll('.member').forEach((card, i) => {
    if (fresh.includes(state.members[i])) card.classList.add('is-new');
  });
  gameSave();
  const metNow = game.data.met.filter(n => ROSTER_BY_NAME.has(n)).length;   // ignore members from older casts
  if (metNow >= 20) unlock('met20');
  if (metNow >= ROSTER.length) unlock('met50');
}

function gameRandomized(members) {
  game.data.randoms++;
  gameMeet(members);
  if (game.data.randoms >= 5) unlock('shuffle5');
}

function gameSpun(level) {
  game.data.spins++;
  gameSave();
  if (game.data.spins >= 3) unlock('spin3');
  if (level === 5) unlock('jackpot');
}

// Each reply landing: a bloop, and the window shakes on the wild levels
function gameReply(msgEl, slot = 0) {
  playSfx('pop', slot);
  if (state.level >= 4) shake(state.level === 5 ? 1.6 : 1);
}

function gameRound(round) {
  const d = game.data;
  const t = today();
  if (d.lastDay !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    d.streak = d.lastDay === y ? d.streak + 1 : 1;
    d.lastDay = t;
  }
  d.rounds++;
  if (round.level >= 4) confetti(round.level === 5 ? 50 : 26);
  unlock('first');
  if (d.rounds >= 10) unlock('rounds10');
  if (round.level === 5) unlock('feral');
  if (d.streak >= 3) unlock('streak3');
  if (new Date().getHours() < 4) unlock('night');
  gameSave();
}

// ================================================================
//  INIT
// ================================================================
(async function init() {
  if (window.matchMedia('(max-width: 720px)').matches) els.input.placeholder = 'Ask the council anything…';

  gameLoad();
  renderLevels();
  $('app').classList.add('a-boot');
  randomize(false);
  gameMeet(state.members, true);

  els.send.addEventListener('click', send);
  els.stream.addEventListener('click', e => { if (state.busy && !e.target.closest('button')) state.skip = true; });
  els.rand.addEventListener('click', () => randomize(true));
  els.stream.addEventListener('click', onSayClick);
  probeCloudVoice();
  window.speechSynthesis?.getVoices();   // start loading browser voices early
  $('soundBtn').addEventListener('click', toggleSound);
  $('soundBtn').addEventListener('mouseenter', () => viz.kick());
  $('soundBtn').addEventListener('mouseleave', () => viz.kick());
  $('storyDownload').addEventListener('click', downloadStory);
  $('storyShare').addEventListener('click', shareStory);
  $('storyBack').addEventListener('click', closeStory);
  document.addEventListener('keydown', storyKeydown);
  window.addEventListener('resize', () => { if (story.open) sizeStoryCard(); });
  updateMusicUI();
  els.input.addEventListener('input', autosize);
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });

  await wait(T.boot + state.members.length * T.stampGap);
  postDay();
  postSystem(`${state.members.length} members joined the chat`, false, { typed: true });
})();
</script>
